      box.querySelector("#lx-name").value="";box.querySelector("#lx-addr").value="";
      try{await S.db.collection(base()+"/locations").add({name:n.slice(0,120),address:a.slice(0,240),decors:[],createdAt:Date.now()});}catch(e){writeErr(e);}};
    box.querySelectorAll(".lx-n").forEach(i=>i.onchange=()=>{const v=i.value.trim();if(v)S.db.doc(base()+"/locations/"+i.dataset.lid).update({name:v}).catch(writeErr);});
    box.querySelectorAll(".lx-a").forEach(i=>i.onchange=()=>S.db.doc(base()+"/locations/"+i.dataset.lid).update({address:i.value.trim()}).catch(writeErr));
    box.querySelectorAll(".lx-del").forEach(b=>b.onclick=()=>S.db.doc(base()+"/locations/"+b.dataset.lid).delete().catch(writeErr));
    box.querySelectorAll(".lx-sel").forEach(sel=>sel.onchange=()=>assignDecor(sel.dataset.key,sel.value));
  };
  S.modalRefresh=draw;draw();
}
async function assignDecor(key,lid){
  try{
    for(const l of S.locations){if((l.decors||[]).includes(key)&&l.id!==lid)await S.db.doc(base()+"/locations/"+l.id).update({decors:(l.decors||[]).filter(k=>k!==key)});}
    const t=S.locations.find(l=>l.id===lid);if(t&&!(t.decors||[]).includes(key))await S.db.doc(base()+"/locations/"+t.id).update({decors:[...(t.decors||[]),key]});
  }catch(e){writeErr(e);}
}

/* plan automatique */
function buildAutoPlan(scenes,target8){
  const groups=new Map();
  for(const s of scenes){const l=lieuOf(s);const k=l?"l:"+l.id:"d:"+decorKey(s);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(s);}
  const dnRank=s=>s.dayNight==="J"?0:s.dayNight==="N"?2:1;
  const days=[];let cur=null,curE8=0;
  for(const list of [...groups.values()].sort((a,b)=>(a[0].order||0)-(b[0].order||0))){
    list.sort((a,b)=>dnRank(a)-dnRank(b)||(a.order||0)-(b.order||0));
    if(cur&&curE8>=target8*0.6){cur=null;}
    for(const s of list){const e=s.eighths||1;
      if(!cur||(curE8>0&&curE8+e>target8)){cur=[];days.push(cur);curE8=0;}
      cur.push(s.id);curE8+=e;}
  }
  return days;
}
function openAutoPlan(){
  const pool=S.scenes.filter(s=>!isPlanned(s));
  const m=modal(`<h3>Proposer un plan</h3>
    <p class="empty">L'outil regroupe les scènes par lieu de tournage (ou par décor quand le lieu n'est pas défini), met le jour avant la nuit, garde l'ordre du scénario dans chaque lieu, puis remplit les journées jusqu'à l'objectif de pages. Tu ajustes ensuite à la main.</p>
    <label class="row"><span class="label">Pages par jour</span><input type="number" id="ap-t" min="0.5" max="20" step="0.5" value="${esc(P()?.pagesPerDay||4)}"></label>
    <label class="row"><span class="label">Date de la première journée (facultatif)</span><input type="date" id="ap-d"></label>
    <fieldset class="row" style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px"><span class="label">Scènes concernées</span>
      <label><input type="radio" name="ap-s" value="pool" ${pool.length?"checked":"disabled"}> Seulement les ${pool.length} scène${pool.length>1?"s":""} à placer (ajoutées après les journées existantes)</label>
      <label><input type="radio" name="ap-s" value="all" ${pool.length?"":"checked"}> Tout replanifier : efface les ${S.days.length} journée${S.days.length>1?"s":""} actuelle${S.days.length>1?"s":""}</label></fieldset>
    <div id="ap-prev" class="empty"></div>
    <div class="mfoot"><button class="btn" id="ap-c">Annuler</button><button class="btn primary" id="ap-go">Créer le plan</button></div>`);
  const t=m.querySelector("#ap-t"),prev=m.querySelector("#ap-prev"),go=m.querySelector("#ap-go");
  const mode=()=>m.querySelector('input[name="ap-s"]:checked')?.value||"all";
  const calc=()=>{const sc=mode()==="all"?S.scenes:pool;const t8=Math.round((Number(t.value)||4)*8);const d=buildAutoPlan(sc,t8);
    prev.textContent=sc.length?`${d.length} journée${d.length>1?"s":""} pour ${sc.length} scène${sc.length>1?"s":""} (${fmtE(sc.reduce((a,s)=>a+(s.eighths||0),0))} pages).`:"Aucune scène à planifier.";go.disabled=!sc.length;return{sc,t8,d};};
  t.oninput=calc;m.querySelectorAll('input[name="ap-s"]').forEach(r=>r.onchange=calc);calc();
  m.querySelector("#ap-c").onclick=()=>m.remove();
  go.onclick=async()=>{const{d:plan,t8}=calc();go.disabled=true;go.textContent="Création…";
    try{
      const all=mode()==="all";
      if(all){await chunked(S.scenes.filter(s=>s.dayId),5,s=>S.db.doc(base()+"/scenes/"+s.id).update({dayId:null,dayPos:null}));await chunked([...S.days],5,x=>S.db.doc(base()+"/days/"+x.id).delete());}
      let order=all?0:S.days.reduce((a,x)=>Math.max(a,x.order||0),0);
      let date=m.querySelector("#ap-d").value||(all?"":nextDate());
      await S.db.doc("projects/"+S.pid).update({pagesPerDay:t8/8});
      for(const ids of plan){const ref=S.db.collection(base()+"/days").doc();order++;
        await ref.set({order,date:date||"",createdAt:Date.now()});
        await chunked(ids.map((sid,i)=>({sid,i})),5,({sid,i})=>S.db.doc(base()+"/scenes/"+sid).update({dayId:ref.id,dayPos:(i+1)*1024}));
        if(date){const x=new Date(date+"T12:00:00");x.setDate(x.getDate()+1);date=x.toISOString().slice(0,10);}}
      m.remove();toast(plan.length+" journée"+(plan.length>1?"s":"")+" créée"+(plan.length>1?"s":"")+". Ajuste en glissant les scènes.");
    }catch(e){m.remove();writeErr(e);}};
}

/* exports du plan */
function exportPlanCSV(){
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const rows=[["Jour","Date","Ordre","Scène","En-tête","Décor","Lieu de tournage","Adresse","INT/EXT","Jour/Nuit","Pages","Rôles"]];
  daysSorted().forEach((d,i)=>scenesOfDay(d.id).forEach((s,j)=>{const l=lieuOf(s);
    rows.push(["J"+(i+1),d.date||"",j+1,s.num,s.heading,s.location||"",l?.name||"",l?.address||"",s.intExt||"",s.dayNight==="N"?"Nuit":s.dayNight==="J"?"Jour":"",fmtE(s.eighths),[...castOf(s.id).values()].join(", ")]);}));
  S.scenes.filter(s=>!isPlanned(s)).forEach(s=>{const l=lieuOf(s);rows.push(["Non placée","","",s.num,s.heading,s.location||"",l?.name||"",l?.address||"",s.intExt||"",s.dayNight==="N"?"Nuit":s.dayNight==="J"?"Jour":"",fmtE(s.eighths),[...castOf(s.id).values()].join(", ")]);});
  save(slug(P()?.name)+"-plan-de-travail.csv","﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n"));
}
function exportPlanHTML(){
  const p=P();const BC={"INT-J":"#f4f4f1","EXT-J":"#f1c84b","INT-N":"#4c7bd0","EXT-N":"#3b9a5c"};
  const days=daysSorted().map((d,i)=>{const sc=scenesOfDay(d.id);const e8=sc.reduce((a,s)=>a+(s.eighths||0),0);
    return `<section><h2>J${i+1}${d.date?" · "+esc(fmtDate(d.date)):""} <small>${fmtE(e8)} p. · ${sc.length} scènes</small></h2>

    ${sc.map(s=>{const l=lieuOf(s);return`<tr><td style="background:${BC[bandKey(s)]||"#ccc"};width:8px"></td><td><b>${esc(s.num)}</b></td><td>${esc(s.location||s.heading)}<br><small>${esc(s.synopsis||"")}</small></td><td>${esc(l?.name||"")}${l?.address?"<br><small>"+esc(l.address)+"</small>":""}</td><td>${esc(s.intExt||"")}</td><td>${s.dayNight==="N"?"Nuit":s.dayNight==="J"?"Jour":""}</td><td>${fmtE(s.eighths)}</td><td>${esc([...castOf(s.id).values()].join(", "))}</td></tr>`;}).join("")}
    </tbody></table></section>`;}).join("");
  const html=`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${esc(p?.name)} — plan de travail — DDC Breakdown</title><style>
  body{font-family:Helvetica,Arial,sans-serif;margin:12mm;color:#111}h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:18px 0 6px;border-bottom:2px solid #111;padding-bottom:3px}h2 small{font-weight:400;color:#555}
  table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top}th{background:#eee;font-size:10.5px;text-transform:uppercase}small{color:#555}section{page-break-inside:avoid}</style></head>
  <body><h1>${esc(p?.name||"")} · Plan de travail</h1><div style="font-size:12px;color:#555">DDC Breakdown · ${daysSorted().length} journées</div>${days}</body></html>`;
  save(slug(p?.name)+"-plan-de-travail.html",html);
}

/* ---------- tabs + keyboard ---------- */
function goTab(t){if(S.tab===t)return;flushEditor().then(()=>{S.tab=t;$("#desk").innerHTML="";render();});}
$("#tab-script").onclick=()=>goTab("script");
$("#tab-scenes").onclick=()=>goTab("scenes");
$("#tab-reports").onclick=()=>goTab("reports");
$("#tab-plan").onclick=()=>goTab("plan");
window.addEventListener("beforeunload",()=>{if(ED.dirty.size)flushEditor();});
document.addEventListener("keydown",e=>{
  if(S.tab!=="scenes"||!S.pid||popEl||document.querySelector(".scrim"))return;
  const t=e.target;if(t.closest&&t.closest("input,textarea,select,[contenteditable]"))return;
  const i=S.scenes.findIndex(s=>s.id===S.sid);
  if((e.key==="ArrowDown"||e.key==="j")&&i<S.scenes.length-1){e.preventDefault();selectScene(S.scenes[i+1].id);}
  if((e.key==="ArrowUp"||e.key==="k")&&i>0){e.preventDefault();selectScene(S.scenes[i-1].id);}
});

boot();
</script>
