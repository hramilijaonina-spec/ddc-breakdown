<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1d1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dydz Studio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
#ddc-gate{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:8vh max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
#ddc-gate textarea{width:100%;font-family:var(--f-script);font-size:12.5px}
#ddc-gate code{font-size:12.5px;background:var(--sunk);padding:1px 4px;border-radius:3px}
.ddc-err{color:var(--danger);margin:0}
.ddc-ok{color:var(--ok);margin:0}
.ddc-acct{position:relative}
.ddc-badge{position:absolute;top:-4px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;border:2px solid var(--surface)}
.ddc-badge-in{color:var(--danger)}
.ddc-rq{margin:6px 0 4px;border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--surface))}
.ddc-rq-a{display:flex;gap:6px;flex:0 0 auto;align-items:center}
.ddc-role{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:3px 6px;font-size:12.5px;color:var(--fg)}
.ddc-team div{flex-wrap:wrap}
.ddc-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.ddc-or::before,.ddc-or::after{content:"";flex:1;height:1px;background:var(--line)}
.ddc-link{display:flex;gap:8px;flex-wrap:wrap}
.ddc-link input{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 10px;color:var(--fg)}
.ddc-acct{border:0;background:transparent;padding:0;border-radius:50%;width:32px;height:32px;flex:0 0 auto}
.ddc-acct img{width:32px;height:32px;border-radius:50%;display:block}
.ddc-team{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r)}
.ddc-team div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line)}
.ddc-team div:last-child{border-bottom:0}
.ddc-team small{color:var(--muted)}
.ddc-net{font-size:12px;font-weight:600;padding:3px 9px;border-radius:12px;white-space:nowrap}
.ddc-net.off{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line))}
.ddc-net.sync{background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line))}
.modal input[type=password]{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 9px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="adapter.js"></script>
</head>
<body>
<title>Dydz Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Permanent+Marker&family=Share+Tech+Mono&family=Courier+Prime:wght@400;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* Layout: three-pane production desk — stripboard list · script page · breakdown sheet. Stacks on phones. */
:root{
  --bg:#1c1d1f; --surface:#26272a; --sunk:#202123; --line:#37393d; --line-strong:#4b4e53;
  --fg:#ecebe6; --muted:#a4a39c; --accent:#f2c94c; --accent-fg:#2a2100; --accent-soft:#3b3317;
  --danger:#ff7b82; --ok:#5fd394; --warn:#f29a4a; --page:#2a2b2e;
  --strip-intj:#d9dde0; --strip-extj:#e3bd45; --strip-intn:#5f8ce0; --strip-extn:#4db374; --strip-mix:#6b7680;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-script:"Courier Prime","Courier New",Courier,monospace;
  --r:6px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:6px 11px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.small{padding:3px 8px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],textarea,select{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 9px}
textarea{resize:vertical}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px;line-height:1}
.brand .logo{display:inline-flex;align-items:center;justify-content:center;height:24px;padding:0 6px;border-radius:3px;background:var(--fg);color:var(--surface);font-size:16px;letter-spacing:.06em}
.brand .ver{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:2px 7px;align-self:center}
.brand .logo img{height:24px;width:auto;display:block}
.proj{display:flex;align-items:center;gap:6px;min-width:0}
.proj select{max-width:240px;font-weight:600}
.tabs{display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:2px}
.tabs button{border:0;background:transparent;padding:4px 12px;border-radius:4px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.spacer{flex:1}
.peers{display:flex;align-items:center}
.peers img{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px;background:var(--sunk)}
.peers img:first-child{margin-left:0}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.progress{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.progress .bar{width:110px;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.progress .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.banner{padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--accent-soft);font-size:13px;border-bottom:1px solid var(--line)}

/* desk */
.desk{flex:1;min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr) 370px}
.pane{min-height:0;overflow:auto}
.list{border-right:1px solid var(--line);background:var(--surface)}
.list-head{position:sticky;top:0;background:var(--surface);z-index:2;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.list-head input{flex:1;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted);padding:6px 12px;border-bottom:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:2px;border:1px solid var(--line-strong)}
.sc-pick{display:none;grid-template-columns:8px 40px minmax(0,1fr) auto 26px;gap:0 8px;align-items:center;width:100%;min-height:54px;text-align:left;border:0;background:var(--surface);padding:0 10px 0 0;color:var(--fg)}
.sc-pick .band{align-self:stretch}
.sc-pick .num{font-family:var(--f-display);font-weight:700;font-size:22px;text-align:right;font-variant-numeric:tabular-nums}
.sc-pick .hd{font-weight:600;font-size:13px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-pick .side{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sc-pick .chev{width:26px;height:26px;padding:4px;border:1px solid var(--line-strong);border-radius:6px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.sc-pick:active{background:var(--sunk)}
.sc-drop{display:contents}
.strip{display:grid;grid-template-columns:8px 42px minmax(0,1fr) auto;gap:0 8px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:7px 10px 7px 0}
.strip:hover{background:var(--sunk)}
.strip[aria-current=true]{background:var(--accent-soft)}
.strip .band{align-self:stretch;margin-block:-7px}
.strip .num{font-family:var(--f-display);font-weight:700;font-size:19px;text-align:right;font-variant-numeric:tabular-nums}
.strip .hd{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.01em}
.strip .meta{grid-column:3/5;display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--muted)}
.strip .side{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.st{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:9px;border:1px solid currentColor;line-height:1.5}
.st.todo{color:var(--muted)}
.st.ai{color:var(--warn)}
.st.ok{color:var(--ok)}
.dots{display:inline-flex;gap:2px}
.dots b{width:8px;height:8px;border-radius:50%;display:inline-block}
.spin{width:10px;height:10px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* script page */
.scriptpane{padding:20px max(16px,2.5vw)}
.scene-head{max-width:720px;margin:0 auto 14px;display:flex;flex-direction:column;gap:10px}
.sh-row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.bignum{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:.9;min-width:56px;font-variant-numeric:tabular-nums}
.sh-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.sh-title{font-family:var(--f-script);font-weight:700;font-size:16px;text-transform:uppercase;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.tag.band{display:inline-flex;gap:6px;align-items:center}
.tag.band i{width:10px;height:10px;border-radius:2px;border:1px solid var(--line-strong)}
.eighths{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.eighths button{border:0;background:var(--sunk);width:22px;height:22px;font-weight:700}
.eighths span{padding:0 8px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.synopsis{width:100%;min-height:40px;font-size:13.5px}
.page{max-width:720px;margin:0 auto;background:var(--page);border:1px solid var(--line);box-shadow:0 1px 3px rgb(0 0 0 / .06);padding:36px clamp(16px,6%,60px) 48px;font-family:var(--f-script);font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
/* dépouillement : même mise en page que l'éditeur */
.page.sp{white-space:normal;line-height:1.35}
/* dépouillement : le scénario sur fond clair, pour le distinguer des menus et de la fiche */
.page.sp{background:#e6e7e8;color:#1b1d20;border-color:#c8cacd;box-shadow:0 2px 10px rgb(0 0 0 / .35)}
.page.sp .empty{color:#5d6268}
.page.sp mark.hl{background:color-mix(in srgb,var(--c) 30%,transparent);color:inherit}
.page.sp mark.hl.found{background:color-mix(in srgb,var(--c) 50%,transparent)}
.page.sp mark.hl.found-cur{background:var(--c);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}
.page.sp ::selection{background:#9cc7ff;color:#111}
.page.sp .sb-h{margin-top:0;margin-bottom:.2em}
.page.sp .sb{min-height:0}
.page.sp .sb-c mark.hl{text-transform:uppercase}
@media (max-width:560px){.page.sp .sb-c{margin-left:28%}.page.sp .sb-p{margin-left:18%;width:64%}.page.sp .sb-d{margin-left:8%;width:84%}}
.page .hline{font-weight:700;text-transform:uppercase;display:block;margin-bottom:1em}
mark.hl{background:color-mix(in srgb,var(--c) 24%,transparent);color:inherit;border-bottom:2px solid var(--c);border-radius:2px;padding:0 1px;cursor:pointer}
.hint{max-width:720px;margin:10px auto 0;font-size:12.5px;color:var(--muted)}

/* breakdown sheet */
.sheet{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column}
.sheet-sec{padding:14px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1}
.cat{display:flex;flex-direction:column;gap:6px}
.cat-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.cat-h i{width:11px;height:11px;border-radius:2px;background:var(--c)}
.cat-h small{color:var(--muted);font-weight:500}
.els{display:flex;flex-wrap:wrap;gap:5px}
.el{display:inline-flex;align-items:center;gap:4px;border:1px solid color-mix(in srgb,var(--c) 55%,var(--line));background:color-mix(in srgb,var(--c) 12%,var(--surface));border-radius:4px;padding:2px 4px 2px 7px;font-size:12.5px;max-width:100%}
.el span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el button{border:0;background:transparent;color:var(--muted);padding:0 3px;line-height:1;font-size:14px}
.el button:hover{color:var(--danger)}
.el.manual{border-style:dashed}
.el-name{cursor:pointer;border-radius:2px}.el-name:hover{text-decoration:underline}
.el-name:focus-visible{outline:2px solid var(--c);outline-offset:1px}
.el.on{outline:2px solid var(--c);outline-offset:1px;background:color-mix(in srgb,var(--c) 26%,var(--surface))}
.findwrap{position:sticky;top:8px;height:0;z-index:6}
.findbar{position:absolute;right:8px;top:0;display:flex;align-items:center;gap:6px;max-width:calc(100% - 16px);padding:5px 6px 5px 8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 6px 18px rgb(0 0 0 / .35);font-size:13px}
.findbar i{flex:0 0 auto;width:10px;height:10px;border-radius:2px;background:var(--c)}
.findbar b{min-width:0;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.findbar .fcount{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;margin-right:2px}
.findbar button{flex:0 0 auto;width:28px;height:28px;padding:0;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--fg);font-size:15px;line-height:1}
.findbar button:hover:not(:disabled){border-color:var(--c)}
.findbar button:disabled{opacity:.4}
mark.hl.found{background:color-mix(in srgb,var(--c) 42%,transparent)}
mark.hl.found-cur{background:var(--c);color:#141414;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.addrow select{flex:0 0 auto;max-width:150px}
.addrow input{flex:1;min-width:120px}
.empty{color:var(--muted);font-size:13px}
.comments{display:flex;flex-direction:column;gap:10px}
.cm{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px}
.cm img{width:24px;height:24px;border-radius:50%}
.cm .who{font-size:12px;font-weight:600}
.cm .who small{font-weight:400;color:var(--muted);margin-left:6px}
.cm p{margin:2px 0 0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.cm .del{border:0;background:transparent;color:var(--muted);font-size:11.5px;padding:0;margin-left:6px}
.composer{display:flex;flex-direction:column;gap:6px}

/* reports */
.reports{grid-column:1/-1;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.rp-inner{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline}
.stat b{font-family:var(--f-display);font-size:30px;font-weight:700;display:block;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{border:1px solid var(--line-strong);background:var(--surface);border-radius:14px;padding:3px 10px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.fchip i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.fchip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
tr.catrow td{background:var(--sunk);font-weight:600;font-size:12.5px}
.scref{border:1px solid var(--line);background:var(--sunk);border-radius:3px;padding:0 5px;margin:1px 3px 1px 0;font-size:12px;font-family:var(--f-display);font-weight:600}
.scref:hover{border-color:var(--accent)}
.nameedit{border:0;background:transparent;padding:0;text-align:left;font-weight:500;border-bottom:1px dotted var(--line-strong)}



/* barre d'onglets principale : onglets intercalaires, une couleur par section */
:root{--t-script:#3b7fd4;--t-dec:#f0a030;--t-scenes:#e0392f;--t-plan:#6fae45}
.tabbar{--tc:var(--t-scenes);display:flex;align-items:flex-end;gap:4px;background:var(--bg);padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:7px solid var(--tc);overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.tabbar::-webkit-scrollbar{display:none}
.tabbar[data-active=script]{--tc:var(--t-script)}.tabbar[data-active=dec]{--tc:var(--t-dec)}.tabbar[data-active=scenes]{--tc:var(--t-scenes)}.tabbar[data-active=plan]{--tc:var(--t-plan)}

/* découpage technique */
.dc *,.dc *::before,.dc *::after{box-sizing:border-box}
.dc{grid-column:1/-1;overflow:auto;min-height:0;padding-bottom:60px;--dc-frame:#2c3237}
.dc-bar{position:sticky;top:0;z-index:4;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.dc-bar .stats{gap:6px 24px}.dc-bar .stat b{font-size:24px}.dc-bar .stat b small{font-size:15px;color:var(--muted)}
.dc-bar .actions{margin-left:auto}
.dc-bar .target input{width:70px}
.dc-inner{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dc-note{margin-top:18px;border:1px dashed var(--line-strong);border-radius:8px;padding:14px 16px;color:var(--muted);font-size:13.5px;max-width:80ch}

.dc-scene{margin-top:26px}
.dc-sh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-bottom:8px;border-bottom:2px solid var(--t-dec)}
.dc-sh .n{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;color:var(--t-dec);font-variant-numeric:tabular-nums}
.dc-sh .h{flex:1 1 280px;min-width:0;font-family:var(--f-script);font-weight:700;font-size:14.5px;text-transform:uppercase}
.dc-sh .m{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dc-syn{margin:8px 0 0;color:var(--muted);font-size:13px}
.dc-shot{display:grid;grid-template-columns:150px 290px minmax(0,1.15fr) minmax(0,1fr);gap:12px 18px;padding:14px 0;border-bottom:1px solid var(--line)}
.dc-shot.dc-flash{animation:dcf 1.2s ease-out}
@keyframes dcf{from{background:color-mix(in srgb,var(--t-dec) 18%,transparent)}to{background:transparent}}
.dc-id{display:flex;flex-direction:column;gap:6px;min-width:0}

.dc-frame{width:150px;max-width:100%;aspect-ratio:16/9;border-radius:4px;background:var(--dc-frame);overflow:hidden;border:1px solid var(--line-strong);padding:0;display:block;position:relative;color:inherit}
button.dc-frame{cursor:pointer}

button.dc-frame::after{content:"Modifier";position:absolute;left:0;right:0;bottom:0;padding:3px 0;font-size:11px;font-weight:600;letter-spacing:.04em;text-align:center;background:var(--fg);color:var(--bg);opacity:0;transition:opacity .15s}

.dc-ph{fill:var(--fg)}.dc-scr{fill:var(--t-dec)}.dc-ln{fill:var(--dc-frame)}
.dc-tl{font-size:12.5px;color:var(--muted)}

.dct-cam{width:175px}.dct-cam b{font-weight:600}.dct-cam span{color:var(--muted);font-size:12.5px}.dct-cam .dc-fx{margin-top:4px;color:var(--accent)}
.dct-thumb{width:160px;padding:8px!important}.dct-thumb .dc-frame{width:140px}

.dct tr.dc-flash td{animation:dcf 1.2s ease-out}

.dct tr.opt:hover td:not(.dct-seq),.dct tr.opt:focus-within td:not(.dct-seq){opacity:.75}
.dc-hl{position:relative}

.dc-hl-bg .q{color:var(--accent)}
.dct td.ed .dc-hl textarea{position:relative;z-index:1;color:transparent;caret-color:var(--fg);background:transparent!important;overflow-wrap:break-word}
.dc-hl:hover .dc-hl-bg{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.dc-hl:focus-within .dc-hl-bg{background:var(--sunk)}
.icbtn{padding:6px 8px}.icbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

.dc-switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:transform .15s}
.dc-switch input:checked+.tr{background:var(--t-dec)}

.dc-bar .menubtn{flex:0 0 auto}
.dcm .dc-switch{flex-direction:row;align-items:center}

.dcm-ex{display:flex;flex-direction:column;gap:6px}

  position:fixed;inset:0;z-index:90;display:block;overflow-y:auto;overflow-x:hidden;background:var(--cl-slate);color:var(--cl-chalk);font-family:var(--cl-f-label);color-scheme:dark;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}

/* ---------- tiny helpers ---------- */

/* ---------- in-memory fallback store (when the page runs outside claude.ai) ---------- */
class MemDB{
  constructor(){this.cols=new Map();this.subs=new Map();}
  _col(p){if(!this.cols.has(p))this.cols.set(p,new Map());return this.cols.get(p);}
  _emit(p){const m=this._col(p);const docs=[...m.entries()].map(([id,d])=>({id,exists:true,data:()=>d}));(this.subs.get(p)||[]).forEach(cb=>queueMicrotask(()=>cb({docs,size:docs.length,empty:!docs.length})));}
  _split(path){const i=path.lastIndexOf("/");return[path.slice(0,i),path.slice(i+1)];}
  doc(path){const[c,id]=this._split(path);return this._ref(c,id);}
  _ref(c,id){const self=this;return{id,path:c+"/"+id,
    async get(){const d=self._col(c).get(id);return{id,exists:!!d,data:()=>d};},
    async set(d){self._col(c).set(id,JSON.parse(JSON.stringify(d)));self._emit(c);},
    async update(d){const cur=self._col(c).get(id);if(!cur)throw{code:"invalid_argument"};self._col(c).set(id,{...cur,...JSON.parse(JSON.stringify(d))});self._emit(c);},
    async delete(){self._col(c).delete(id);self._emit(c);}};}
  collection(path){const self=this;return{path,
    doc(id){return self._ref(path,id||uid());},
    async add(d){const r=self._ref(path,uid());await r.set(d);return r;},
    onSnapshot(cb){if(!self.subs.has(path))self.subs.set(path,[]);self.subs.get(path).push(cb);self._emit(path);return()=>{const a=self.subs.get(path);a.splice(a.indexOf(cb),1);};}};}
}

/* ---------- boot ---------- */
function showVersion(){const v=$("#app-ver");if(v){v.textContent="v"+APP_VERSION;v.title="Version "+APP_VERSION+" · "+APP_DATE;}}
async function boot(){

  }
  if(S.local){const lp=$("#localpill");if(lp){lp.hidden=false;lp.onclick=()=>toast(lp.title,6000);}}
  S.canComment=S.canWrite||S.role==="commenter";
  if(S.role==="viewer")showBanner("Accès lecteur : tu peux consulter et exporter. Pour commenter ou modifier, demande un autre rôle à l'administrateur.");

    room.onPeers(ch=>{S.peers=ch.peers;renderPeers();renderList();});
  }
  db.collection("projects").onSnapshot(snap=>{
    S.projects=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    S.projectsLoaded=true;
    if(S.pid&&!P())S.pid=null;
    if(!S.pid){const last=store.get("dep.pid");const pick=S.projects.find(p=>p.id===last)||S.projects[0];if(pick)openProject(pick.id);else render();}
    else render();
  },err=>{showBanner("Impossible de charger les projets ("+err.code+"). Recharge la page.");});
}
function showBanner(t){const b=$("#banner");b.innerHTML=`<span>${esc(t)}</span><button type="button" class="banner-x" aria-label="Fermer le message">×</button>`;b.hidden=false;b.querySelector(".banner-x").onclick=()=>{b.hidden=true;};}

function openProject(pid){
  S.home=false;store.set("dep.seen."+pid,String(Date.now()));

  const pp=S.projects.find(p=>p.id===pid);if(pp)store.set("dep.ep."+seriesKey(pp),pid);
  const b=base();const onErr=e=>toast("Synchronisation interrompue ("+e.code+")");

function openSearch(){
  if(document.querySelector(".srch"))return;
  const m=modal(`<div class="srch"><input type="search" id="sq" placeholder="${S.pid&&!S.home?"Scène, personnage, accessoire, plan…":"Nom du projet…"}" aria-label="Rechercher" autocomplete="off"><div class="sr" id="sr" role="listbox"></div><p class="empty sr-hint">↑ ↓ pour choisir · Entrée pour ouvrir · Échap pour fermer</p></div>`);
  m.querySelector(".modal").classList.add("srch-m");
  const q=m.querySelector("#sq"),box=m.querySelector("#sr");let res=[],sel=0;
  const hit=(txt,k)=>{const n=norm(txt);const i=n.indexOf(k);return i<0?null:String(txt).slice(Math.max(0,i-30),i+k.length+50).replace(/\s+/g," ");};
  const run=()=>{const k=norm(q.value);res=[];
    if(!S.pid||S.home){for(const g of seriesGroups())if(!k||norm(g.name).includes(k))res.push({kind:"Projet",title:g.name||"Sans titre",sub:g.items.length>1?g.items.length+" épisodes":"",go:()=>openProject(g.items[0].id)});}
    else if(k.length>=2){
      for(const s of S.scenes){const h=norm(s.num+" "+s.heading).includes(k)?"":hit((s.synopsis||"")+" "+(s.body||""),k);
        if(norm(s.num+" "+s.heading).includes(k)||h)res.push({kind:"Scène",title:s.num+" · "+s.heading,sub:h||"",go:()=>{leaveHome();S.tab="scenes";$("#desk").innerHTML="";selectScene(s.id);}});}
      const seen=new Set();
      for(const e of S.elements){if(!norm(e.name).includes(k))continue;const s=scene(e.sceneId);if(!s)continue;const key=e.id;if(seen.has(key))continue;seen.add(key);
        res.push({kind:CAT[e.cat]?.label||"Élément",color:CAT[e.cat]?.color,title:e.name,sub:"scène "+s.num+" · "+s.heading,go:()=>{leaveHome();S.tab="scenes";$("#desk").innerHTML="";selectScene(s.id);setTimeout(()=>findStart(e.id),250);}});}
      for(const x of S.shots){const h=hit((x.action||"")+" "+(x.sound||"")+" "+(x.notes||""),k);if(!h)continue;const s=scene(x.sceneId);
        res.push({kind:"Plan",title:"Plan "+shotNum(x)+(s?" · "+s.heading:""),sub:h,go:()=>{leaveHome();goTab("dec");setTimeout(()=>{const r=document.getElementById("dc-"+x.id);if(r){r.scrollIntoView({block:"center"});r.classList.add("dc-flash");setTimeout(()=>r.classList.remove("dc-flash"),1300);}},400);}});}
    }
    res=res.slice(0,60);sel=0;draw();};
  const draw=()=>{box.innerHTML=res.length?res.map((r,i)=>`<button type="button" role="option" class="sr-i" data-i="${i}" aria-selected="${i===sel}"><span class="sr-k"${r.color?` style="--c:${r.color}"`:""}>${esc(r.kind)}</span><span class="sr-t"><b>${esc(r.title)}</b>${r.sub?`<small>${esc(r.sub)}</small>`:""}</span></button>`).join("")
      :`<p class="empty" style="padding:10px">${q.value.trim().length<2&&S.pid&&!S.home?"Tape au moins 2 lettres.":"Aucun résultat."}</p>`;
    box.querySelectorAll(".sr-i").forEach(b=>b.onclick=()=>pick(+b.dataset.i));};
  const pick=i=>{const r=res[i];if(!r)return;m.remove();r.go();};
  q.oninput=run;q.onkeydown=e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!res.length)return;sel=(sel+(e.key==="ArrowDown"?1:-1)+res.length)%res.length;draw();box.querySelector('[aria-selected="true"]')?.scrollIntoView({block:"nearest"});}
    else if(e.key==="Enter"){e.preventDefault();pick(sel);}};
  run();q.focus();
}

function highlightHTML(text,els){
  const terms=els.filter(e=>e.name&&e.name.trim().length>1).map(e=>({t:e.name.trim().toLowerCase(),e})).sort((a,b)=>b.t.length-a.t.length);
  const lower=text.toLowerCase();if(lower.length!==text.length)return esc(text);
  const taken=new Uint8Array(text.length);const ranges=[];const W=/[\p{L}\p{N}]/u;
  for(const{t,e}of terms){let i=0;while((i=lower.indexOf(t,i))!==-1){const end=i+t.length;
    if(!(i>0&&W.test(lower[i-1]))&&!(end<lower.length&&W.test(lower[end]))&&!taken.subarray(i,end).some(x=>x)){taken.fill(1,i,end);ranges.push([i,end,e]);}i=end;}}
  ranges.sort((a,b)=>a[0]-b[0]);let out="",p=0;
  for(const[a,b,e]of ranges){out+=esc(text.slice(p,a))+`<mark class="hl" data-eid="${esc(e.id)}" style="--c:${CAT[e.cat]?.color||"#888"}" title="${esc(CAT[e.cat]?.label||"")}">${esc(text.slice(a,b))}</mark>`;p=b;}
  return out+esc(text.slice(p));
}

/* ---------- retrouver les passages d'un élément dans la scène (comme « Rechercher » d'un éditeur) ---------- */
const FIND={sid:null,eid:null,i:0};
function findMarks(){const pg=$("#page");return pg&&FIND.eid?[...pg.querySelectorAll('mark.hl[data-eid="'+CSS.escape(FIND.eid)+'"]')]:[];}
function findStart(eid){
  if(FIND.eid===eid&&FIND.sid===S.sid){findGo(1);return;}
  FIND.sid=S.sid;FIND.eid=eid;FIND.i=0;findApply(true);
}
function findGo(d){const ms=findMarks();if(!ms.length)return;FIND.i=(FIND.i+d+ms.length)%ms.length;findApply(true);}
function findClose(){FIND.eid=null;FIND.sid=null;findApply(false);}
function findChips(){document.querySelectorAll("#sheet .el-name").forEach(n=>n.parentElement.classList.toggle("on",!!FIND.eid&&FIND.sid===S.sid&&n.dataset.eid===FIND.eid));}
function findApply(scroll){
  const pane=$("#scriptpane");
  pane&&pane.querySelectorAll("mark.hl.found,mark.hl.found-cur").forEach(m=>m.classList.remove("found","found-cur"));
  let w=$("#findwrap");

  if(!e||!pane){FIND.eid=null;FIND.sid=null;if(w)w.remove();findChips();return;}
  const ms=findMarks();if(FIND.i>=ms.length)FIND.i=Math.max(0,ms.length-1);
  ms.forEach((m,k)=>m.classList.add(k===FIND.i?"found-cur":"found"));
  if(!w||w.parentElement!==pane){if(w)w.remove();w=document.createElement("div");w.id="findwrap";w.className="findwrap";const pg=$("#page");if(pg&&pg.parentElement===pane)pane.insertBefore(w,pg);else pane.prepend(w);}
  const n=ms.length;
  w.innerHTML=`<div class="findbar" role="search" aria-label="Passages de l'élément" style="--c:${CAT[e.cat]?.color||"#888"}">
    <i aria-hidden="true"></i><b title="${esc(CAT[e.cat]?.label||"")}">${esc(e.name)}</b>
    <span class="fcount" aria-live="polite">${n?(FIND.i+1)+" / "+n:"Pas trouvé dans le texte de la scène"}</span>

  if(scroll&&ms[FIND.i])ms[FIND.i].scrollIntoView({block:"center",behavior:"smooth"});

let popEl=null;
function closePop(){if(popEl){popEl.remove();popEl=null;}}
document.addEventListener("pointerdown",e=>{if(popEl&&!popEl.contains(e.target)&&!(popEl.classList.contains("mm")&&e.target.closest?.("#b-menu")))closePop();},true);

function openPop(anchorRect,title,items){
  closePop();const d=document.createElement("div");d.className="pop";d.setAttribute("role","menu");
  if(title){const t=document.createElement("div");t.className="ptitle";t.textContent=title;d.append(t);}

    if(it.color){const ic=document.createElement("i");ic.style.setProperty("--c",it.color);b.append(ic);}

  const w=d.offsetWidth,h=d.offsetHeight;

  if(y+h>innerHeight-8)y=Math.max(8,anchorRect.top-h-6);

  d.onkeydown=e=>{const k=e.key;const idx=items.findIndex(it=>it.key===k);if(idx>-1){e.preventDefault();d.querySelectorAll("button")[idx].click();}};
  d.querySelector("button")?.focus();
}
function bindScriptSelection(){
  const pane=$("#scriptpane");
  const handler=()=>{
    if(!S.canWrite)return;
    const sel=getSelection();if(!sel||sel.isCollapsed)return;
    const page=$("#page");if(!page||!page.contains(sel.anchorNode)||!page.contains(sel.focusNode))return;
    const txt=sel.toString().replace(/\s+/g," ").trim();if(txt.length<2||txt.length>80)return;
    const r=sel.getRangeAt(0).getBoundingClientRect();const sid=S.sid;
    openPop(r,"Ajouter « "+txt+" »",CATS.map((c,i)=>({label:c.label,color:c.color,key:i<9?String(i+1):undefined,run:()=>{addElement(sid,c.id,txt,"manual");getSelection().removeAllRanges();}})));
  };
  pane.addEventListener("mouseup",()=>setTimeout(handler,10));
  let tapAt=0,skipTap=false;
  /* un appui qui sert à refermer un menu ou la liste des scènes n'ouvre pas l'ajout */
  window.addEventListener("pointerdown",()=>{skipTap=!!(popEl||S.listOpen||document.querySelector(".dc-pop"));},true);
  pane.addEventListener("touchend",()=>setTimeout(()=>{if(Date.now()-tapAt>700)handler();},350));
  /* téléphone : un appui sur un mot le sélectionne et propose de l'ajouter ; on peut ensuite étendre la sélection avec les poignées */
  pane.addEventListener("click",e=>{
    if(!S.canWrite||skipTap||!matchMedia("(pointer:coarse)").matches)return;
    const page=$("#page");if(!page||!page.contains(e.target)||e.target.closest("mark,button,a"))return;
    const sel=getSelection();if(sel&&!sel.isCollapsed)return;
    let node,off;
    if(document.caretPositionFromPoint){const cp=document.caretPositionFromPoint(e.clientX,e.clientY);if(cp){node=cp.offsetNode;off=cp.offset;}}
    else if(document.caretRangeFromPoint){const cr=document.caretRangeFromPoint(e.clientX,e.clientY);if(cr){node=cr.startContainer;off=cr.startOffset;}}
    if(!node||node.nodeType!==3)return;
    const txt=node.textContent;const W=/[\p{L}\p{N}'’-]/u;let a=off,b=off;
    while(a>0&&W.test(txt[a-1]))a--;while(b<txt.length&&W.test(txt[b]))b++;
    if(b-a<2)return;
    const r=document.createRange();r.setStart(node,a);r.setEnd(node,b);sel.removeAllRanges();sel.addRange(r);tapAt=Date.now();handler();
  });
}

function groupEpisodes(scenes){
  const ns=[...new Set(scenes.map(s=>s.ep).filter(n=>n!=null))];if(ns.length<2)return null;

    return{n,title:(list.find(s=>s.epTitle)||{}).epTitle||"",scenes:list.map((s,i)=>auto?{...s,num:String(i+1)}:s)};}).filter(e=>e.scenes.length);

/* repère les marqueurs « ÉPISODE 2 » (et un titre court juste après) */
const EPRE=/^\s*>?\s*(?:ÉPISODE|EPISODE|ÉP\.?|EP\.?)\s*(\d{1,3})\b\s*(?:[-–—:·.]\s*(.*?))?\s*<?\s*$/i;
function epTracker(){const st={n:null,titles:{},wait:false};return{st,
  check(raw){const t=String(raw||"").trim();if(!t)return false;
    const m=t.length<90?t.match(EPRE):null;
    if(m){st.n=Number(m[1]);const tt=(m[2]||"").replace(/<\s*$/,"").trim();if(tt)st.titles[st.n]=tt.toUpperCase();st.wait=!tt;return true;}
    if(st.wait){st.wait=false;const x=t.replace(/^>\s*|\s*<$/g,"").trim();
      if(x.length<=60&&x===x.toUpperCase()&&/\p{L}/u.test(x)&&!/^(INT|EXT|I\/E)\b/i.test(x)&&!HEAD.test(t)&&!/^\./.test(t)){st.titles[st.n]=x;return true;}}
    return false;},
  tag(o){o.ep=st.n;o.epTitle=st.titles[st.n]||"";return o;}};}

/* ---------- parsing ---------- */
const HEAD=/^\s*(?:(\d+[A-Z]{0,2})[\s.:)\-–]+)?\.?((?:INT\.?\s*\/\s*EXT|EXT\.?\s*\/\s*INT|I\/E|INT|EXT|INTÉRIEUR|EXTÉRIEUR|INTERIEUR|EXTERIEUR)(?:\.|\s|\/|$).*)$/i;
const NIGHT=/\b(NUIT|NIGHT|SOIR|SOIRÉE|SOIREE|EVENING|CRÉPUSCULE|CREPUSCULE|DUSK)\b/i;
const DAY=/\b(JOURN[ÉE]E|JOUR|DAY|MATIN|MORNING|MIDI|APRÈS-MIDI|APRES-MIDI|AFTERNOON|AUBE|DAWN|AURORE)\b/i;
function parseHeading(raw){
  let h=raw.replace(/\s+\d+[A-Z]{0,2}\s*$/,"").replace(/\s+/g," ").trim();
  const ie=/^(INT\.?\s*\/\s*EXT|EXT\.?\s*\/\s*INT|I\/E)/i.test(h)?"INT/EXT":/^EXT/i.test(h)?"EXT":"INT";
  const rest=h.replace(/^(INT\.?\s*\/\s*EXT\.?|EXT\.?\s*\/\s*INT\.?|I\/E\.?|INTÉRIEUR|EXTÉRIEUR|INTERIEUR|EXTERIEUR|INT\.?|EXT\.?)\s*/i,"");
  const parts=rest.split(/\s*[-–—]\s+(?=\S)|\s+[-–—]\s*|\s+\/\s+/).map(x=>x.trim()).filter(Boolean);
  let time="";if(parts.length>1&&(NIGHT.test(parts[parts.length-1])||DAY.test(parts[parts.length-1])||/CONTINU|LATER|TARD|SUITE|MÊME|MEME/i.test(parts[parts.length-1])))time=parts.pop();
  const dn=NIGHT.test(time)?"N":DAY.test(time)?"J":"";
  return{heading:h.toUpperCase(),intExt:ie,location:parts.join(" – ").toUpperCase()||rest.toUpperCase(),time:time.toUpperCase(),dayNight:dn};
}
function linesToEighths(body){const n=body.split("\n").length+1;return Math.max(1,Math.round(n/7));}

    const m=line.length<110?line.match(HEAD):null;

    if(m||forced){

      cur=EP.tag({num:(m&&m[1])||String(n),autoNum:!(m&&m[1]),...ph,lines:[]});

  if(!out.length){const body=String(text||"").trim();if(!body)return{scenes:[]};

function proseHeading(par){

function proseToScreenplay(src){

  const hasHead=lines.some(l=>l.length<110&&HEAD.test(l));
  const std=lines.filter((l,i)=>isCue(l.trim())&&!(lines[i-1]||"").trim()&&(lines[i+1]||"").trim()&&!proseDialogue(l)).length;

    cur.push(l);}
  if(cur.length)pars.push(cur);
  const out=[];let heads=0,dl=0;
  for(const p of pars){
    const first=p[0];
    if(HEAD.test(first)||/^\./.test(first)&&p.length===1){out.push("",p.join("\n"));continue;}
    if(isCue(first)&&!proseDialogue(first)&&p.length>1&&!/^(FIN|THE END)\.?$/i.test(first)){out.push("",p.join("\n"));continue;}
    const joined=p.join(" ").replace(/\s+/g," ").trim();
    if(!hasHead){const h=proseHeading(joined);if(h){out.push("",h.line);heads++;continue;}}

  return{text:res,changed:true,headings:heads,dialogues:dl};
}

function parseSBX(html){

function parseFDX(xml){

function aiPrompt(s){
  return `Tu es premier assistant réalisateur. Fais le dépouillement technique de cette scène de scénario, comme pour une fiche de dépouillement de production.

Catégories autorisées (clé : contenu) :
cast : personnages qui parlent ou sont nommés / identifiés (écris le nom en MAJUSCULES comme dans le scénario)

stunts : cascades et actions physiques risquées
vehicles : véhicules visibles ou utilisés
animals : animaux
props : accessoires manipulés ou importants pour l'action
setdress : éléments de décor à prévoir (mobilier, objets d'ambiance)
wardrobe : costumes précisés par le texte
makeup : maquillage, coiffure, prothèses, sang, blessures
sfx : effets spéciaux physiques sur le plateau (pluie, fumée, feu, vent)
vfx : effets visuels en postproduction
sound : musique ou son joué à l'image (radio, chant, instrument)
equipment : matériel de tournage spécial impliqué par le texte (drone, grue, travelling, voiture travelling)

Règles :
- N'invente rien : uniquement ce qui est écrit ou directement impliqué par l'action.
- "name" reprend le mot ou l'expression la plus courte telle qu'elle apparaît dans le texte, pour qu'on puisse la surligner.

- Ignore les en-têtes et pieds de page (titre du film, nom de l'auteur, signature, numéros de page, mentions SUITE) : ce ne sont pas des éléments de la scène.
- "synopsis" : une phrase courte en français qui résume l'action.

Réponds uniquement avec ce JSON :

Scène ${s.num} — ${s.heading}

${(s.body||"").slice(0,14000)}`;
}
async function analyzeScene(sid,opts={}){
  if(!S.sample||S.aiOff)return"off";
  const ref=S.db.doc(base()+"/scenes/"+sid);
  if(ref.acquire){try{const r=await ref.acquire({holder:S.holder,ttlMs:120000});if(!r.acquired){if(!opts.bulk)toast("Quelqu'un analyse déjà cette scène.");return"busy";}}catch{}}
  if(opts.bulk){try{const f=await ref.get();if(f.exists&&f.data().status&&f.data().status!=="todo")return"skip";}catch{}}
  const s=scene(sid);if(!s)return"skip";
  S.analyzing.add(sid);S.room?.presence({analyzing:sid}).catch(()=>{});render();
  try{
    const res=await S.sample.json(aiPrompt(s),{signal:opts.signal});
    const items=Array.isArray(res?.elements)?res.elements:[];
    const have=new Set(elsOf(sid).map(e=>e.cat+"|"+norm(e.name)));const fresh=[];
    for(const it of items){const cat=String(it?.cat||"");const name=String(it?.name||"").trim();
      if(!CAT[cat]||!name||name.length>120)continue;const k=cat+"|"+norm(name);if(have.has(k))continue;have.add(k);fresh.push({cat,name});}
    await chunked(fresh,5,f=>S.db.collection(base()+"/elements").add({sceneId:sid,cat:f.cat,name:f.name,src:"ai",by:S.me?.id||null,at:Date.now()}));
    const cur=scene(sid)||s;const patch={status:cur.status==="ok"?"ok":"ai",analyzedAt:Date.now()};
    if(!cur.synopsis&&typeof res?.synopsis==="string")patch.synopsis=res.synopsis.slice(0,400);
    await updateScene(sid,patch);
    return"done";
  }catch(e){
    const code=e?.code||"upstream_error";
    if(code==="cancelled")return"cancelled";
    if(code==="no_key"||code==="bad_key"){window.DDC_openKey&&window.DDC_openKey(code==="bad_key");return"stop";}
    if(code==="no_credit"){toast("Crédit API Anthropic épuisé. Recharge ton compte sur console.anthropic.com.",6000);return"stop";}
    if(code==="offline"){toast("L'analyse IA a besoin d'internet. Le reste fonctionne hors ligne.",5000);return"stop";}
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){S.aiOff=true;toast("L'analyse IA n'est pas disponible pour ton compte sur cette page. Tu peux dépouiller à la main.",5000);return"off";}
    if(code==="rate_limited"){toast("Limite d'utilisation de l'IA atteinte. Réessaie dans quelques minutes.",5000);return"stop";}
    if(code==="session_expired"){toast("Ta session a expiré. Reconnecte-toi à claude.ai.",5000);return"stop";}
    if(code==="invalid_argument"){writeErr(e);return"stop";}
    toast("Scène "+s.num+" : l'analyse a échoué ("+code+"). Relance-la depuis la scène.");return"fail";
  }finally{S.analyzing.delete(sid);S.room?.presence({analyzing:null}).catch(()=>{});render();}
}
async function analyzeAll(){

async function restoreBackup(d,onp){
  const ref=S.db.collection("projects").doc();const bs="projects/"+ref.id;
  const{id,...proj}=d.project||{};
  await ref.set({...proj,name:String(proj.name||"Projet").slice(0,100)+" (restauré)",createdAt:Date.now(),createdBy:S.me?.id||null,restoredFrom:String(d.exportedAt||"")});
  const okId=x=>typeof x==="string"&&/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(x)&&x!=="."&&x!=="..";
  const cols=["scenes","elements","comments","days","locations","shots"];
  const total=cols.reduce((a,c)=>a+(Array.isArray(d[c])?d[c].length:0),0);let done=0;
  for(const c of cols){const arr=Array.isArray(d[c])?d[c]:[];
    await chunked(arr,6,x=>{if(!x||typeof x!=="object")return null;const{id,...rest}=x;
      return S.db.doc(bs+"/"+c+"/"+(okId(id)?id:uid())).set(rest).then(()=>{done++;onp&&onp(done,total);});});}
  openProject(ref.id);
}

const isCue=l=>l.length<=45&&l===l.toUpperCase()&&/\p{Lu}/u.test(l)&&!/[.!?;:,]$/.test(l.replace(/\s*\([^)]*\)\s*$/,""))||/\((V\.O\.|O\.S\.|O\.C\.|CONT'D|SUITE|OFF|VOIX OFF)\)\s*$/i.test(l);
const isTransition=l=>l===l.toUpperCase()&&/\p{Lu}/u.test(l)&&(/^(CUT|FONDU|FADE|DISSOLVE|SMASH|MATCH|INTERCUT|ENCHA[IÎ]N|RETOUR|BACK TO|FIN|THE END)\b/i.test(l)||/(TO|À|A)\s*:$/.test(l));

/* blocs <-> texte */
function blocksFromBody(body){
  const out=[];let mode="a";let blank=true;
  for(const raw of String(body||"").split("\n")){
    const l=raw.trim();if(!l){blank=true;mode="a";continue;}
    const last=out[out.length-1];
    if(/^\(.*\)$/.test(l)&&(mode==="c"||mode==="d"||mode==="p")){out.push({t:"p",x:l});mode="p";}
    else if(blank&&isTransition(l)){out.push({t:"t",x:l});mode="a";}
    else if(blank&&isCue(l)){out.push({t:"c",x:l});mode="c";}
    else if(mode==="c"||mode==="p"||mode==="d"){if(mode==="d"&&last&&last.t==="d")last.x+="\n"+l;else out.push({t:"d",x:l});mode="d";}
    else if(!blank&&last&&last.t==="a")last.x+="\n"+l;
    else out.push({t:"a",x:l});
    blank=false;
  }
  return out;
}
function bodyFromBlocks(bl){
  const out=[];
  for(const b of bl||[]){const x=String(b.x||"").trim();if(!x)continue;
    if(b.t==="c"||b.t==="t"||b.t==="s")out.push("",x.toUpperCase());
    else if(b.t==="p")out.push(/^\(.*\)$/.test(x)?x:"("+x+")");
    else if(b.t==="d")out.push(x);
    else out.push("",x);}
  return out.join("\n").trim();
}
const sceneBlocks=s=>Array.isArray(s.blocks)?s.blocks:blocksFromBody(s.body);
function blockLines(b){const w=WIDTH[b.t]||60;const x=String(b.x||"");
  const n=x.split("\n").reduce((a,l)=>a+Math.max(1,Math.ceil(l.length/w)),0);
  return n+(b.t==="p"||b.t==="d"?0:1);}
function sceneLines(s){return 2+sceneBlocks(s).reduce((a,b)=>a+blockLines(b),0);}

/* texte et curseur dans un bloc éditable */
function rawText(el){let s="";const walk=n=>{for(const c of n.childNodes){if(c.nodeType===3)s+=c.data;else if(c.nodeName==="BR")s+="\n";else{if(/^(DIV|P)$/.test(c.nodeName)&&s&&!s.endsWith("\n"))s+="\n";walk(c);}}};walk(el);return s.replace(/ /g," ");}
const getText=el=>rawText(el).replace(/\n$/,"");
function caretOffset(el){const sel=getSelection();if(!sel.rangeCount)return 0;const r=sel.getRangeAt(0);if(!el.contains(r.startContainer))return 0;
  const pre=document.createRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);const d=document.createElement("div");d.append(pre.cloneContents());return rawText(d).length;}
function setCaret(el,off){el.focus();const sel=getSelection();const r=document.createRange();let left=Math.max(0,off);let done=false;
  const walk=n=>{for(const c of n.childNodes){if(done)return;if(c.nodeType===3){if(left<=c.data.length){r.setStart(c,left);done=true;return;}left-=c.data.length;}else if(c.nodeName==="BR"){if(left===0){r.setStartBefore(c);done=true;return;}left-=1;}else walk(c);}};
  walk(el);if(!done){r.selectNodeContents(el);r.collapse(false);}else r.collapse(true);sel.removeAllRanges();sel.addRange(r);}
function caretLineEdge(el){const sel=getSelection();if(!sel.rangeCount)return{first:true,last:true};const r=sel.getRangeAt(0).cloneRange();r.collapse(true);
  let rect=r.getClientRects()[0];if(!rect)return{first:true,last:true};const er=el.getBoundingClientRect();const lh=parseFloat(getComputedStyle(el).lineHeight)||20;
  return{first:rect.top-er.top<lh*0.8,last:er.bottom-rect.bottom<lh*0.8};}
const PLAIN=(()=>{const d=document.createElement("div");d.contentEditable="plaintext-only";return d.contentEditable==="plaintext-only";})();

/* état de l'éditeur */
const ED={sigs:new Map(),dirty:new Set(),timers:new Map(),focus:null,ac:null};
function edLocks(){const m={};for(const p of S.peers){if(p.kind!=="viewer"||p.isMe||p.presence?.pid!==S.pid)continue;const sid=p.presence?.editing;if(sid)m[sid]=p;}return m;}
function blockEl(t,x,editable){const d=document.createElement("div");d.className="sb sb-"+t;d.dataset.t=t;d.dataset.ph=BT[t].ph;d.textContent=x||"";
  if(editable){d.contentEditable=PLAIN?"plaintext-only":"true";d.spellcheck=true;}return d;}
function knownCharacters(){const m=new Map();
  for(const s of S.scenes)for(const b of sceneBlocks(s))if(b.t==="c"){const n=String(b.x).replace(/\s*\(.*\)\s*$/,"").trim().toUpperCase();if(n)m.set(n,(m.get(n)||0)+1);}
  for(const e of S.elements)if(e.cat==="cast"){const n=e.name.toUpperCase();if(!m.has(n))m.set(n,1);}
  return[...m.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);}
const knownLocations=()=>[...new Set(S.scenes.map(s=>s.location).filter(Boolean))];

function renderEditor(){
  const root=$("#editor");if(!root||!S.pid)return;
  if(!root.dataset.ready){root.dataset.ready="1";
    ED.sigs.clear();ED.lastBlock=null;   /* nouvel éditeur (retour sur l'onglet) : tout redessiner */
    root.innerHTML=`<div class="ed-bar">
        <div class="ed-types" role="toolbar" aria-label="Type de bloc">${["h","a","c","p","d","t","s"].map(k=>`<button type="button" class="ed-tb" data-t="${k}" aria-pressed="false" title="${BT[k].label} · ${MOD}${BT[k].key}" ${S.canWrite?"":"disabled"}>${BT_ICON[k]}<span class="l">${k==="h"?"Scène":BT[k].label}</span></button>`).join("")}</div>
        <span class="ed-hint">ou Tab · Entrée : bloc suivant · Maj+Entrée : retour à la ligne</span>
        <span class="spacer"></span>
        <span class="ed-stats" id="ed-stats"></span>
        ${S.canWrite?`<button class="btn small" id="ed-renum">Renuméroter</button>`:""}
        <button class="btn small" id="ed-export">Exporter le scénario</button>
      </div>
      <div class="ed-body"><nav class="ed-nav" id="ed-nav" aria-label="Scènes du scénario"></nav><div class="ed-scroll" id="ed-scroll"><div class="ed-page" id="edpage"></div></div></div>`;
    bindEditor(root);}
  const page=$("#edpage");const locks=edLocks();
  const active=document.activeElement&&page.contains(document.activeElement)?document.activeElement.closest(".ed-scene"):null;
  const seen=new Set();let prev=null;let lines=0;const pages={};
  for(const s of S.scenes){
    seen.add(s.id);pages[s.id]=Math.floor(lines/LINES_PER_PAGE)+1;lines+=sceneLines(s);
    let sec=page.querySelector(`.ed-scene[data-sid="${CSS.escape(s.id)}"]`);
    if(!sec){sec=document.createElement("section");sec.className="ed-scene";sec.dataset.sid=s.id;}
    if(prev?prev.nextElementSibling!==sec:page.firstElementChild!==sec)page.insertBefore(sec,prev?prev.nextElementSibling:page.firstElementChild);
    prev=sec;
    const lock=locks[s.id];const editable=S.canWrite&&!lock;
    const sig=JSON.stringify([s.num,s.heading,sceneBlocks(s),!!lock,editable]);
    if(sec===active||ED.dirty.has(s.id)){sec.dataset.num=s.num;continue;}
    if(ED.sigs.get(s.id)===sig)continue;
    ED.sigs.set(s.id,sig);
    sec.innerHTML="";sec.classList.toggle("locked",!!lock);
    if(lock){const l=document.createElement("div");l.className="ed-lock";l.dataset.uid=lock.by||lock.presence?.uid||"";l.textContent="Quelqu'un modifie cette scène";sec.append(l);}
    const h=blockEl("h",s.heading,editable);h.dataset.num=s.num;sec.append(h);
    const bl=sceneBlocks(s);for(const b of bl)sec.append(blockEl(b.t,b.x,editable));
    if(!bl.length&&editable)sec.append(blockEl("a","",true));
  }
  page.querySelectorAll(".ed-scene").forEach(sec=>{if(!seen.has(sec.dataset.sid)&&sec!==active){sec.remove();ED.sigs.delete(sec.dataset.sid);}});
  page.querySelectorAll(".ed-scene .sb-h").forEach(h=>{const sid=h.parentElement.dataset.sid;const s=scene(sid);if(s){h.dataset.num=s.num;h.dataset.page="p. "+pages[sid];}});
  resolveLockNames(page);
  const nPages=Math.max(1,Math.ceil(lines/LINES_PER_PAGE));
  $("#ed-stats").textContent=`${S.scenes.length} scène${S.scenes.length>1?"s":""} · ≈ ${nPages} page${nPages>1?"s":""}`;
  $("#ed-nav").innerHTML=S.scenes.map(s=>`<button data-sid="${esc(s.id)}" class="${locks[s.id]?"lk":""}"><b>${esc(s.num)}</b><span>${esc(s.location||s.heading)}</span></button>`).join("");
  if(ED.focus){const f=ED.focus;const sec=page.querySelector(`.ed-scene[data-sid="${CSS.escape(f.sid)}"]`);
    if(sec){const bs=sec.querySelectorAll(".sb");const el=bs[Math.min(f.idx,bs.length-1)];if(el){ED.focus=null;el.scrollIntoView({block:"center"});if(el.isContentEditable)setCaret(el,f.caret==="end"?getText(el).length:(f.caret||0));}}}
}
async function resolveLockNames(page){
  if(!S.user)return;const els=[...page.querySelectorAll(".ed-lock[data-uid]")].filter(e=>e.dataset.uid);if(!els.length)return;
  const ps=await S.user.profiles(els.map(e=>e.dataset.uid));els.forEach(e=>{const n=ps[e.dataset.uid]?.name;if(n)e.textContent=n+" modifie cette scène";});
}

function bindEditor(root){
  const page=$("#edpage");
  root.querySelectorAll(".ed-tb").forEach(btn=>{
    btn.onmousedown=e=>e.preventDefault();   /* garde le curseur dans le texte */
    btn.onclick=()=>typeButton(btn.dataset.t);});
  const rn=$("#ed-renum");if(rn)rn.onclick=renumberScenes;
  $("#ed-export").onclick=()=>openExport("script");
  $("#ed-nav").onclick=e=>{const b=e.target.closest("button[data-sid]");if(!b)return;const sec=page.querySelector(`.ed-scene[data-sid="${CSS.escape(b.dataset.sid)}"]`);if(sec)sec.scrollIntoView({block:"start",behavior:"smooth"});};
  page.addEventListener("focusin",e=>{const b=e.target.closest(".sb");if(!b)return;ED.lastBlock=b;markType(b.dataset.t);
    const sid=b.closest(".ed-scene").dataset.sid;if(ED.editing!==sid){ED.editing=sid;S.room?.presence({editing:sid}).catch(()=>{});}});
  page.addEventListener("focusout",e=>{const sec=e.target.closest(".ed-scene");setTimeout(()=>{
    const a=document.activeElement;const inSame=a&&sec&&sec.contains(a);
    if(!inSame&&sec&&ED.dirty.has(sec.dataset.sid))commitScene(sec.dataset.sid);
    if(!a||!page.contains(a)){ED.editing=null;S.room?.presence({editing:null}).catch(()=>{});hideAC();}},0);});
  page.addEventListener("input",e=>{const b=e.target.closest(".sb");if(!b)return;markDirty(b.closest(".ed-scene").dataset.sid);updateAC(b);});

  const sec=b.closest(".ed-scene");const isHead=b===sec.querySelector(".sb");

  if(isHead&&t!=="h"){toast("Pour retirer un en-tête de scène, efface son texte puis appuie sur Retour arrière.");setCaret(b,getText(b).length);return;}

function markDirty(sid,now){ED.dirty.add(sid);clearTimeout(ED.timers.get(sid));if(now){commitScene(sid);return;}ED.timers.set(sid,setTimeout(()=>commitScene(sid),900));}
function setType(el,t){if(!BT[t])return;const old=el.dataset.t;el.dataset.t=t;el.className="sb sb-"+t;el.dataset.ph=BT[t].ph;
  if(t==="h"&&!el.dataset.num)el.dataset.num="";markType(t);
  const sid=el.closest(".ed-scene").dataset.sid;markDirty(sid,old==="h"||(t==="h"&&!!getText(el).trim()));}

function onEdKey(e){
  const el=e.target.closest(".sb");if(!el||!el.isContentEditable)return;
  const mod=e.metaKey||e.ctrlKey;
  if(ED.ac&&ED.ac.el===el){
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();ED.ac.i=(ED.ac.i+(e.key==="ArrowDown"?1:-1)+ED.ac.items.length)%ED.ac.items.length;drawAC();return;}
    if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();acceptAC();return;}
    if(e.key==="Escape"){e.preventDefault();hideAC();return;}
  }
  if(mod&&/^[1-7]$/.test(e.key)){e.preventDefault();const t=Object.keys(BT).find(k=>BT[k].key===e.key);setType(el,t);return;}
  if(e.key==="Tab"){e.preventDefault();const i=BT_ORDER.indexOf(el.dataset.t);const t=BT_ORDER[(i+(e.shiftKey?-1:1)+BT_ORDER.length)%BT_ORDER.length];
    if(t==="h"&&el===el.closest(".ed-scene").querySelector(".sb")){setType(el,BT_ORDER[(BT_ORDER.indexOf(t)+(e.shiftKey?-1:1)+BT_ORDER.length)%BT_ORDER.length]);return;}
    setType(el,t);return;}
  if(e.key==="Enter"&&!e.shiftKey&&!mod){e.preventDefault();hideAC();
    const text=getText(el);const off=caretOffset(el);const t=el.dataset.t;
    if(!text.trim()&&(t==="c"||t==="p"||t==="d"||t==="s")){setType(el,"a");return;}
    const before=text.slice(0,off).replace(/\s+$/,""),after=text.slice(off).replace(/^\s+/,"");
    if(t==="c"||t==="h"||t==="t"||t==="s")el.textContent=before.toUpperCase();else el.textContent=before;
    let nt=NEXT[t];if(t==="p"&&!/\)\s*$/.test(before)&&before)el.textContent=before+")";
    const n=blockEl(nt,after,true);el.after(n);setCaret(n,0);markType(nt);
    markDirty(el.closest(".ed-scene").dataset.sid,nt==="h"&&!!after.trim());return;}
  if(e.key==="Backspace"&&!mod){const sel=getSelection();if(!sel.isCollapsed)return;const off=caretOffset(el);if(off!==0)return;
    const sec=el.closest(".ed-scene");const isHead=el===sec.querySelector(".sb");
    if(isHead){if(!getText(el).trim()&&sec.previousElementSibling){e.preventDefault();setType(el,"a");}return;}
    e.preventDefault();const prev=el.previousElementSibling&&el.previousElementSibling.classList.contains("sb")?el.previousElementSibling:null;if(!prev)return;
    const pt=getText(prev);const cur=getText(el);el.remove();prev.textContent=pt+cur;setCaret(prev,pt.length);markDirty(sec.dataset.sid);return;}
  if((e.key==="ArrowUp"||e.key==="ArrowDown")&&!e.shiftKey&&!mod){const edge=caretLineEdge(el);
    const all=[...$("#edpage").querySelectorAll(".sb")];const i=all.indexOf(el);
    if(e.key==="ArrowUp"&&edge.first&&i>0){e.preventDefault();const p=all[i-1];if(p.isContentEditable)setCaret(p,getText(p).length);}
    if(e.key==="ArrowDown"&&edge.last&&i<all.length-1){e.preventDefault();const n=all[i+1];if(n.isContentEditable)setCaret(n,0);}}
}
function onPaste(e){
  const el=e.target.closest(".sb");if(!el||!el.isContentEditable)return;e.preventDefault();
  const txt=(e.clipboardData||window.clipboardData).getData("text/plain").replace(/\r\n?/g,"\n");if(!txt)return;
  const off=caretOffset(el);const cur=getText(el);
  if(!txt.includes("\n")){el.textContent=cur.slice(0,off)+txt+cur.slice(off);setCaret(el,off+txt.length);markDirty(el.closest(".ed-scene").dataset.sid);return;}
  const parts=[];let buf=[];
  for(const line of txt.split("\n")){const m=line.length<110?line.match(HEAD):null;if(m){if(buf.length)parts.push(...blocksFromBody(buf.join("\n")));buf=[];parts.push({t:"h",x:(m[2]||line).trim().toUpperCase()});}else buf.push(line);}
  if(buf.length)parts.push(...blocksFromBody(buf.join("\n")));
  const tail=cur.slice(off);el.textContent=cur.slice(0,off);let last=el;
  for(const b of parts){const n=blockEl(b.t,b.x,true);last.after(n);last=n;}
  if(tail){const n=blockEl("a",tail,true);last.after(n);last=n;}
  if(!getText(el).trim()&&el!==el.closest(".ed-scene").querySelector(".sb"))el.remove();
  setCaret(last,getText(last).length);markDirty(last.closest(".ed-scene").dataset.sid,parts.some(b=>b.t==="h"));
}

/* autocomplétion */
function updateAC(el){
  const t=el.dataset.t;const text=getText(el);const off=caretOffset(el);if(off!==text.length){hideAC();return;}
  let items=[],replaceFrom=0;
  if(t==="c"){const q=text.trim().toUpperCase();if(q)items=knownCharacters().filter(n=>n.startsWith(q)&&n!==q).slice(0,6);}
  else if(t==="h"){const up=text.toUpperCase();
    if(!/^(INT|EXT|I\/E)/.test(up.trim())){items=["INT. ","EXT. ","INT./EXT. "].filter(x=>x.startsWith(up.trim())&&x.trim()!==up.trim());replaceFrom=0;}
    else{const m=up.match(/^(\s*(?:INT\.?\/EXT\.?|EXT\.?\/INT\.?|I\/E\.?|INT\.?|EXT\.?)\s*)(.*)$/);const pre=m?m[1]:"";const rest=m?m[2]:up;
      const dash=rest.lastIndexOf(" - ");
      if(dash>-1){const q=rest.slice(dash+3);items=TIMES.filter(x=>x.startsWith(q)&&x!==q).slice(0,6);replaceFrom=pre.length+dash+3;}
      else if(rest.length){items=knownLocations().filter(x=>x.startsWith(rest)&&x!==rest).slice(0,6).map(x=>x+" - ");replaceFrom=pre.length;}}}
  if(!items.length){hideAC();return;}
  ED.ac={el,items,i:0,from:replaceFrom};drawAC();
}
function drawAC(){
  let box=$("#ed-ac");if(!box){box=document.createElement("div");box.id="ed-ac";box.className="pop ed-ac";box.setAttribute("role","listbox");document.body.append(box);}
  const a=ED.ac;box.innerHTML=a.items.map((x,i)=>`<button role="option" data-i="${i}" aria-selected="${i===a.i}">${esc(x.trim())}</button>`).join("");
  box.querySelectorAll("button").forEach(b=>b.onmousedown=ev=>{ev.preventDefault();a.i=+b.dataset.i;acceptAC();});
  const r=a.el.getBoundingClientRect();box.style.left=Math.min(r.left,innerWidth-box.offsetWidth-8)+"px";box.style.top=(r.bottom+4)+"px";
}
function hideAC(){ED.ac=null;const b=$("#ed-ac");if(b)b.remove();}
function acceptAC(){const a=ED.ac;if(!a)return;const text=getText(a.el);const v=a.items[a.i];
  const nt=a.el.dataset.t==="c"?v:text.slice(0,a.from).toUpperCase()+v;a.el.textContent=nt;setCaret(a.el,nt.length);hideAC();markDirty(a.el.closest(".ed-scene").dataset.sid);
  if(a.el.dataset.t==="h")updateAC(a.el);}

/* enregistrement : une section = une scène ; un nouvel en-tête crée une scène, un en-tête retiré fusionne */
function nextNum(base,extra=[]){const root=String(base).replace(/[A-Z]+$/,"");const used=new Set([...S.scenes.map(s=>s.num),...extra]);
  for(const L of "ABCDEFGHIJKLMNOPQRSTUVWXYZ")if(!used.has(root+L))return root+L;return root+"Z"+Math.floor(Math.random()*90+10);}
function readSection(sec){return[...sec.querySelectorAll(".sb")].map(el=>({t:el.dataset.t,x:getText(el).replace(/\s+$/,"")}));}
function headingFields(h,old){const ph=parseHeading(h||"");return{heading:ph.heading||"SCÈNE",intExt:ph.intExt,location:ph.location,time:ph.time,dayNight:ph.dayNight||old?.dayNight||""};}
function cleanBlocks(bl){return bl.filter((b,i)=>b.x.trim()||i===bl.length-1&&bl.length===1).map(b=>({t:b.t,x:b.t==="c"||b.t==="t"||b.t==="s"?b.x.toUpperCase():b.x}));}
async function commitScene(sid){
  clearTimeout(ED.timers.get(sid));
  const sec=$("#edpage")?.querySelector(`.ed-scene[data-sid="${CSS.escape(sid)}"]`);const s=scene(sid);
  if(!sec||!s){ED.dirty.delete(sid);return;}
  let bl=readSection(sec);ED.dirty.delete(sid);
  /* où est le curseur : groupe (scène) et position dans le groupe, pour le garder après découpage */
  const act=document.activeElement&&sec.contains(document.activeElement)?document.activeElement.closest(".sb"):null;
  let actG=-1,actI=0,actC=0;
  if(act){let g=-1,i=0;for(const el of sec.querySelectorAll(".sb")){if(el.dataset.t==="h"){g++;i=0;}else i++;if(el===act){actG=g;actI=i;break;}}actC=caretOffset(act);}
  const idx=S.scenes.indexOf(s);const prevS=S.scenes[idx-1];
  try{
    if(bl[0]?.t!=="h"){
      if(prevS){await mergeScene(s,prevS,bl);return;}
      bl.unshift({t:"h",x:s.heading});
    }
    const groups=[];for(const b of bl){if(b.t==="h")groups.push({h:b.x,blocks:[]});else groups[groups.length-1].blocks.push(b);}
    if(groups.slice(1).some(g=>!g.h.trim())){ED.dirty.add(sid);ED.timers.set(sid,setTimeout(()=>commitScene(sid),1500));return;}
    const first=groups.shift();const blocks=cleanBlocks(first.blocks);
    const patch={...headingFields(first.h,s),blocks,body:bodyFromBlocks(blocks),updatedAt:Date.now(),updatedBy:S.me?.id||null};
    patch.eighths=Math.max(1,Math.round(sceneLines({blocks})/LINES_PER_PAGE*8));
    ED.sigs.delete(sid);
    await S.db.doc(base()+"/scenes/"+sid).update(patch);
    if(groups.length){
      const nextS=S.scenes[idx+1];let lo=s.order||0;const hi=nextS?(nextS.order||0):lo+groups.length+1;const step=(hi-lo)/(groups.length+1);
      let lastNum=s.num;let focusId=null;const made=[];let gi=0;
      for(const g of groups){gi++;lo+=step;const ref=S.db.collection(base()+"/scenes").doc();const gb=cleanBlocks(g.blocks.length?g.blocks:[{t:"a",x:""}]);
        lastNum=nextNum(lastNum,made);made.push(lastNum);
        await ref.set({...headingFields(g.h,s),num:lastNum,order:lo,blocks:gb,body:bodyFromBlocks(gb),status:"todo",synopsis:"",
          eighths:Math.max(1,Math.round(sceneLines({blocks:gb})/LINES_PER_PAGE*8)),createdAt:Date.now(),createdBy:S.me?.id||null});
        if(gi===actG)ED.focus={sid:ref.id,idx:actI,caret:actC};focusId=ref.id;}
      /* on retire de cette section les blocs passés dans les nouvelles scènes ; ils réapparaissent dans leurs propres sections */
      let g=-1;for(const el of [...sec.querySelectorAll(".sb")]){if(el.dataset.t==="h")g++;if(g>0)el.remove();}
      ED.sigs.delete(sid);if(actG<0&&!ED.focus)ED.focus={sid:focusId,idx:0,caret:"end"};
      toast(groups.length>1?groups.length+" scènes ajoutées.":"Scène "+lastNum+" ajoutée.");
    }
  }catch(e){writeErr(e);}
  render();
}
async function mergeScene(s,into,bl){
  const target=sceneBlocks(into);const moved=cleanBlocks(bl.map(b=>b.t==="h"?{t:"a",x:b.x}:b));
  const blocks=[...target,...moved].filter(b=>b.x.trim());
  await S.db.doc(base()+"/scenes/"+into.id).update({blocks,body:bodyFromBlocks(blocks),eighths:Math.max(1,Math.round(sceneLines({blocks})/LINES_PER_PAGE*8)),updatedAt:Date.now()});
  await chunked(S.elements.filter(e=>e.sceneId===s.id),5,e=>S.db.doc(base()+"/elements/"+e.id).update({sceneId:into.id}));
  await chunked(S.comments.filter(c=>c.sceneId===s.id),5,c=>S.db.doc(base()+"/comments/"+c.id).update({sceneId:into.id}));
  await chunked(S.shots.filter(x=>x.sceneId===s.id),5,x=>S.db.doc(base()+"/shots/"+x.id).update({sceneId:into.id,pos:(x.pos||0)+1e7}));
  await S.db.doc(base()+"/scenes/"+s.id).delete();
  const sec=$("#edpage")?.querySelector(`.ed-scene[data-sid="${CSS.escape(s.id)}"]`);if(sec)sec.remove();
  ED.sigs.delete(into.id);ED.focus={sid:into.id,idx:1+target.length,caret:0};
  toast("Scène "+s.num+" fusionnée avec la scène "+into.num+".");render();
}

async function exportFountain(){

      if(b.t==="c"||b.t==="p")continue;}

/* scénario en PDF, mise en page standard : Courier 12, numéros de scène des deux côtés, pagination, nom de l'app en pied de page */
async function exportScriptPDF(){
  await flushEditor();const p=P();
  try{await loadLib("jspdf");}catch{toast("Impossible de charger l'outil PDF. Vérifie la connexion internet.",5000);return;}
  const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:"pt",format:"a4"});
  const W=595.28,H=841.89,L=100,R=W-62,TOP=72,BOT=H-66,LH=12,CW=7.2;
  const clean=s=>String(s||"").replace(/[\u2018\u2019\u02BC]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/\u2026/g,"...").replace(/[\u2013\u2014]/g,"-").replace(/\u0153/g,"oe").replace(/\u0152/g,"OE").replace(/[\u00A0\u202F\u2009]/g," ").replace(/[^\x00-\xFF]/g,"?");
  const wrap=(s,n)=>{const out=[];for(const para of clean(s).split("\n")){let line="";for(const w of para.split(/\s+/).filter(Boolean)){if(!line)line=w;else if((line+" "+w).length<=n)line+=" "+w;else{out.push(line);line=w;}while(line.length>n){out.push(line.slice(0,n));line=line.slice(n);}}out.push(line);}return out;};
  const FMT={h:{x:0,n:60,up:1,b:1,gap:2},a:{x:0,n:60,gap:1},c:{x:22,n:38,up:1,gap:1},p:{x:16,n:25,gap:0},d:{x:10,n:35,gap:0},t:{x:0,n:60,up:1,gap:1,right:1},s:{x:0,n:60,up:1,gap:1}};
  let page=0,y=TOP;
  const footer=()=>{doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(140);doc.text("Dydz Studio",W/2,H-34,{align:"center"});doc.setTextColor(0);};
  const newPage=()=>{if(page)doc.addPage();page++;y=TOP;footer();const sp=page-1;if(sp>1){doc.setFont("courier","normal");doc.setFontSize(12);doc.text(sp+".",R,40,{align:"right"});}};
  /* page de titre */
  doc.setFont("courier","bold");doc.setFontSize(14);
  const title=wrap((p?.name||"Sans titre").toUpperCase(),48);title.forEach((l,i)=>doc.text(l,W/2,H*0.38+i*18,{align:"center"}));
  doc.setFont("courier","normal");doc.setFontSize(12);
  doc.text(clean(verTag(p)+" · "+new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})),W/2,H*0.38+title.length*18+24,{align:"center"});
  footer();page=1;
  let first=true;
  for(const s of S.scenes){
    const blocks=[{t:"h",x:s.heading,num:s.num},...sceneBlocks(s).filter(b=>String(b.x||"").trim())];
    blocks.forEach((b,bi)=>{const f=FMT[b.t]||FMT.a;let lines=wrap(f.up?String(b.x).toUpperCase():b.x,f.n);
      if(b.t==="p"&&!/^\(/.test(lines[0]||""))lines=wrap("("+String(b.x).trim()+")",f.n);
      let gap=first?0:f.gap;
      /* garder l'en-tête avec au moins deux lignes de la suite, et le personnage avec sa réplique */
      const need=lines.length+(b.t==="h"?3:b.t==="c"?2:0);
      if(page===1||y+(gap+Math.min(need,lines.length+2))*LH>BOT){newPage();gap=0;}
      y+=gap*LH;first=false;
      doc.setFont("courier",f.b?"bold":"normal");doc.setFontSize(12);
      lines.forEach((l,li)=>{if(y>BOT){newPage();}
        if(f.right)doc.text(l,R,y,{align:"right"});else doc.text(l,L+f.x*CW,y);
        if(b.t==="h"&&li===0){doc.text(String(b.num),L-40,y);doc.text(String(b.num),R+30,y,{align:"right"});}
        y+=LH;});
    });
  }
  await save(fileBase(p)+".pdf",doc.output("blob"));
}
async function exportFDX(){
  await flushEditor();const p=P();const x=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const T={a:"Action",c:"Character",p:"Parenthetical",d:"Dialogue",t:"Transition",s:"Shot"};
  const paras=[];
  for(const s of S.scenes){paras.push(`<Paragraph Number="${x(s.num)}" Type="Scene Heading"><Text>${x(s.heading)}</Text></Paragraph>`);
    for(const b of sceneBlocks(s)){const t=String(b.x||"").trim();if(!t)continue;
      const lines=t.split("\n");paras.push(`<Paragraph Type="${T[b.t]||"Action"}">${lines.map((l,i)=>`<Text>${x(l)}${i<lines.length-1?"\n":""}</Text>`).join("")}</Paragraph>`);}}
  const xml=`<?xml version="1.0" encoding="UTF-8" standalone="no" ?>\n<FinalDraft DocumentType="Script" Template="No" Version="5">\n<SceneNumberOptions LeftLocation="0.75" RightLocation="7.38" ShowNumbersOnLeft="Yes" ShowNumbersOnRight="Yes"/>\n<Content>\n${paras.join("\n")}\n</Content>\n<TitlePage><Content><Paragraph Alignment="Center" Type="Action"><Text>${x(p?.name||"")}</Text></Paragraph></Content></TitlePage>\n</FinalDraft>\n`;
  save(fileBase(p)+".fdx",xml);
}

/* ---------- plan de travail ---------- */
const decorKey=s=>norm(s.location||s.heading);
function lieuOf(s){const k=decorKey(s);return S.locations.find(l=>(l.decors||[]).includes(k))||null;}
function castOf(sid){const m=new Map();for(const e of S.elements)if(e.sceneId===sid&&e.cat==="cast"){const k=norm(e.name);if(!m.has(k))m.set(k,e.name.toUpperCase());}return m;}
const daysSorted=()=>[...S.days].sort((a,b)=>(a.order||0)-(b.order||0)||String(a.id).localeCompare(String(b.id)));
const scenesOfDay=did=>S.scenes.filter(s=>s.dayId===did).sort((a,b)=>(a.dayPos||0)-(b.dayPos||0));
const isPlanned=s=>!!(s.dayId&&S.days.some(d=>d.id===s.dayId));
function dayIndexMap(){const m={};daysSorted().forEach((d,i)=>m[d.id]=i);return m;}
const targetE8=()=>Math.round((Number(P()?.pagesPerDay)||4)*8);
/* durée estimée d'après le découpage (plans optionnels exclus) */
const sceneDur=s=>sumDur(shotsOf(s.id).filter(x=>!isOpt(x)));
const scenesDur=list=>list.reduce((a,s)=>a+sceneDur(s),0);
const fmtDate=iso=>{if(!iso)return"";const d=new Date(iso+"T12:00:00");return isNaN(d)?"":d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});};

function keepFocus(fn){
  const a=document.activeElement;const id=a&&a.id;const val=a&&"value" in a?a.value:null;let ss=null;try{ss=a.selectionStart;}catch{}
  fn();
  if(id){const n=document.getElementById(id);if(n&&n!==a){n.focus();if(val!==null)n.value=val;try{if(ss!=null)n.setSelectionRange(ss,ss);}catch{}}}
}

function planGroups(scenes){
  const groups=new Map();
  for(const s of scenes){const l=lieuOf(s);const k=S.planGroup==="decor"||!l?"d:"+decorKey(s):"l:"+l.id;
    if(!groups.has(k))groups.set(k,{key:k,lieu:S.planGroup==="decor"?null:l,decor:s.location||s.heading,scenes:[]});groups.get(k).scenes.push(s);}
  return[...groups.values()].sort((a,b)=>(a.scenes[0].order||0)-(b.scenes[0].order||0));
}
function dayWarnings(sc){
  const w=[];const e8=sc.reduce((a,s)=>a+(s.eighths||0),0);
  if(e8>targetE8()*1.25)w.push("Journée chargée");
  const lieux=new Set(sc.map(s=>lieuOf(s)?.id||"d:"+decorKey(s)));if(lieux.size>1)w.push(lieux.size+" lieux : déplacement");
  const dn=new Set(sc.map(s=>s.dayNight).filter(Boolean));if(dn.size>1)w.push("Jour et nuit");
  return w;
}
function castAlerts(){
  const idx=dayIndexMap();const by=new Map();
  for(const s of S.scenes){if(!isPlanned(s))continue;for(const[k,name]of castOf(s.id)){if(!by.has(k))by.set(k,{name,days:new Set()});by.get(k).days.add(idx[s.dayId]);}}
  const out=[];
  for(const{name,days}of by.values()){const d=[...days].sort((a,b)=>a-b);if(d.length>1&&d[d.length-1]-d[0]+1>d.length)out.push({name,days:d});}
  return out.sort((a,b)=>a.name.localeCompare(b.name,"fr"));
}

/* journées dépliées : mémorisées par projet sur cet appareil */
const PLANOPEN={pid:null,set:null};
function planOpenSet(){
  if(PLANOPEN.pid===S.pid&&PLANOPEN.set)return PLANOPEN.set;
  let saved=null;try{saved=JSON.parse(store.get("dep.plan.open."+S.pid)||"null");}catch{}
  if(!Array.isArray(saved)&&!S.days.length)return new Set();
  PLANOPEN.pid=S.pid;
  if(Array.isArray(saved)&&!(saved.length&&S.days.length&&!saved.some(id=>S.days.some(d=>d.id===id))))PLANOPEN.set=new Set(saved);
  else{const days=daysSorted();const today=new Date().toISOString().slice(0,10);
    const d=days.find(x=>x.date===today)||days.find(x=>{const sc=scenesOfDay(x.id);return !sc.length||sc.some(s=>!s.filmed);});
    PLANOPEN.set=new Set(d?[d.id]:[]);}
  return PLANOPEN.set;
}
function planOpenSave(){try{store.set("dep.plan.open."+S.pid,JSON.stringify([...PLANOPEN.set]));}catch{}}
function toggleDay(did,v){const set=planOpenSet();if(v===undefined?!set.has(did):v)set.add(did);else set.delete(did);planOpenSave();render();}

async function setDayFilmed(did,v){
  const sc=scenesOfDay(did).filter(s=>!!s.filmed!==v);if(!sc.length)return;
  const i=daysSorted().findIndex(d=>d.id===did);
  try{await hGroup("J"+(i+1)+(v?" tournée":" à tourner"),()=>chunked(sc,5,s=>trk(base()+"/scenes/"+s.id).update({filmed:v},{label:"Scène "+s.num})));}
  catch(e){writeErr(e);}
}
