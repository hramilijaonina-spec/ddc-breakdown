/* ---------- sauvegarde automatique et retour à une version ---------- */
const SNAP={timer:null,first:0,busy:false,lastHash:null,lastAt:0,KEEP:40,PART:180000,mig:null,migBad:new Set()};
const SNAP_COLS=["scenes","elements","shots","days","locations"];
function snapHash(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}return(h>>>0).toString(36)+"-"+s.length.toString(36);}
/* forme canonique : clés triées, valeurs vides retirées (la base ne garde ni null ni listes vides) */
function snapNorm(v){
  if(Array.isArray(v)){const a=v.map(snapNorm).filter(x=>x!==undefined);return a.length?a:undefined;}
  if(v&&typeof v==="object"){const o={};for(const k of Object.keys(v).sort()){const x=snapNorm(v[k]);if(x!==undefined)o[k]=x;}return Object.keys(o).length?o:undefined;}
  return v===null||v===undefined?undefined:v;
}
const snapHashOf=d=>snapHash(JSON.stringify(snapNorm(d))||"");
function snapData(){
  const strip=({id,updatedAt,updatedBy,...r})=>r;
  const sortById=a=>[...a].sort((x,y)=>String(x.id).localeCompare(String(y.id)));
  const d={};
  d.scenes=sortById(S.scenes).map(s=>{const{body,...r}=strip(s);return Array.isArray(s.blocks)?{id:s.id,...r}:{id:s.id,...r,body};});
  d.elements=sortById(S.elements).map(e=>({id:e.id,...strip(e)}));
  d.shots=sortById(S.shots).map(x=>{const r=strip(x);if(r.img&&/^data:/.test(String(r.img)))r.img="@keep:"+snapHash(String(r.img));return{id:x.id,...r};});
  d.days=sortById(S.days).map(x=>({id:x.id,...strip(x)}));
  d.locations=sortById(S.locations).map(x=>({id:x.id,...strip(x)}));
  const p=P()||{};d.project={targetSec:p.targetSec||0,pagesPerDay:p.pagesPerDay||null};
  return d;
}
const curHash=()=>snapHashOf(snapData());
const snapsSorted=()=>[...S.snaps].sort((a,b)=>(b.at||0)-(a.at||0));
/* la sauvegarde qui correspond exactement à l'état actuel du projet (la plus récente) */
const snapCurrent=h=>{const m=snapsSorted().filter(s=>s.hv===2&&s.hash===h);const v=projVer(P());return m.find(s=>(s.n||1)===v)||m[0]||null;};
/* nouvelle empreinte pour les sauvegardes faites avant la v1.9.1 */
function snapMigrate(){
  if(SNAP.mig)return SNAP.mig;
  const todo=S.snaps.filter(s=>s.hv!==2&&!SNAP.migBad.has(s.id));if(!todo.length||!S.canWrite)return Promise.resolve();
  const pid=S.pid;
  SNAP.mig=(async()=>{for(const s of todo){if(S.pid!==pid)break;
      try{const d=await loadSnap(s);await S.db.doc(base()+"/snapshots/"+s.id).update({hash:snapHashOf(d),hv:2});}catch{SNAP.migBad.add(s.id);}}})()
    .finally(()=>{SNAP.mig=null;});
  return SNAP.mig;
}
function snapSchedule(){
  if(!S.pid||!S.canWrite||H.applying||SNAP.busy||S.restoring)return;
  if(!S.scenes.length)return;
  const now=Date.now();if(!SNAP.timer)SNAP.first=now;
  clearTimeout(SNAP.timer);
  const wait=Math.max(1500,Math.min(30000,SNAP.first+180000-now));
  SNAP.timer=setTimeout(()=>{SNAP.timer=null;takeSnapshot({});},wait);
}
/* o.force : enregistrer même si cet état existe déjà ; o.strict : remonter les erreurs */
async function takeSnapshot(o){
  if(!S.pid||!S.canWrite)return null;
  if(SNAP.busy){if(!o.force&&!o.strict)return null;while(SNAP.busy)await new Promise(r=>setTimeout(r,200));}
  if(!o.force)await snapMigrate();
  const data=snapData();const json=JSON.stringify(data);const hash=snapHashOf(data);
  if(!o.force&&S.snaps.some(s=>s.hv===2&&s.hash===hash)){SNAP.lastHash=hash;return null;}
  SNAP.busy=true;
  try{
    const pid=S.pid,bs=base();const id=Date.now().toString(36)+uid().slice(0,4);
    await snapSaveImages(bs);
    const parts=[];for(let i=0;i<json.length;i+=SNAP.PART)parts.push(json.slice(i,i+SNAP.PART));
    for(let i=0;i<parts.length;i++)await S.db.doc(bs+"/snapparts/"+id+"_"+i).set({s:parts[i]});
    if(S.pid!==pid)return null;
    const meta={at:Date.now(),by:S.me?.id||null,hash,hv:2,parts:parts.length,size:json.length,named:!!o.named,label:o.label||"",note:o.note||"",n:o.n||projVer(P()),
      counts:{scenes:data.scenes.length,shots:data.shots.filter(x=>!isOpt(x)).length,elements:data.elements.length,days:data.days.length}};
    await S.db.doc(bs+"/snapshots/"+id).set(meta);
    SNAP.lastHash=hash;SNAP.lastAt=meta.at;
    snapPrune(id);return id;
  }catch(e){if(o.force||o.strict)throw e;return null;}
  finally{SNAP.busy=false;render();}
}
/* les photos des plans (gardées dans le plan lui-même) sont rangées une fois, à part, pour pouvoir revenir à une version avec ses photos */
async function snapSaveImages(bs){
  SNAP.imgs=SNAP.imgs||new Set();
  for(const x of S.shots){const v=String(x.img||"");if(!/^data:image\//.test(v)||v.length>240000)continue;const h=snapHash(v);if(SNAP.imgs.has(h))continue;
    try{const r=await S.db.doc(bs+"/snapimgs/"+h).get();if(!r.exists)await S.db.doc(bs+"/snapimgs/"+h).set({d:v});SNAP.imgs.add(h);}catch{}}
}
async function snapLoadImage(h){try{const r=await S.db.doc(base()+"/snapimgs/"+h).get();return r.exists?r.data().d||null:null;}catch{return null;}}
async function snapPrune(keepId){
  const autos=snapsSorted().filter(s=>!s.named&&s.id!==keepId);
  const extra=autos.slice(SNAP.KEEP-1);
  for(const s of extra){try{for(let i=0;i<(s.parts||1);i++)await S.db.doc(base()+"/snapparts/"+s.id+"_"+i).delete();await S.db.doc(base()+"/snapshots/"+s.id).delete();}catch{}}
}
async function loadSnap(meta){
  let json="";
  for(let i=0;i<(meta.parts||1);i++){const r=await S.db.doc(base()+"/snapparts/"+meta.id+"_"+i).get();if(!r.exists)throw{code:"snapshot_incomplet"};json+=r.data().s||"";}
  return JSON.parse(json);
}
function snapTitle(s){return s.named?(s.label&&s.label!=="v"+s.n?s.label:"Nouvelle version"):(s.label||"Sauvegarde automatique");}
function snapLabel(s){return"v"+(s.n||1)+" du "+fmtWhen(s.at);}
const fmtWhen=t=>new Date(t).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
function saveStatus(){
  if(!S.pid)return"";
  if(S.restoring)return"Retour en cours…";
  if(SNAP.busy)return"Enregistrement…";
  const last=snapsSorted()[0];return last?"Enregistré "+timeAgo(Math.max(last.at,SNAP.lastAt||0)):"";
}
async function restoreSnapshot(meta){
  if(S.busy||SNAP.busy){toast("Patiente : une opération est en cours.");return;}
  clearTimeout(SNAP.timer);SNAP.timer=null;
  S.restoring=true;S.busy={done:0,total:1,ctl:new AbortController(),label:"Retour à la version"};render();
  let ok=false;
  try{
    await hFlush();
    const data=await loadSnap(meta);
    /* l'état actuel est gardé, sauf s'il est déjà dans la liste */
    await takeSnapshot({strict:true,label:"État avant le retour à la v"+(meta.n||1)});
    const arrs={scenes:S.scenes,elements:S.elements,shots:S.shots,days:S.days,locations:S.locations};
    const ops=[];
    for(const col of SNAP_COLS){
      const cur=new Map(arrs[col].map(x=>[x.id,x]));const want=new Map((data[col]||[]).map(x=>[x.id,x]));
      for(const id of cur.keys())if(!want.has(id))ops.push({path:base()+"/"+col+"/"+id,val:null});
      for(const[id,w]of want){let{id:_,...doc}=w;const c=cur.get(id);
        if(col==="scenes"&&!("body" in doc))doc.body=bodyFromBlocks(doc.blocks||[]);
        if(col==="shots"&&typeof doc.img==="string"&&doc.img.startsWith("@keep:")){const h=doc.img.slice(6);doc.img=c&&c.img&&snapHash(String(c.img))===h?c.img:((await snapLoadImage(h))||c?.img||null);}
        if(c){const{id:__,updatedAt,updatedBy,...cc}=c;const{updatedAt:a2,updatedBy:b2,...dd}=doc;if(JSON.stringify(snapNorm(cc))===JSON.stringify(snapNorm(dd)))continue;}
        ops.push({path:base()+"/"+col+"/"+id,val:doc});}
    }
    S.busy.total=ops.length+1;render();
    await chunked(ops,6,async o=>{if(o.val===null)await S.db.doc(o.path).delete();else await S.db.doc(o.path).set(o.val);S.busy.done++;});
    const pu={version:meta.n||1};if(data.project){pu.targetSec=data.project.targetSec||0;if(data.project.pagesPerDay)pu.pagesPerDay=data.project.pagesPerDay;}
    await S.db.doc("projects/"+S.pid).update(pu);
    H.undo=[];H.redo=[];H.shadow.clear();ED.sigs.clear();
    /* la version choisie redevient la version actuelle : aucune nouvelle sauvegarde n'est créée */
    await new Promise(r=>setTimeout(r,900));
    const h=curHash();
    if(!S.snaps.some(s=>s.hv===2&&s.hash===h))await S.db.doc(base()+"/snapshots/"+meta.id).update({hash:h,hv:2});
    SNAP.lastHash=h;ok=true;
    toast("Projet revenu à la "+snapLabel(meta)+". L'état d'avant reste dans la liste des versions.",6000);
  }catch(e){toast("Le retour à cette version a échoué ("+(e?.code||"erreur")+"). Rien n'a été perdu : l'état d'avant est dans la liste des versions.",6000);}
  finally{S.busy=null;S.restoring=false;if(!ok)SNAP.lastHash=null;render();}
}
async function snapDelete(s){
  for(let i=0;i<(s.parts||1);i++)await S.db.doc(base()+"/snapparts/"+s.id+"_"+i).delete();
  await S.db.doc(base()+"/snapshots/"+s.id).delete();
}
function confirmSnapDelete(s){
  const c=modal(`<h3>Supprimer cette version ?</h3><p><b>v${s.n||1} · ${esc(snapTitle(s))}</b> du ${esc(fmtWhen(s.at))} sera supprimée pour toute l'équipe. On ne pourra plus y revenir.</p>
    ${s.named?`<p class="empty">C'est une version nommée. Le numéro v${s.n||1} ne sera pas réutilisé.</p>`:""}

    try{await snapDelete(s);c.remove();toast("Version supprimée.");}catch(e){b.disabled=false;writeErr(e);}};
}
async function openVersions(){
  const p=P();if(!p)return;
  const m=modal(`<h3>Historique des versions · ${esc(p.name||"Projet")}</h3>
    <p class="empty">Chaque modification est enregistrée automatiquement. Choisis une version pour que le projet revienne à cet état ; l'état actuel reste dans la liste, tu peux donc toujours y retourner.</p>
    <div class="vlist" id="vl"></div>

  m.querySelector(".modal").style.maxWidth="660px";

    try{const id=await takeSnapshot({strict:true,label:"Enregistrement manuel"});toast(id?"Version enregistrée.":"Cet état est déjà enregistré : c'est la version actuelle.");}catch(e){writeErr(e);}
    now.disabled=false;now.textContent="Enregistrer maintenant";};

      const go=document.createElement("button");go.className="btn small";go.type="button";go.textContent="Revenir à cette version";
      go.onclick=()=>{const c2=modal(`<h3>Revenir à la v${s.n||1} ?</h3><p>Le projet reprend son état du <b>${esc(fmtWhen(s.at))}</b> (${esc(snapTitle(s))}) : scénario, découpage, dépouillement et plan de travail, pour toute l'équipe. Il repasse en <b>v${s.n||1}</b>.</p><p class="empty">L'état actuel reste dans la liste des versions : tu pourras y retourner.</p><div class="mfoot"><button class="btn" id="rv-c">Annuler</button><button class="btn primary" id="rv-ok">Revenir à la v${s.n||1}</button></div>`);
        c2.querySelector("#rv-c").onclick=()=>c2.remove();c2.querySelector("#rv-ok").onclick=()=>{c2.remove();S.modalRefresh=null;m.remove();restoreSnapshot(s);};};
      const del=document.createElement("button");del.className="btn small vdel";del.type="button";del.title="Supprimer cette version";del.setAttribute("aria-label","Supprimer la v"+(s.n||1)+" du "+fmtWhen(s.at));
      del.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zm-3 6h12l-1 12H7L6 9zm4 2v8h2v-8h-2zm4 0v8h2v-8h-2z"/></svg>`;

    box.innerHTML="";

    const cur=snapCurrent(curHash());
    if(!cur){const d=document.createElement("div");d.className="cur";
      d.innerHTML=`<b>${esc(verTag(P()))}</b><span><strong>Modifications en cours<em class="vcur">Version actuelle</em></strong><small>${SNAP.busy||SNAP.mig?"Enregistrement…":"Enregistrées automatiquement dans quelques secondes"}</small></span>`;box.append(d);}
    list.forEach(s=>box.append(row(s,s===cur)));
  };
  let sig="";S.modalRefresh=()=>{const k=S.snaps.map(s=>s.id+":"+s.hash).join()+"|"+(SNAP.busy?1:0);if(k!==sig){sig=k;draw();}};S.modalRefresh();
}

/* téléphone : l'en-tête se replie quand on fait défiler vers le bas, revient quand on remonte */
(function(){const last=new WeakMap();
  document.addEventListener("scroll",e=>{
    if(!matchMedia("(max-width:760px)").matches){document.body.classList.remove("hdr-hide");return;}

});

  const F=["prod","roll","scene","plan","take","dir","dop","cam","son"];
  const DEF={prod:"",roll:"A001",scene:"1",plan:"1",take:"1",dir:"",dop:"",cam:"A",son:""};
  F.forEach(f=>{const el=g("cl-"+f);el.value=get(f,DEF[f]);el.addEventListener("input",()=>put(f,el.value));});
  const setTake=n=>{n=Math.max(1,n|0);g("cl-take").value=n;put("take",String(n));paintCircle();};
  g("cl-tplus").onclick=()=>setTake((parseInt(g("cl-take").value)||0)+1);
  g("cl-tminus").onclick=()=>setTake((parseInt(g("cl-take").value)||2)-1);
  /* nouveau plan ou nouvelle scène : on repart à la prise 1 */
  g("cl-scene").addEventListener("change",()=>{fillPlans();setTake(1);});
  g("cl-plan").addEventListener("change",()=>setTake(1));
  ["cl-scene","cl-plan","cl-take"].forEach(id=>g(id).addEventListener("input",paintCircle));
  g("cl-heart").onclick=()=>{const k=curKey();if(circ.has(k))circ.delete(k);else circ.add(k);put(circKey(),[...circ]);paintCircle();renderLog();
    try{if(navigator.vibrate)navigator.vibrate(circ.has(k)?[20,40,20]:15);}catch(e){}};
  const today=()=>{const d=new Date();return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getFullYear()).slice(2);};

  /* bascules */
  const PAIRS={"cl-ie":["Int","Ext"],"cl-dn":["Jour","Nuit"]};
  const paintPair=(id,i)=>{const b=g(id);b.textContent=PAIRS[id][i];b.setAttribute("aria-pressed",i===0?"true":"false");b.dataset.i=i;};
  Object.keys(PAIRS).forEach(id=>{paintPair(id,get(id,0));g(id).onclick=()=>{const i=1-(+g(id).dataset.i||0);put(id,i);paintPair(id,i);};});
  const paintOn=(id,on)=>{g(id).setAttribute("aria-pressed",on?"true":"false");if(id==="cl-tail")g("cl-slate").classList.toggle("tail",on);if(id==="cl-mos")box.classList.toggle("mos",on);};
  ["cl-mos","cl-tail"].forEach(id=>{paintOn(id,get(id,false));g(id).onclick=()=>{const on=g(id).getAttribute("aria-pressed")!=="true";put(id,on);paintOn(id,on);};});
  const isOn=id=>g(id).getAttribute("aria-pressed")==="true";

  /* lien avec le projet : titre, scène en cours, plans du découpage */
  function sceneByNum(n){try{return S.scenes.find(s=>String(s.num)===String(n).trim())||null;}catch(e){return null;}}
  function fillScenes(){const dl=g("cl-scenes");dl.innerHTML="";
    try{for(const s of S.scenes){const o=document.createElement("option");o.value=s.num;o.label=s.location||s.heading||"";dl.append(o);}}catch(e){}}
  function fillPlans(){const dl=g("cl-plans");dl.innerHTML="";const s=sceneByNum(g("cl-scene").value);if(!s)return;
    try{shotsOf(s.id).forEach((x,i)=>{const o=document.createElement("option");o.value=String(i+1);o.label=[SHOT_T[x.type]||x.type,x.move].filter(Boolean).join(" · ");dl.append(o);});}catch(e){}}
  function syncProject(){
    const p=cur();
    if(p){g("cl-prod").value=p.name||"";put("prod",g("cl-prod").value);
      const s=S.sid&&typeof scene==="function"?scene(S.sid):null;const key=p.id+"|"+(s?s.id:"");
      if(s&&get("auto","")!==key){g("cl-scene").value=s.num;put("scene",s.num);g("cl-plan").value="1";put("plan","1");setTake(1);put("auto",key);
        const dn=s.dayNight==="N"?1:s.dayNight==="J"?0:null;if(dn!==null){paintPair("cl-dn",dn);put("cl-dn",dn);}
        const ie=s.intExt==="EXT"?1:s.intExt==="INT"?0:null;if(ie!==null){paintPair("cl-ie",ie);put("cl-ie",ie);}}}
    fillScenes();fillPlans();
  }

  /* timecode heure du jour, non drop */
  const fpsSel=g("cl-fps");fpsSel.value=get("fps","25");
  const nominal=()=>Math.round(parseFloat(fpsSel.value)||25);
  const paintFps=()=>{g("cl-fpslbl").textContent=fpsSel.value;};paintFps();
  fpsSel.onchange=()=>{put("fps",fpsSel.value);paintFps();};
  const p2=n=>String(n).padStart(2,"0");
  const tcAt=t=>{const d=new Date(t);const f=Math.min(nominal()-1,Math.floor(d.getMilliseconds()/1000*nominal()));return p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds())+":"+p2(f);};
  const tcEl=g("cl-tc");let frozenUntil=0,last="",raf=0;
  function tick(){const now=Date.now();if(now>=frozenUntil){g("cl-tcbar").classList.remove("frozen");const s=tcAt(now);if(s!==last){tcEl.textContent=s;last=s;}}raf=requestAnimationFrame(tick);}

  /* son : claquement + bip 1 kHz. Lecteur média d'abord (il joue même avec le bouton silencieux de l'iPhone), Web Audio en secours */
  try{if(navigator.audioSession)navigator.audioSession.type="playback";}catch(e){}
  const SR=44100;
  function wav(beep){
    const n=Math.floor(SR*(beep?0.3:0.09)),b=new ArrayBuffer(44+n*2),v=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
    w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
    v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
    const nl=Math.floor(SR*0.08),bl=Math.floor(SR*0.25),fade=Math.floor(SR*0.02);
    for(let i=0;i<n;i++){let x=0;if(i<nl)x+=(Math.random()*2-1)*Math.pow(1-i/nl,5);
      if(beep&&i<bl+fade){const env=i<88?i/88:i>bl?Math.max(0,1-(i-bl)/fade):1;x+=0.6*env*Math.sin(2*Math.PI*1000*i/SR);}
      v.setInt16(44+i*2,Math.round(Math.max(-1,Math.min(1,x))*32000),true);}
    return URL.createObjectURL(new Blob([b],{type:"audio/wav"}));}
  const players={};
  function player(beep){const k=beep?"b":"n";if(!players[k]){const a=new Audio(wav(beep));a.preload="auto";a.setAttribute("playsinline","");try{a.load();}catch(e){}players[k]=a;}return players[k];}
  let mode="",ac=null,noise=null;
  function ctx(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C({latencyHint:"interactive"});
      const len=Math.floor(ac.sampleRate*0.08);noise=ac.createBuffer(1,len,ac.sampleRate);const ch=noise.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,5);}
    return ac;}
  function playWeb(){const c=ctx();if(!c)return Promise.reject(0);
    return(c.state==="running"?Promise.resolve():c.resume()).then(()=>{if(c.state!=="running")throw 0;const t=c.currentTime+0.005;
      const src=c.createBufferSource();src.buffer=noise;src.connect(c.destination);src.start(t);
      if(g("cl-beep").checked){const o=c.createOscillator(),og=c.createGain();o.type="sine";o.frequency.value=1000;
        og.gain.setValueAtTime(0,t);og.gain.linearRampToValueAtTime(0.9,t+0.002);og.gain.setValueAtTime(0.9,t+0.25);og.gain.linearRampToValueAtTime(0,t+0.27);
        o.connect(og).connect(c.destination);o.start(t);o.stop(t+0.3);}});}
  function playMedia(){const a=player(g("cl-beep").checked);try{a.pause();a.currentTime=0;}catch(e){}const pr=a.play();return pr&&pr.then?pr:Promise.resolve();}
  const audioStatus=t=>{g("cl-audio").textContent=t;};
  function sound(){
    if(mode==="webaudio"){playWeb().catch(()=>audioStatus("Son : bloqué"));return;}
    playMedia().then(()=>{mode="media";audioStatus("Son : prêt");})
      .catch(()=>playWeb().then(()=>{mode="webaudio";audioStatus("Son : prêt");}).catch(()=>audioStatus("Son : bloqué · vérifie le volume")));}
  function unlock(){if(box.hidden)return;player(true);player(false);}
  ["pointerup","touchend","keydown"].forEach(ev=>box.addEventListener(ev,unlock,{passive:true}));
  g("cl-test").onclick=()=>sound();

  /* journal, un par projet, gardé sur cet appareil */
  const logKey=()=>"log."+((typeof S!=="undefined"&&S.pid)||"libre");
  let log=[];
  function renderLog(){const ol=g("cl-list");ol.innerHTML="";
    if(!log.length){const li=document.createElement("li");li.className="cl-empty";li.textContent="Aucun clap pour l’instant. Touche la claquette ou le timecode pour marquer une prise.";ol.append(li);return;}
    log.slice().reverse().forEach(e=>{const li=document.createElement("li");
      const a=document.createElement("span");a.className="k";a.textContent=e.tc;
      const b=document.createElement("span");b.textContent=(circ.has(ck(e.scene,e.plan,e.take))?"❤️ ":"")+"S"+e.scene+" · P"+e.plan+" · T"+e.take+" · "+e.cam+" / "+e.roll+(e.son&&!e.mos?" · son "+e.son:"");
      const c=document.createElement("span");c.className="f";c.textContent=[e.mos?"MOS":"",e.tail?"QUEUE":""].filter(Boolean).join(" ")||e.fps;
      li.append(a,b,c);ol.append(li);});}
  function csv(){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
    const head=["date","timecode","ips","production","scene","plan","prise","camera","roll","son","int_ext","jour_nuit","mos","queue","cerclee"];
    return[head.join(";")].concat(log.map(e=>[e.date,e.tc,e.fps,e.prod,e.scene,e.plan,e.take,e.cam,e.roll,e.son||"",e.ie,e.dn,e.mos?1:0,e.tail?1:0,circ.has(ck(e.scene,e.plan,e.take))?1:0].map(q).join(";"))).join("\n");}
  g("cl-copylog").onclick=()=>{const text=csv(),tb=g("cl-copybox"),btn=g("cl-copylog");
    const fb=()=>{tb.hidden=false;tb.value=text;tb.focus();tb.select();btn.textContent="Sélectionné";};
    try{navigator.clipboard.writeText(text).then(()=>{btn.textContent="Copié";setTimeout(()=>btn.textContent="Copier CSV",1500);},fb);}catch(e){fb();}};
  let armed=false;
  g("cl-clearlog").onclick=()=>{const b=g("cl-clearlog");
    if(!armed){armed=true;b.textContent="Confirmer ?";setTimeout(()=>{armed=false;b.textContent="Vider";},2500);return;}
    log=[];put(logKey(),log);renderLog();armed=false;b.textContent="Vider";g("cl-copybox").hidden=true;};

  /* claquer */
  const clapper=g("cl-clapper"),flash=g("cl-flash");let busy=false;
  function clap(){
    if(busy||box.hidden)return;busy=true;
    const t=Date.now(),code=tcAt(t);
    clapper.classList.add("closed");sound();
    flash.classList.add("on");setTimeout(()=>flash.classList.remove("on"),Math.max(40,2000/nominal()));
    tcEl.textContent=code;last="";frozenUntil=t+1500;g("cl-tcbar").classList.add("frozen");
    log.push({tc:code,fps:fpsSel.value,date:g("cl-date").value,prod:g("cl-prod").value,scene:g("cl-scene").value,plan:g("cl-plan").value,take:g("cl-take").value,cam:g("cl-cam").value,roll:g("cl-roll").value,son:g("cl-son").value,ie:g("cl-ie").textContent,dn:g("cl-dn").textContent,mos:isOn("cl-mos"),tail:isOn("cl-tail")});
    if(log.length>500)log=log.slice(-500);put(logKey(),log);renderLog();
    try{if(navigator.vibrate)navigator.vibrate(30);}catch(e){}
    setTimeout(()=>{clapper.classList.remove("closed");busy=false;},600);
  }
  clapper.onclick=clap;g("cl-go").onclick=clap;g("cl-tcbar").onclick=clap;

  /* touches : télécommande Bluetooth, pointeur de présentation, clavier (et volume quand le système le transmet) */
  const KEYS=new Set(["AudioVolumeUp","AudioVolumeDown","VolumeUp","VolumeDown","Enter"," ","Spacebar","PageDown","PageUp","ArrowRight","ArrowDown","MediaPlayPause","MediaTrackNext","Camera"]);
  const CODES=new Set([24,25,174,175,13,32,33,34]);
  window.addEventListener("keydown",e=>{
    if(box.hidden)return;
    if(e.key==="Escape"){e.preventDefault();e.stopImmediatePropagation();close();return;}
    const tag=(e.target&&e.target.tagName)||"";
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag))return;
    if(tag==="BUTTON"&&(e.key==="Enter"||e.key===" "))return;
    if(!(KEYS.has(e.key)||CODES.has(e.keyCode)))return;
    e.preventDefault();e.stopImmediatePropagation();if(e.repeat)return;
    clap();g("cl-remote").textContent="Déclencheur : "+(e.key&&e.key!==" "?e.key:"Espace");
  },true);

  /* écran allumé + plein écran */
  let lock=null;
  async function keepAwake(){if(lock||box.hidden||!("wakeLock" in navigator))return;
    try{lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>{lock=null;});}catch(e){}}
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")keepAwake();});
  g("cl-fs").onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await box.requestFullscreen();}catch(e){g("cl-fs").textContent="Indisponible ici";}};

  /* ouvrir / fermer */
  function open(){
    syncProject();g("cl-date").value=today();
    circ=new Set(get(circKey(),[]));paintCircle();
    log=get(logKey(),[]);renderLog();
    box.hidden=false;document.documentElement.style.overflow="hidden";
    if(!raf)raf=requestAnimationFrame(tick);
    box.scrollTop=0;unlock();keepAwake();box.focus({preventScroll:true});
  }
  function close(){
    box.hidden=true;document.documentElement.style.overflow="";
    if(raf){cancelAnimationFrame(raf);raf=0;}
    if(lock){try{lock.release();}catch(e){}lock=null;}
    if(document.fullscreenElement===box){try{document.exitFullscreen();}catch(e){}}
    const b=g("b-clap");if(b)b.focus();
  }
  g("cl-close").onclick=close;g("cl-x").onclick=close;
  /* après un toucher, on rend le focus à l'ardoise : la touche Entrée d'une télécommande ne réactive pas le dernier bouton */
  box.addEventListener("pointerup",e=>{const b=e.target.closest&&e.target.closest("button");if(b)setTimeout(()=>{if(document.activeElement===b)box.focus({preventScroll:true});},0);});
  const btn=g("b-clap");if(btn)btn.onclick=open;
})();
</script>
