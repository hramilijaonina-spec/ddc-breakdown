  box.querySelectorAll(".prm").forEach(b=>b.onclick=e=>{e.stopPropagation();moveScenes([b.dataset.sid],null);});
  on("d-openall",()=>{daysSorted().forEach(d=>planOpenSet().add(d.id));planOpenSave();render();});
  on("d-closeall",()=>{planOpenSet().clear();planOpenSave();render();});
  on("pool-tg",()=>{if(!matchMedia("(max-width:1150px)").matches)return;S.poolOpen=!S.poolOpen;render();});
  box.querySelectorAll(".pmove").forEach(b=>b.onclick=ev=>{ev.stopPropagation();moveMenu([b.dataset.sid],b);});
  box.querySelectorAll(".grp-send").forEach(b=>b.onclick=()=>{const g=planGroups(S.scenes.filter(s=>!isPlanned(s))).find(x=>x.key===b.dataset.key);if(g)moveMenu(g.scenes.map(s=>s.id),b);});
  box.querySelectorAll(".pstrip").forEach(st=>st.ondblclick=e=>{if(e.target.closest(".p-done"))return;selectScene(st.dataset.sid);});
  box.querySelectorAll(".p-donecb").forEach(c=>{c.onclick=e=>e.stopPropagation();c.onchange=()=>{const s=scene(c.dataset.sid);if(!s)return;const v=c.checked;
    c.closest(".pstrip").classList.toggle("done",v);
    trk(base()+"/scenes/"+s.id).update({filmed:v},{label:v?"Scène "+s.num+" tournée":"Scène "+s.num+" à tourner"}).catch(writeErr);};});
  if(!S.canWrite)return;
  box.querySelectorAll(".pstrip").forEach(st=>{
    st.ondragstart=e=>{S.dragging=st.dataset.sid;st.classList.add("dragging");try{e.dataTransfer.setData("text/plain",st.dataset.sid);e.dataTransfer.effectAllowed="move";}catch{}};
    st.ondragend=()=>{S.dragging=null;box.querySelectorAll(".over,.before").forEach(x=>x.classList.remove("over","before"));if(S.pendingRender){S.pendingRender=false;render();}else st.classList.remove("dragging");};
  });
  box.querySelectorAll(".day-h").forEach(h=>{
    h.ondragover=e=>{if(!S.dragging)return;e.preventDefault();h.classList.add("over");};
    h.ondragleave=e=>{if(!h.contains(e.relatedTarget))h.classList.remove("over");};
    h.ondrop=e=>{e.preventDefault();h.classList.remove("over");const sid=S.dragging;if(!sid)return;S.dragging=null;moveScenes([sid],h.dataset.did,null);};
  });
  box.querySelectorAll(".dropzone").forEach(z=>{
    z.ondragover=e=>{if(!S.dragging)return;e.preventDefault();box.querySelectorAll(".over,.before").forEach(x=>x.classList.remove("over","before"));z.classList.add("over");
      const tgt=dropTarget(z,e.clientY);if(tgt)tgt.classList.add("before");};
    z.ondragleave=e=>{if(!z.contains(e.relatedTarget))z.classList.remove("over");};
    z.ondrop=e=>{e.preventDefault();const sid=S.dragging;if(!sid)return;const tgt=dropTarget(z,e.clientY);
      const did=z.dataset.day||null;S.dragging=null;moveScenes([sid],did,tgt?tgt.dataset.sid:null);};
  });
}
function dropTarget(zone,y){
  if(!zone.dataset.day)return null;
  for(const st of zone.querySelectorAll(".pstrip")){if(st.dataset.sid===S.dragging)continue;const r=st.getBoundingClientRect();if(y<r.top+r.height/2)return st;}
  return null;
}
async function moveScenes(sids,dayId,beforeSid){
  const lab=(dayId?"Placer ":"Retirer ")+(sids.length>1?sids.length+" scènes":"la scène "+(scene(sids[0])?.num||""));
  return hGroup(lab,()=>moveScenesRaw(sids,dayId,beforeSid));
}
async function moveScenesRaw(sids,dayId,beforeSid){
  try{
    if(!dayId){await chunked(sids,5,sid=>trk(base()+"/scenes/"+sid).update({dayId:null,dayPos:null}));return;}
    const list=scenesOfDay(dayId).filter(s=>!sids.includes(s.id));
    let lo,hi;
    if(beforeSid){const i=list.findIndex(s=>s.id===beforeSid);hi=i>-1?(list[i].dayPos||0):null;lo=i>0?(list[i-1].dayPos||0):(hi!==null?hi-1024*(sids.length+1):0);}
    else{lo=list.length?(list[list.length-1].dayPos||0):0;hi=null;}
    const step=hi===null?1024:(hi-lo)/(sids.length+1);
    await chunked(sids.map((sid,i)=>({sid,pos:lo+step*(i+1)})),5,({sid,pos})=>trk(base()+"/scenes/"+sid).update({dayId,dayPos:pos}));
  }catch(e){writeErr(e);}
}
function moveMenu(sids,anchor){
  const days=daysSorted();const one=sids.length===1?scene(sids[0]):null;
  const items=days.map((d,i)=>({label:"J"+(i+1)+(d.date?" · "+fmtDate(d.date):"")+" · "+fmtE(scenesOfDay(d.id).reduce((a,s)=>a+(s.eighths||0),0))+" p.",run:()=>moveScenes(sids,d.id,null)}));
  items.push({label:"Nouvelle journée",run:async()=>{const id=await addDay();if(id)moveScenes(sids,id,null);}});
  if(one&&isPlanned(one)){const list=scenesOfDay(one.dayId);const i=list.indexOf(one);
    if(i>0)items.push({label:"Monter dans la journée",run:()=>moveScenes(sids,one.dayId,list[i-1].id)});
    if(i<list.length-1)items.push({label:"Descendre dans la journée",run:()=>moveScenes(sids,one.dayId,list[i+2]?list[i+2].id:null)});
    items.push({label:"Retirer du plan",danger:true,run:()=>moveScenes(sids,null)});
    items.push({label:"Ouvrir la scène",run:()=>selectScene(one.id)});}
  openPop(anchor.getBoundingClientRect(),one?"Scène "+one.num:sids.length+" scènes",items);
}
async function addDay(){
  const max=S.days.reduce((a,d)=>Math.max(a,d.order||0),0);
  try{const id=uid();await trk(base()+"/days/"+id).set({order:max+1,date:nextDate(),createdAt:Date.now()},{before:null,label:"Nouvelle journée"});return id;}catch(e){writeErr(e);return null;}
}
function nextDate(){const ds=daysSorted().map(d=>d.date).filter(Boolean);if(!ds.length)return"";const d=new Date(ds[ds.length-1]+"T12:00:00");if(isNaN(d))return"";d.setDate(d.getDate()+1);return d.toISOString().slice(0,10);}
async function swapDay(did,dir){
  const days=daysSorted();const i=days.findIndex(d=>d.id===did);const j=i+dir;if(i<0||j<0||j>=days.length)return;
  try{await hGroup("Déplacer J"+(i+1),()=>chunked(days.map((d,k)=>({d,o:k===i?j:k===j?i:k})),5,({d,o})=>d.order===o+1?null:trk(base()+"/days/"+d.id).update({order:o+1})));}catch(e){writeErr(e);}
}
async function deleteDay(did){
  const i=daysSorted().findIndex(d=>d.id===did);const sc=scenesOfDay(did);
  try{await hGroup("Supprimer J"+(i+1),async()=>{await chunked(sc,5,s=>trk(base()+"/scenes/"+s.id).update({dayId:null,dayPos:null}));await trk(base()+"/days/"+did).delete();});
    toast("J"+(i+1)+" supprimée."+(sc.length?" Ses "+sc.length+" scène"+(sc.length>1?"s sont revenues":" est revenue")+" dans la liste.":""));}catch(e){writeErr(e);}
}

async function assignDecor(key,lid){
  try{
    for(const l of S.locations){if((l.decors||[]).includes(key)&&l.id!==lid)await S.db.doc(base()+"/locations/"+l.id).update({decors:(l.decors||[]).filter(k=>k!==key)});}
    const t=S.locations.find(l=>l.id===lid);if(t&&!(t.decors||[]).includes(key))await S.db.doc(base()+"/locations/"+t.id).update({decors:[...(t.decors||[]),key]});
  }catch(e){writeErr(e);}
}

/* plan automatique */
function buildAutoPlan(scenes,target8){
  const groups=new Map();
  for(const s of scenes){const l=lieuOf(s);const k=l?"l:"+l.id:"d:"+decorKey(s);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(s);}
  const dnRank=s=>s.dayNight==="J"?0:s.dayNight==="N"?2:1;
  const days=[];let cur=null,curE8=0;
  for(const list of [...groups.values()].sort((a,b)=>(a[0].order||0)-(b[0].order||0))){
    list.sort((a,b)=>dnRank(a)-dnRank(b)||(a.order||0)-(b.order||0));
    if(cur&&curE8>=target8*0.6){cur=null;}
    for(const s of list){const e=s.eighths||1;
      if(!cur||(curE8>0&&curE8+e>target8)){cur=[];days.push(cur);curE8=0;}
      cur.push(s.id);curE8+=e;}
  }
  return days;
}
function openAutoPlan(){
  const pool=S.scenes.filter(s=>!isPlanned(s));
  const filmed=S.scenes.filter(s=>s.filmed);
  /* journées gardées si on ne touche pas à ce qui est tourné : celles qui ont au moins une scène tournée */
  const keepDays=daysSorted().filter(d=>scenesOfDay(d.id).some(s=>s.filmed));
  const todo=S.scenes.filter(s=>!s.filmed);
  const def=filmed.length?"keep":pool.length?"pool":"all";
  const m=modal(`<h3>Proposer un plan</h3>
    <p class="empty">L'outil regroupe les scènes par lieu de tournage (ou par décor quand le lieu n'est pas défini), met le jour avant la nuit, garde l'ordre du scénario dans chaque lieu, puis remplit les journées jusqu'à l'objectif de pages. Tu ajustes ensuite à la main.</p>
    <label class="row"><span class="label">Pages par jour</span><input type="number" id="ap-t" min="0.5" max="20" step="0.5" value="${esc(P()?.pagesPerDay||4)}"></label>
    <label class="row"><span class="label">Date de la première journée (facultatif)</span><input type="date" id="ap-d"></label>
    <fieldset class="row" style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px"><span class="label">Scènes concernées</span>
      ${filmed.length?`<label class="ap-opt"><input type="radio" name="ap-s" value="keep" ${def==="keep"?"checked":""} ${todo.length?"":"disabled"}><span><b>Garder ce qui est tourné</b> : les ${filmed.length} scène${filmed.length>1?"s":""} tournée${filmed.length>1?"s":""} et ${keepDays.length>1?"leurs "+keepDays.length+" journées restent":"leur journée reste"} telles quelles. Les ${todo.length} scène${todo.length>1?"s":""} pas encore tournée${todo.length>1?"s":""} sont replanifiée${todo.length>1?"s":""} dans de nouvelles journées, à la suite.</span></label>`:""}
      <label class="ap-opt"><input type="radio" name="ap-s" value="pool" ${def==="pool"?"checked":""} ${pool.length?"":"disabled"}><span><b>Seulement les scènes à placer</b> : les journées actuelles ne bougent pas, les ${pool.length} scène${pool.length>1?"s":""} à placer vont dans de nouvelles journées, à la suite.</span></label>
      <label class="ap-opt"><input type="radio" name="ap-s" value="all" ${def==="all"?"checked":""}><span><b>Tout refaire</b> : les ${S.days.length} journée${S.days.length>1?"s":""} actuelle${S.days.length>1?"s":""} sont effacée${S.days.length>1?"s":""} et toutes les scènes sont replanifiées${filmed.length?", y compris les "+filmed.length+" déjà tournée"+(filmed.length>1?"s":"")+" (elles restent cochées)":""}.</span></label></fieldset>
    <div id="ap-prev" class="empty"></div>
    <div class="mfoot"><button class="btn" id="ap-c">Annuler</button><button class="btn primary" id="ap-go">Créer le plan</button></div>`);
  const t=m.querySelector("#ap-t"),prev=m.querySelector("#ap-prev"),go=m.querySelector("#ap-go");
  const mode=()=>m.querySelector('input[name="ap-s"]:checked')?.value||"all";
  const calc=()=>{const md=mode();const sc=md==="all"?S.scenes:md==="keep"?todo:pool;const t8=Math.round((Number(t.value)||4)*8);const d=buildAutoPlan(sc,t8);
    prev.textContent=sc.length?`${d.length} journée${d.length>1?"s":""} pour ${sc.length} scène${sc.length>1?"s":""} (${fmtE(sc.reduce((a,s)=>a+(s.eighths||0),0))} pages).`:"Aucune scène à planifier.";go.disabled=!sc.length;return{sc,t8,d};};
  t.oninput=calc;m.querySelectorAll('input[name="ap-s"]').forEach(r=>r.onchange=()=>{delete go.dataset.sure;go.textContent="Créer le plan";go.classList.remove("danger-fill");calc();});calc();
  m.querySelector("#ap-c").onclick=()=>m.remove();
  go.onclick=async()=>{const{d:plan,t8}=calc();const md=mode();
    if(md==="all"&&S.days.length&&!go.dataset.sure){go.dataset.sure="1";go.textContent="Confirmer : tout refaire";go.classList.add("danger-fill");return;}
    go.disabled=true;go.textContent="Création…";
    try{await hGroup("Proposer un plan",async()=>{
      const all=md==="all";let order,date=m.querySelector("#ap-d").value;
      if(all){await chunked(S.scenes.filter(s=>s.dayId),5,s=>trk(base()+"/scenes/"+s.id).update({dayId:null,dayPos:null}));await chunked([...S.days],5,x=>trk(base()+"/days/"+x.id).delete());order=0;}
      else if(md==="keep"){
        const keepIds=new Set(keepDays.map(d=>d.id));
        /* les scènes pas tournées quittent leur journée ; les journées sans scène tournée disparaissent */
        await chunked(S.scenes.filter(s=>s.dayId&&!s.filmed),5,s=>trk(base()+"/scenes/"+s.id).update({dayId:null,dayPos:null}));
        await chunked(S.days.filter(d=>!keepIds.has(d.id)),5,x=>trk(base()+"/days/"+x.id).delete());
        order=keepDays.reduce((a,x)=>Math.max(a,x.order||0),0);
        if(!date){const ds=keepDays.map(d=>d.date).filter(Boolean).sort();if(ds.length){const x=new Date(ds[ds.length-1]+"T12:00:00");if(!isNaN(x)){x.setDate(x.getDate()+1);date=x.toISOString().slice(0,10);}}}}
      else{order=S.days.reduce((a,x)=>Math.max(a,x.order||0),0);if(!date)date=nextDate();}
      date=date||"";
      await S.db.doc("projects/"+S.pid).update({pagesPerDay:t8/8});
      for(const ids of plan){const did=uid();order++;
        await trk(base()+"/days/"+did).set({order,date:date||"",createdAt:Date.now()},{before:null});
        await chunked(ids.map((sid,i)=>({sid,i})),5,({sid,i})=>trk(base()+"/scenes/"+sid).update({dayId:did,dayPos:(i+1)*1024}));
        if(date){const x=new Date(date+"T12:00:00");x.setDate(x.getDate()+1);date=x.toISOString().slice(0,10);}}
      });m.remove();toast(plan.length+" journée"+(plan.length>1?"s":"")+" créée"+(plan.length>1?"s":"")+(md==="keep"?" à la suite des journées tournées":"")+". Ajuste en glissant les scènes.",5000);
    }catch(e){m.remove();writeErr(e);}};
}

/* calculs */
const shotsOf=sid=>S.shots.filter(x=>x.sceneId===sid).sort((a,b)=>(a.pos||0)-(b.pos||0));
function shotNum(x){const s=scene(x.sceneId);return (s?s.num:"?")+"."+(shotsOf(x.sceneId).findIndex(y=>y.id===x.id)+1);}
const sumDur=list=>list.reduce((a,x)=>a+(Number(x.dur)||0),0);
/* durée 0 = plan optionnel : gardé dans le découpage, non compté dans la durée */
const isOpt=x=>x.dur!==undefined&&x.dur!==null&&x.dur!==""&&Number(x.dur)===0;
function fmtDur(sec){sec=Math.round((Number(sec)||0)*10)/10;const m=Math.floor(sec/60);const s=Math.round((sec-m*60)*10)/10;return m+":"+(s<10?"0":"")+String(s).replace(".",",");}
function parseDur(v){v=String(v||"").trim().replace(",",".");if(!v)return 0;const m=v.match(/^(\d+):(\d{1,2}(?:\.\d+)?)$/);if(m)return Number(m[1])*60+Number(m[2]);return Math.max(0,Number(v)||0);}
const shotDoc=id=>trk(base()+"/shots/"+id);
function dcGrow(t){t.style.height="auto";t.style.height=(t.scrollHeight+2)+"px";}

/* rendu */
function renderDecoupage(){
  const box=$("#dc");if(!box||!S.pid)return;
  const st=box.scrollTop;
  keepFocus(()=>{box.innerHTML=decEditHTML();});
  box.scrollTop=st;
  bindDec(box);
  box.querySelectorAll("textarea.dc-grow").forEach(dcGrow);
  DEC.navOpen=false;dcNavUpdate(true);
  if(DEC.focus){const el=document.getElementById("dc-a-"+DEC.focus);
    if(el){DEC.focus=null;const row=el.closest("tr");row.classList.add("dc-flash");row.scrollIntoView({block:"nearest"});if(S.canWrite)el.focus({preventScroll:true});}}
}
/* ---------- téléphone : aller vite d'une scène à l'autre dans le découpage ---------- */
const DCNAV_ICON={prev:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>`,next:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`,
  down:`<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`};
function dcAnchors(){return[...document.querySelectorAll("#dc td.dct-seq[data-sid]")];}
function dcScroller(el){let n=el&&el.parentElement;while(n&&n!==document.body){const o=getComputedStyle(n).overflowY;if((o==="auto"||o==="scroll")&&n.scrollHeight>n.clientHeight+1)return n;n=n.parentElement;}return document.scrollingElement;}
function dcCurrent(){
  const nav=$("#dc-scnav");const as=dcAnchors();if(!as.length)return null;
  const lim=(nav?nav.getBoundingClientRect().bottom:0)+24;let cur=as[0];
  for(const a of as){if(a.closest("tr").getBoundingClientRect().top<=lim)cur=a;else break;}
  return cur.dataset.sid;
}
function dcJump(sid){
  const a=document.querySelector(`#dc td.dct-seq[data-sid="${CSS.escape(sid)}"]`);if(!a)return;
  const tr=a.closest("tr"),nav=$("#dc-scnav"),sc=dcScroller(tr);
  const off=(nav?nav.getBoundingClientRect().height:0)+8;
  const top=sc===document.scrollingElement?tr.getBoundingClientRect().top+scrollY:tr.getBoundingClientRect().top-sc.getBoundingClientRect().top+sc.scrollTop;
  DEC.navSid=sid;DEC.navLock=Date.now();
  sc.scrollTo({top:Math.max(0,top-off-(nav&&nav.offsetTop>0&&sc!==document.scrollingElement?0:0)),behavior:"smooth"});
  dcNavDraw();
}
function dcNavUpdate(force){
  const nav=$("#dc-scnav");if(!nav)return;
  if(!force&&DEC.navLock&&Date.now()-DEC.navLock<900)return;
  const sid=dcCurrent()||S.scenes[0]?.id;
  if(force||sid!==DEC.navSid){DEC.navSid=sid;if(!DEC.navOpen||force)dcNavDraw();}
}
function dcNavDraw(){
  const nav=$("#dc-scnav");if(!nav)return;
  const i=Math.max(0,S.scenes.findIndex(s=>s.id===DEC.navSid));const s=S.scenes[i];if(!s){nav.innerHTML="";return;}
  const meta=sc=>{const all=shotsOf(sc.id);const l=all.filter(x=>!isOpt(x));return l.length+" plan"+(l.length>1?"s":"")+" · "+fmtDur(sumDur(l));};
  nav.classList.toggle("open",!!DEC.navOpen);
  nav.innerHTML=`<button type="button" class="dcn-arrow" data-go="-1" aria-label="Scène précédente" ${i<=0?"disabled":""}>${DCNAV_ICON.prev}</button>
    <button type="button" class="dcn-cur" aria-expanded="${!!DEC.navOpen}" aria-label="Scène ${esc(s.num)} : ${esc(s.heading)}. Choisir une autre scène">
      <b>${esc(s.num)}</b><span><span class="hd">${esc(s.heading)}</span><small>${esc(meta(s))} · ${i+1}/${S.scenes.length}</small></span>${DCNAV_ICON.down}</button>
    <button type="button" class="dcn-arrow" data-go="1" aria-label="Scène suivante" ${i>=S.scenes.length-1?"disabled":""}>${DCNAV_ICON.next}</button>
    ${DEC.navOpen?`<div class="dcn-list" role="listbox" aria-label="Scènes">${S.scenes.map((x,k)=>`<button type="button" role="option" class="dcn-it" data-sid="${esc(x.id)}" aria-selected="${k===i}"><span class="band" style="background:${bandColor(x)}"></span><b>${esc(x.num)}</b><span class="hd">${esc(x.location||x.heading)}<small>${esc(meta(x))}</small></span>${progHTML(x)}</button>`).join("")}</div>`:""}`;
  nav.querySelectorAll(".dcn-arrow").forEach(b=>b.onclick=()=>{const j=i+Number(b.dataset.go);if(S.scenes[j]){DEC.navOpen=false;dcJump(S.scenes[j].id);}});
  nav.querySelector(".dcn-cur").onclick=()=>{DEC.navOpen=!DEC.navOpen;dcNavDraw();if(DEC.navOpen){const l=nav.querySelector(".dcn-list"),c=nav.querySelector('.dcn-it[aria-selected="true"]');if(l&&c)l.scrollTop=Math.max(0,c.offsetTop-l.clientHeight/2);}};
  nav.querySelectorAll(".dcn-it").forEach(b=>b.onclick=()=>{DEC.navOpen=false;dcJump(b.dataset.sid);});
}
document.addEventListener("scroll",()=>{if(S.tab!=="dec"||!$("#dc-scnav"))return;if(DEC.navRaf)return;DEC.navRaf=requestAnimationFrame(()=>{DEC.navRaf=0;dcNavUpdate();});},true);
document.addEventListener("click",e=>{if(DEC.navOpen&&e.target.isConnected&&!e.target.closest("#dc-scnav")){DEC.navOpen=false;dcNavDraw();}});
document.addEventListener("keydown",e=>{if(DEC.navOpen&&e.key==="Escape"){DEC.navOpen=false;dcNavDraw();}});
function dcOpts(arr,val,pairs){return arr.map(o=>{const v=pairs?o[0]:o,t=pairs?o[0]+" · "+o[1]:o;return `<option value="${esc(v)}"${v===val?" selected":""}>${esc(t)}</option>`;}).join("");}
function thumbHTML(x){
  const inner=x.img?`<img src="${esc(imgSrc(x.img))}" alt="Vignette du plan ${esc(shotNum(x))}" loading="lazy">`:picto(x.type);
  return `<button type="button" class="dc-frame" data-type="${esc(x.type)}" aria-label="Vignette du plan ${esc(shotNum(x))} : ajouter ou changer l'image">${inner}</button>`;
}
function decEditHTML(){
  const total=sumDur(S.shots);const tgt=Number(P()?.targetSec)||0;
  const cut=S.scenes.filter(s=>shotsOf(s.id).length).length;const todo=S.scenes.length-cut;
  const canAI=S.canWrite&&!S.aiOff;
  const bar=`<div class="dc-bar">
    <button class="menubtn" id="dc-menu" type="button" aria-label="Options du découpage" aria-haspopup="dialog" aria-expanded="false" title="Durée cible, plans optionnels, export"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    <div class="stats">
      <div class="stat"><b>${S.shots.length}</b><span>plan${S.shots.length>1?"s":""}</span></div>
      <div class="stat"><b>${fmtDur(total)}${tgt?`<small> / ${fmtDur(tgt)}</small>`:""}</b><span>durée estimée</span></div>
      <div class="stat"><b>${cut}<small> / ${S.scenes.length}</small></b><span>scènes découpées</span></div>
    </div>
    <div class="actions">
      ${S.canWrite?`<button class="btn icbtn" id="dc-undo" type="button" aria-label="Annuler" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button><button class="btn icbtn" id="dc-redo" type="button" aria-label="Rétablir" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>`:""}
      ${S.canWrite?`<button class="btn icbtn" id="dc-sync" title="Mettre à jour le scénario d'après le découpage" aria-label="Mettre à jour le scénario d'après le découpage" ${S.busy||!S.shots.length?"disabled":""}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3.5V8h4.5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20.5V16h-4.5"/></svg></button>`:""}
      ${S.canWrite&&scriptBackup()?`<button class="btn ghost small" id="dc-unsync" title="Rétablir le scénario d'avant la dernière mise à jour">↶ Annuler la mise à jour du scénario</button>`:""}
      ${canAI?`<button class="btn primary" id="dc-ai" ${S.busy||!todo?"disabled":""} title="${todo?"Propose les plans des scènes pas encore découpées":"Toutes les scènes ont déjà des plans"}">Découper avec l'IA${todo&&todo<S.scenes.length?" · "+todo+" scène"+(todo>1?"s":""):""}</button>`:""}
    </div></div>`;
  const note=!S.shots.length?`<div class="dc-note"><b>Le découpage est vide.</b> Ajoute les plans scène par scène avec « + Ajouter un plan »${canAI?", ou clique sur <b>Découper avec l'IA</b> pour une première proposition plan par plan":""}. Clique ensuite sur une cellule pour la modifier.</div>`:"";
  let body="";
  for(const s of S.scenes){const all=shotsOf(s.id);const nOpt=all.filter(isOpt).length;const list=DEC.showOpt?all:all.filter(x=>!isOpt(x));const rows=list.length+(S.canWrite?1:0)||1;
    const seq=`<td class="dct-seq" data-sid="${esc(s.id)}" rowspan="${rows}"><b>${esc(s.num)}</b><span class="h">${esc(s.heading)}</span><small>${all.length} plan${all.length>1?"s":""} · ${fmtDur(sumDur(all))}${nOpt?" · "+nOpt+" optionnel"+(nOpt>1?"s":"")+(DEC.showOpt?"":" masqué"+(nOpt>1?"s":"")):""}</small>${progHTML(s)}${seqAI(s,all,canAI)}</td>`;
    list.forEach((x,i)=>{body+=shotRowHTML(x,i,i===0?seq:"");});
    if(S.canWrite)body+=`<tr class="dct-add${list.length?"":" first"}">${list.length?"":seq}<td colspan="6"><button class="dc-add" data-sid="${esc(s.id)}">+ Ajouter un plan à la scène ${esc(s.num)}</button></td></tr>`;
    else if(!list.length)body+=`<tr class="first">${seq}<td colspan="6" class="dct-none">${all.length?"Plans optionnels masqués.":"Aucun plan pour cette scène."}</td></tr>`;
  }
  const table=S.scenes.length?`<div class="dct-wrap"><table class="dct"><thead><tr><th>#Séq</th><th>#Plan</th><th>Description</th><th>Audio</th><th>Caméra</th><th>Vignette</th><th>Notes</th></tr></thead><tbody>${body}</tbody></table></div>`
    :`<p class="empty" style="margin-top:20px">Ce projet n'a pas encore de scène. Importe ou écris le scénario d'abord.</p>`;
  return bar+(S.scenes.length?`<div class="dc-scnav" id="dc-scnav"></div>`:"")+`<div class="dc-inner">${note}${table}</div>`;
}
function seqAI(s,list,canAI){
  if(!canAI)return"";
  if(DEC.ai.has(s.id))return`<small><span class="spin"></span> Découpage${DEC.prog.get(s.id)?" "+esc(DEC.prog.get(s.id)):""}…</small>`;
  return list.length?`<button class="btn ghost small dc-redo" data-sid="${esc(s.id)}" ${S.busy?"disabled":""}>Redécouper avec l'IA</button>`
    :`<button class="btn small dc-ai1" data-sid="${esc(s.id)}" ${S.busy?"disabled":""}>Découper avec l'IA</button>`;
}
/* audio : tout ce qui est entre guillemets ressort dans la couleur de l'app */
function hlQuotes(s){s=String(s||"");return s.split(/(«[^»]*»|"[^"\n]*"|“[^”]*”)/).map((p,i)=>i%2?`<span class="q">${esc(p)}</span>`:esc(p)).join("")+(s.endsWith("\n")?" ":"");}
function shotRowHTML(x,i,seq){

  const ta=(f,key,ph,label,cls)=>`<textarea id="dc-${key}-${id}" data-f="${f}" class="dc-grow${cls?" "+cls:""}" rows="2" placeholder="${w?ph:""}" aria-label="${label} du plan ${n}" ${w?"":"readonly"}>${esc(x[f]||"")}</textarea>`;
  const opt=isOpt(x);const cls=[i===0?"first":"",opt?"opt":"",x.done?"done":""].filter(Boolean).join(" ");
  return `<tr data-id="${id}" id="dc-${id}"${cls?` class="${cls}"`:""}>${seq}
    <td class="dct-plan"><label class="dc-done" title="${x.done?"Plan fait":"Marquer le plan comme fait"}"><input type="checkbox" class="dc-donecb" ${x.done?"checked":""} ${w?"":"disabled"} aria-label="Plan ${n} fait"></label>${cell("dc-plan","Plan "+n+(opt?" (optionnel)":"")+" : durée et actions",`<b>${n}</b>${opt?`<small class="opt-tag">Optionnel</small>`:`<small>${esc(String(x.dur??"").replace(".",","))} s</small>`}`)}</td>
    <td class="ed dct-desc" data-l="Description">${ta("action","a","Ce qu'on voit dans le cadre…","Description")}</td>
    <td class="ed dct-audio" data-l="Audio"><div class="dc-hl"><div class="dc-hl-bg" aria-hidden="true">${hlQuotes(x.sound)}</div>${ta("sound","s","Répliques, voix off, ambiance…","Audio","dc-hl-ta")}</div></td>
    <td class="dct-cam">${cell("dc-cam","Caméra du plan "+n+" : type de plan, mouvement, angle",`<b>${esc(SHOT_T[x.type]||x.type||"")}</b><span>${esc(x.move||"")}</span><span>${esc(x.angle||"")}</span>${fx?`<span class="dc-fx">${esc(x.effect)}</span>`:""}`)}</td>
    <td class="dct-thumb">${thumbHTML(x)}</td>
    <td class="ed dct-notes" data-l="Notes">${ta("notes","n","Incrustations, accessoires…","Notes")}</td></tr>`;
}
function bindDec(box){

  on("dc-ai",decoupeAll);on("dc-menu",e=>decMenu(e.currentTarget));on("dc-sync",confirmScriptSync);on("dc-unsync",confirmScriptUndo);on("dc-undo",hUndo);on("dc-redo",hRedo);hButtons();{const ex=$("#dc-export");if(ex)ex.onclick=e=>decExportMenu(e.currentTarget);}
  box.querySelectorAll(".dc-ai1").forEach(b=>b.onclick=()=>{const s=scene(b.dataset.sid);hGroup("Découpage IA de la scène "+(s?s.num:""),()=>decoupeScene(b.dataset.sid));});
  box.querySelectorAll(".dc-redo").forEach(b=>b.onclick=()=>confirmRedo(b.dataset.sid));
  box.querySelectorAll(".dc-add").forEach(b=>b.onclick=()=>addShot(b.dataset.sid,null));
  const shotOf=el=>S.shots.find(y=>y.id===el.closest("[data-id]")?.dataset.id);
  box.querySelectorAll(".dc-frame").forEach(b=>{
    const im=b.querySelector("img");if(im)im.onerror=()=>{b.innerHTML=picto(b.dataset.type);};
    b.onclick=()=>{const x=shotOf(b);if(x)openThumb(x);};});
  box.querySelectorAll("textarea[data-f]").forEach(el=>{const id=el.closest("[data-id]").dataset.id;const f=el.dataset.f;
    el.oninput=()=>{dcGrow(el);if(el.classList.contains("dc-hl-ta"))el.previousElementSibling.innerHTML=hlQuotes(el.value);decLater(id,f,el.value);};el.onchange=()=>decNow(id,f,el.value);});
  box.querySelectorAll(".dc-cam").forEach(b=>b.onclick=()=>{const x=shotOf(b);if(x)openCamPop(x,b);});
  box.querySelectorAll(".dc-plan").forEach(b=>b.onclick=()=>{const x=shotOf(b);if(x)openPlanPop(x,b);});
  box.querySelectorAll(".dc-donecb").forEach(c=>c.onchange=()=>{const x=shotOf(c);if(!x)return;const v=c.checked;
    c.closest("tr").classList.toggle("done",v);

}

const FLABEL={action:"description",sound:"audio",notes:"notes",type:"type de plan",move:"mouvement",angle:"angle",effect:"effet",dur:"durée"};
function decNow(id,f,v){const k=id+"|"+f;clearTimeout(DEC.timers.get(k));DEC.timers.delete(k);DEC.pend.delete(k);
  const x=S.shots.find(y=>y.id===id);if(!x||x[f]===v)return;const{id:_i,...before}=hClone(x);x[f]=v;
  shotDoc(id).update({[f]:v,updatedAt:Date.now(),updatedBy:S.me?.id||null},{before,label:"Plan "+shotNum(x)+" : "+(FLABEL[f]||f),key:k}).catch(writeErr);
  if(f==="type"||f==="effect"||f==="dur")render();}
function decLater(id,f,v){const k=id+"|"+f;clearTimeout(DEC.timers.get(k));DEC.pend.set(k,{id,f,v});DEC.timers.set(k,setTimeout(()=>decNow(id,f,v),800));}
function newShotPos(sid,after){const list=shotsOf(sid);
  if(!after)return(list.length?(list[list.length-1].pos||0):0)+1024;
  const i=list.indexOf(after);const nx=list[i+1];const a=after.pos||0;return nx?(a+(nx.pos||0))/2:a+1024;}

}
async function shotAct(x,a){
  const list=shotsOf(x.sceneId);const i=list.indexOf(x);
  const LBL={up:"Plan "+shotNum(x)+" monté",down:"Plan "+shotNum(x)+" descendu",dup:"Plan "+shotNum(x)+" dupliqué",after:"Plan ajouté après le "+shotNum(x),del:"Plan "+shotNum(x)+" supprimé"};
  return hGroup(LBL[a]||"Plan modifié",()=>shotActRun(x,a,list,i));

async function shotActRun(x,a,list,i){
  try{
    if(a==="up"||a==="down"){const j=i+(a==="up"?-1:1);if(j<0||j>=list.length)return;const y=list[j];let px=x.pos||0,py=y.pos||0;
      if(px===py){await chunked(list.map((z,k)=>({z,k})),5,({z,k})=>shotDoc(z.id).update({pos:(k+1)*1024}));px=(i+1)*1024;py=(j+1)*1024;}
      await shotDoc(x.id).update({pos:py});await shotDoc(y.id).update({pos:px});return;}
    if(a==="dup"){const{id,pos,sceneId,createdAt,createdBy,updatedAt,updatedBy,src,...rest}=x;await addShot(x.sceneId,x,rest);return;}

/* découpage par l'IA */
function decPrompt(s,text,k,n,prev,extra){
  return `Tu es réalisateur et premier assistant réalisateur. Fais le découpage technique plan par plan de ce passage de scénario.

Pour chaque plan, donne :
- "type" : une valeur parmi ${SHOT_TYPES.map(t=>t[0]+" ("+t[1]+")").join(", ")}
- "move" : une valeur parmi ${MOVES.join(", ")}
- "angle" : une valeur parmi ${ANGLES.join(", ")}
- "effect" : une valeur parmi ${EFFECTS.join(", ")} (— si aucun)
- "dur" : durée estimée à l'écran, en secondes (nombre)
- "action" : ce qu'on voit dans le cadre, au présent, en une ou deux phrases courtes
- "sound" : les répliques exactes avec le nom du personnage (NOM : « réplique »), la voix off notée NOM (OFF), ou l'ambiance et les bruitages
- "notes" : incrustations, accessoires, effets visuels ou consigne de tournage utile (chaîne vide sinon)

Règles :
- Suis l'ordre du texte et couvre toute l'action et tous les dialogues de ce passage. N'invente rien d'important.
- Varie les valeurs de plan pour un montage fluide ; des plans courts sur les moments rythmés ou comiques.
- Pour tout écran de téléphone, n'utilise pas d'insert : utilise PSE, un plan serré sur la personne décalée à gauche du cadre, avec à droite une animation de ce qui se passe à l'écran (décris l'animation dans "action").
- Un personnage qui parle au spectateur : angle "Face caméra". Un arrêt sur image : effet "Arrêt sur image".
- Des durées réalistes : leur somme correspond au temps du passage à l'écran.
- Sois concis : pas de texte hors du JSON.
${extra?`- Consignes du réalisateur : ${extra}
`:""}${n>1?`
Ce passage est la partie ${k+1} sur ${n} de la scène : découpe uniquement ce passage.${prev?` Le plan précédent était : ${prev.type} — ${String(prev.action||"").slice(0,160)}`:""}
`:""}
Réponds uniquement avec ce JSON :
{"shots":[{"type":"PM","move":"Fixe","angle":"Normal","effect":"—","dur":3,"action":"…","sound":"…","notes":""}]}

Scène ${s.num} — ${s.heading}

${text}`;
}
/* une longue scène est découpée en passages, pour que chaque réponse de l'IA reste complète */
function sceneChunks(text,max=2200){
  const paras=String(text||"").split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);const out=[];let cur="";
  for(const p of paras){if(cur&&cur.length+p.length+2>max){out.push(cur);cur=p;}else cur=cur?cur+"\n\n"+p:p;}
  if(cur)out.push(cur);return out.length?out:[String(text||"")];
}
/* réponse coupée : on garde les plans complets */
function salvageShots(t){
  t=String(t||"");const i=t.indexOf("[");if(i<0)return[];const out=[];let depth=0,start=-1,inStr=false,bs=false;
  for(let k=i+1;k<t.length;k++){const c=t[k];
    if(inStr){if(bs)bs=false;else if(c==="\\")bs=true;else if(c==='"')inStr=false;continue;}
    if(c==='"'){inStr=true;continue;}
    if(c==="{"){if(depth===0)start=k;depth++;}
    else if(c==="}"){depth--;if(depth===0&&start>-1){try{out.push(JSON.parse(t.slice(start,k+1)));}catch{}start=-1;}}
    else if(c==="]"&&depth===0)break;}
  return out;
}
function validShot(it){
  const pick=(v,arr,d)=>arr.includes(v)?v:d;let type=String(it?.type||"").toUpperCase().replace(/\s+/g,"");if(type==="INSERT")type="INS";
  return{type:pick(type,SHOT_TYPES.map(t=>t[0]),"PM"),move:pick(String(it?.move||""),MOVES,"Fixe"),angle:pick(String(it?.angle||""),ANGLES,"Normal"),effect:pick(String(it?.effect||"—"),EFFECTS,"—"),
    dur:Math.max(0.5,Math.min(120,Math.round((Number(it?.dur)||3)*2)/2)),action:String(it?.action||"").slice(0,2000),sound:String(it?.sound||"").slice(0,2000),notes:String(it?.notes||"").slice(0,1000)};
}
async function decoupeScene(sid,opts={}){
  if(!S.sample||S.aiOff)return"off";
  const s=scene(sid);if(!s)return"skip";
  if(opts.bulk&&shotsOf(sid).length)return"skip";
  const parts=sceneChunks(s.body||bodyFromBlocks(sceneBlocks(s))||"");
  DEC.ai.add(sid);render();
  let made=0;
  try{
    let pos=shotsOf(sid).reduce((a,x)=>Math.max(a,x.pos||0),0);let prev=null;
    for(let k=0;k<parts.length;k++){
      if(opts.signal?.aborted)throw{code:"cancelled"};
      if(parts.length>1){DEC.prog.set(sid,(k+1)+"/"+parts.length);render();}
      let res;
      try{res=await S.sample.json(decPrompt(s,parts[k],k,parts.length,prev,opts.extra),{signal:opts.signal});}
      catch(e){const sv=e?.text?salvageShots(e.text):[];if(sv.length)res={shots:sv};else throw e;}
      const items=(Array.isArray(res?.shots)?res.shots:Array.isArray(res)?res:[]).slice(0,80).map(validShot);
      await chunked(items.map((it,i)=>({it,i})),5,({it,i})=>shotDoc(S.db.collection(base()+"/shots").doc().id).set({...it,img:null,sceneId:sid,pos:pos+(i+1)*1024,src:"ai",createdAt:Date.now(),createdBy:S.me?.id||null}));
      pos+=(items.length+1)*1024;made+=items.length;if(items.length)prev=items[items.length-1];
    }
    if(!made){if(!opts.bulk)toast("Scène "+s.num+" : l'IA n'a proposé aucun plan. Réessaie ou ajoute les plans à la main.");return"fail";}
    if(!opts.bulk)toast("Scène "+s.num+" : "+made+" plans proposés. Tout reste modifiable.");
    return"done";
  }catch(e){
    const code=e?.code||"upstream_error";
    if(code==="cancelled")return"cancelled";
    if(code==="no_key"||code==="bad_key"){window.DDC_openKey&&window.DDC_openKey(code==="bad_key");return"stop";}
    if(code==="no_credit"){toast("Crédit API Anthropic épuisé. Recharge ton compte sur console.anthropic.com.",6000);return"stop";}
    if(code==="offline"){toast("Le découpage par l'IA a besoin d'internet. Le reste fonctionne hors ligne.",5000);return"stop";}
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){S.aiOff=true;toast("L'IA n'est pas disponible pour ton compte sur cette page. Tu peux découper à la main.",5000);return"off";}
    if(code==="rate_limited"){toast("Limite d'utilisation de l'IA atteinte. Réessaie dans quelques minutes.",5000);return"stop";}
    if(code==="session_expired"){toast("Ta session a expiré. Reconnecte-toi à claude.ai.",5000);return"stop";}
    if(code==="invalid_argument"){writeErr(e);return"stop";}
    toast("Scène "+s.num+" : le découpage s'est arrêté ("+code+")"+(made?" après "+made+" plans. Utilise « + Ajouter un plan » pour compléter, ou redécoupe la scène.":". Relance-le depuis la scène."),6000);return made?"done":"fail";
  }finally{DEC.ai.delete(sid);DEC.prog.delete(sid);render();}
}
async function decoupeAll(){return hGroup("Découpage IA",decoupeAllRun);}
async function decoupeAllRun(){
  if(S.busy)return;
  const todo=S.scenes.filter(s=>!shotsOf(s.id).length).map(s=>s.id);if(!todo.length)return;
  const ctl=new AbortController();S.busy={done:0,total:todo.length,ctl,label:"Découpage"};render();
  for(const sid of todo){if(ctl.signal.aborted)break;
    const r=await decoupeScene(sid,{bulk:true,signal:ctl.signal});
    if(r==="off"||r==="stop")break;S.busy.done++;render();}
  const done=S.busy.done;S.busy=null;render();
  if(!ctl.signal.aborted)toast(done+" scène"+(done>1?"s":"")+" découpée"+(done>1?"s":"")+". Tout reste modifiable.");
}
function confirmRedo(sid){

/* vignettes : image importée ou photo prise sur place */
/* hors de claude.ai : l'image est gardée dans le plan lui-même, réduite (environ 100 Ko) */
const imgSrc=v=>/^data:image\//.test(String(v||""))?v:"/_blob/"+v;
function inlineImage(file){
  return new Promise((res,rej)=>{let url;try{url=URL.createObjectURL(file);}catch{rej({code:"invalid_argument"});return;}
    const im=new Image();
    im.onload=()=>{const max=1024,w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);const d=c.toDataURL("image/jpeg",0.78);res({id:d,url:d});};
    im.onerror=()=>{URL.revokeObjectURL(url);rej({code:"unsupported_type"});};im.src=url;});
}
function shrinkImage(file){
  return new Promise(res=>{let url;try{url=URL.createObjectURL(file);}catch{res(file);return;}
    const im=new Image();
    im.onload=()=>{const max=1600,w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>res(b&&b.size?b:file),"image/jpeg",0.86);};
    im.onerror=()=>{URL.revokeObjectURL(url);res(file);};im.src=url;});
}
function uploadErr(e){const c=e?.code;
  if(c==="too_large")return"Image trop lourde (20 Mo maximum).";
  if(c==="unsupported_type")return"Format non pris en charge : utilise une image JPG, PNG ou WebP.";
  if(c==="quota_or_state")return"L'espace de stockage des images est plein.";
  if(c==="rate_limited")return"Trop d'envois rapprochés. Réessaie dans un instant.";
  if(c==="upstream_auth")return"Session expirée : recharge la page et réessaie.";
  if(c==="invalid_argument")return"Enregistrement impossible : il faut un rôle qui peut modifier le découpage.";
  if(c==="not_granted"||c==="capability_disabled"||c==="capability_removed")return"L'ajout d'images n'est pas disponible ici.";
  return"L'envoi a échoué. Réessaie.";}
async function saveShotImage(x,id,blob,msg){
  if(!S.dl){msg.textContent="L'enregistrement sur l'appareil n'est pas disponible ici.";return;}
  try{const b=blob||await fetch(imgSrc(id)).then(r=>{if(!r.ok)throw{code:"fetch"};return r.blob();});
    const ext=b.type==="image/png"?"png":b.type==="image/webp"?"webp":"jpg";
    const name=slug(P()?.name)+"-plan-"+shotNum(x).replace(/\./g,"-")+"."+ext;
    await S.dl.save({filename:name,data:b});msg.textContent="Photo enregistrée sur l'appareil ("+name+").";}
  catch(e){const c=e?.code;msg.textContent=c==="declined"?"Photo non enregistrée sur l'appareil. Tu peux réessayer avec le bouton ci-dessus.":c==="rate_limited"?"Une demande d'enregistrement est déjà ouverte.":"L'enregistrement sur l'appareil a échoué.";}
}
function openThumb(x){

  const handle=async(file,fromCam)=>{if(!file)return;q("#th-cam").disabled=q("#th-imp").disabled=true;msg.textContent="Envoi de l'image…";
    try{const blob=await shrinkImage(file);const r=S.assets?await S.assets.upload(blob,{type:blob.type||"image/jpeg"}):await inlineImage(file);
      await shotDoc(x.id).update({img:r.id,updatedAt:Date.now(),updatedBy:S.me?.id||null},{label:"Vignette du plan "+shotNum(x)});cur=r.id;url=r.url;draw();

    catch(e){msg.textContent=uploadErr(e);}

  q("#th-file").onchange=e=>handle(e.target.files[0],false);q("#th-camf").onchange=e=>handle(e.target.files[0],true);
}

/* aperçu : export et copie */
function decRows(forExport){
  const out=[["#SÉQ","#PLAN","DESCRIPTION","AUDIO","CAMÉRA","VIGNETTE","NOTES","DURÉE (s)"]];
  for(const s of S.scenes)for(const x of shotsOf(s.id).filter(x=>forExport?!isOpt(x):DEC.showOpt||!isOpt(x)))out.push([s.num+" – "+s.heading,shotNum(x)+(isOpt(x)?" (optionnel)":""),x.action||"",x.sound||"",
    [SHOT_T[x.type]||x.type,x.move,x.angle].concat(x.effect&&x.effect!=="—"?[x.effect]:[]).filter(Boolean).join(" – "),
    (x.type||"")+" – "+(SHOT_T[x.type]||"")+(x.img?" (photo)":""),x.notes||"",String(x.dur??"").replace(".",",")]);
  return out;
}
function exportDecCSV(){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';save(fileBase(P())+"-decoupage.csv","﻿"+decRows(true).map(r=>r.map(q).join(";")).join("\r\n"));}
function copyDec(){
  const tsv=decRows().map(r=>r.map(c=>String(c??"").replace(/\t/g," ").replace(/\n/g," / ")).join("\t")).join("\n");
  const ok=()=>toast("Tableau copié : colle-le dans Sheets ou Excel.");
  const fb=()=>{const t=document.createElement("textarea");t.value=tsv;t.style.cssText="position:fixed;opacity:0;top:0;left:0";document.body.append(t);t.select();let r=false;try{r=document.execCommand("copy");}catch{}t.remove();r?ok():toast("La copie a été refusée par le navigateur.");};
  try{navigator.clipboard.writeText(tsv).then(ok,fb);}catch{fb();}
}

/* ---------- Dydz : assistant flottant (administrateur et éditeurs) ---------- */
const COP={open:false,pid:null,msgs:[],busy:false,ctl:null};
const COP_SPARK=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 4.9L19 9.8l-5.1 1.9L12 17l-1.9-5.3L5 9.8l5.1-1.9z"/><path d="M19 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>`;
function copAllowed(){return !!(S.pid&&S.canWrite&&S.sample&&!S.aiOff&&(S.isAdmin||!["viewer","commenter"].includes(S.role)));}
function renderCopilot(){
  if(COP.pid!==S.pid){COP.pid=S.pid;COP.msgs=[];if(COP.ctl)COP.ctl.abort();COP.busy=false;if($("#cop-log"))drawCop();}
  let fab=$("#cop-fab");const ok=copAllowed();
  if(!ok){if(fab)fab.hidden=true;const p=$("#cop-panel");if(p)p.hidden=true;return;}
  if(!fab){fab=document.createElement("button");fab.id="cop-fab";fab.type="button";fab.className="cop-fab";fab.setAttribute("aria-label","Ouvrir Dydz");
    fab.innerHTML=COP_SPARK+`<span>Dydz</span>`;fab.onclick=()=>toggleCop(true);document.body.append(fab);}
  fab.hidden=COP.open;const p=$("#cop-panel");if(p){p.hidden=!COP.open;const c=$("#cop-ctx");if(c)c.textContent=P()?.name||"";}
}
function toggleCop(open){
  COP.open=open;
  if(open&&!$("#cop-panel")){
    const p=document.createElement("section");p.id="cop-panel";p.className="cop-panel";p.setAttribute("role","dialog");p.setAttribute("aria-label","Dydz");
    p.innerHTML=`<header>${COP_SPARK}<div><b>Dydz</b><small id="cop-ctx"></small></div><button type="button" class="cop-x" id="cop-x" aria-label="Fermer Dydz">×</button></header>
      <div class="cop-log" id="cop-log" aria-live="polite"></div>
      <form class="cop-form" id="cop-form"><textarea id="cop-in" rows="1" placeholder="Demande à Dydz…" aria-label="Message pour Dydz"></textarea><button class="btn primary" type="submit" id="cop-send">Envoyer</button></form>`;
    document.body.append(p);
    $("#cop-x").onclick=()=>toggleCop(false);
    const inp=$("#cop-in");
    inp.oninput=()=>{inp.style.height="auto";inp.style.height=Math.min(120,inp.scrollHeight+2)+"px";};
    inp.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#cop-form").requestSubmit();}};
    $("#cop-form").onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v||COP.busy)return;inp.value="";inp.style.height="auto";copSend(v);};
    p.addEventListener("keydown",e=>{if(e.key==="Escape")toggleCop(false);});

function drawCop(){
  const log=$("#cop-log");if(!log)return;log.innerHTML="";
  const sendBtn=$("#cop-send");if(sendBtn)sendBtn.disabled=COP.busy;
  if(!COP.msgs.length){
    const intro=document.createElement("div");intro.className="cop-m b";
    intro.textContent="Bonjour ! Je peux modifier le découpage de cet épisode : redécouper une scène, raccourcir les plans pour tenir une durée, ajouter ou supprimer des plans, ou répondre à une question. Je te montre toujours ce que je propose avant de l'appliquer.";
    const chips=document.createElement("div");chips.className="cop-chips";
    const first=S.scenes[0]?.num||"1";
    ["Redécoupe la scène "+first+" avec des plans plus courts","Fais tenir tout l'épisode en 2 min 30","Combien de plans et quelle durée par scène ?"].forEach(q=>{
      const b=document.createElement("button");b.type="button";b.className="cop-chip";b.textContent=q;b.onclick=()=>copSend(q);chips.append(b);});
    log.append(intro,chips);return;}
  for(const m of COP.msgs){
    const d=document.createElement("div");d.className="cop-m "+(m.role==="user"?"u":m.role==="err"?"e":"b");
    const t=document.createElement("div");t.textContent=m.text;d.append(t);
    if(m.actions&&m.actions.length)d.append(copActionsEl(m));
    log.append(d);}
  if(COP.busy){const d=document.createElement("div");d.className="cop-m b";d.innerHTML=`<span class="spin"></span> ${esc(COP.busyText||"Dydz réfléchit…")}`;log.append(d);}
  log.scrollTop=log.scrollHeight;
}
function copActionsEl(m){
  const box=document.createElement("div");box.className="cop-acts";
  const ul=document.createElement("ul");for(const a of m.actions){const li=document.createElement("li");li.textContent=copDescribe(a,m);ul.append(li);}box.append(ul);
  const proj=copProjected(m);if(proj!=null){const p=document.createElement("div");p.className="cop-proj";p.textContent="Durée estimée après : "+fmtDur(proj)+(Number(P()?.targetSec)?" (cible "+fmtDur(P().targetSec)+")":"");box.append(p);}
  const row=document.createElement("div");row.className="row";
  const btn=(label,cls,fn)=>{const b=document.createElement("button");b.type="button";b.className="btn small "+(cls||"");b.textContent=label;b.onclick=fn;row.append(b);return b;};
  if(m.state==="pending"){btn("Appliquer","primary",()=>copApply(m)).disabled=COP.busy;btn("Ignorer","",()=>{m.state="ignored";drawCop();});}
  else if(m.state==="applying"){const s=document.createElement("span");s.className="cop-st";s.innerHTML=`<span class="spin"></span> Application en cours…`;row.append(s);}
  else if(m.state==="applied"){const s=document.createElement("span");s.className="cop-st ok";s.textContent="Appliqué";row.append(s);btn("Annuler les changements","",()=>copUndo(m)).disabled=COP.busy;}
  else if(m.state==="undone"){const s=document.createElement("span");s.className="cop-st";s.textContent="Changements annulés";row.append(s);}
  else if(m.state==="ignored"){const s=document.createElement("span");s.className="cop-st";s.textContent="Ignoré";row.append(s);}
  box.append(row);return box;
}
function copDescribe(a,m){
  const old=a._id?m.snapAll.find(x=>x.id===a._id):null;
  if(a.op==="redecoupe")return"Redécouper la scène "+a.scene+(a.budget?" en visant "+fmtDur(a.budget):"")+(a.instructions?" : "+a.instructions:"");
  if(a.op==="delete")return"Supprimer le plan "+a.plan+(old&&old.action?" ("+String(old.action).slice(0,60)+(String(old.action).length>60?"…":"")+")":"");
  if(a.op==="target")return"Durée cible : "+fmtDur(a.seconds);
  if(a.op==="add")return"Ajouter un plan à la scène "+a.scene+(a.after?" après le "+a.after:"")+" : "+(SHOT_T[a.f.type]||"Plan moyen")+(a.f.dur!=null?", "+String(a.f.dur).replace(".",",")+" s":"")+(a.f.action?" — "+a.f.action.slice(0,70):"");
  if(a.op==="update"){const ch=[];const f=a.f;
    if(f.dur!=null)ch.push("durée "+String(old?.dur??"?").replace(".",",")+" s → "+String(f.dur).replace(".",",")+" s");
    if(f.type)ch.push(SHOT_T[f.type]);if(f.move)ch.push(f.move);if(f.angle)ch.push(f.angle);if(f.effect)ch.push("effet "+f.effect);
    if(f.action!=null)ch.push("action : "+f.action.slice(0,60));if(f.sound!=null)ch.push("son modifié");if(f.notes!=null)ch.push("notes modifiées");
    return"Plan "+a.plan+" : "+(ch.join(", ")||"aucun changement");}
  return a.op;
}
function copProjected(m){
  if(m.actions.some(a=>a.op==="redecoupe"))return null;
  if(!m.actions.some(a=>a.op==="update"&&a.f.dur!=null||a.op==="delete"||a.op==="add"))return null;
  let tot=sumDur(m.snapAll);
  for(const a of m.actions){const old=a._id?m.snapAll.find(x=>x.id===a._id):null;
    if(a.op==="delete"&&old)tot-=Number(old.dur)||0;
    if(a.op==="update"&&old&&a.f.dur!=null)tot+=a.f.dur-(Number(old.dur)||0);
    if(a.op==="add")tot+=a.f.dur??3;}
  return Math.max(0,tot);
}
function copFields(a){
  const f={};const ty=String(a.type||"").toUpperCase().replace(/\s+/g,"");
  if(SHOT_T[ty])f.type=ty;if(MOVES.includes(a.move))f.move=a.move;if(ANGLES.includes(a.angle))f.angle=a.angle;if(EFFECTS.includes(a.effect))f.effect=a.effect;
  if(a.dur!=null&&a.dur!==""&&isFinite(Number(a.dur)))f.dur=Number(a.dur)<=0?0:Math.max(0.5,Math.min(120,Math.round(Number(a.dur)*2)/2));
  for(const k of["action","sound","notes"])if(typeof a[k]==="string")f[k]=a[k].slice(0,2000);
  return f;
}
function copPrompt(req){
  const tgt=Number(P()?.targetSec)||0;const tot=sumDur(S.shots);
  const cut=v=>String(v||"").replace(/\s+/g," ").trim().slice(0,140);
  const lines=[];
  for(const s of S.scenes){const list=shotsOf(s.id);
    lines.push(`Scène ${s.num} — ${s.heading}${s.synopsis?" ("+cut(s.synopsis)+")":""} · ${list.length} plans · ${Math.round(sumDur(list)*10)/10} s`);
    if(!list.length)lines.push("  (aucun plan)");
    for(const x of list)lines.push(`  ${shotNum(x)} | ${x.type} | ${x.move} | ${x.angle} | ${x.effect||"—"} | ${isOpt(x)?"0 s (optionnel)":x.dur+" s"} | ${cut(x.action)} | ${cut(x.sound)}`);}
  const hist=COP.msgs.slice(-7,-1).filter(m=>m.role!=="err").map(m=>(m.role==="user"?"Réalisateur : ":"Dydz : ")+m.text.slice(0,400)).join("\n");
  return `Tu es Dydz, l'assistant de préproduction intégré à Dydz Studio. Tu aides le réalisateur à modifier le découpage technique de l'épisode ouvert.

Projet : ${P()?.name||""}
Durée actuelle : ${Math.round(tot*10)/10} s pour ${S.shots.length} plans. Durée cible : ${tgt?tgt+" s":"non définie"}.
Valeurs autorisées — type : ${SHOT_TYPES.map(t=>t[0]+" ("+t[1]+")").join(", ")} ; move : ${MOVES.join(", ")} ; angle : ${ANGLES.join(", ")} ; effect : ${EFFECTS.join(", ")}.

Découpage actuel (plan | type | mouvement | angle | effet | durée | action | son) :
${lines.join("\n")}
${hist?`
Échanges précédents :
${hist}
`:""}
Demande du réalisateur : « ${req} »

Réponds uniquement avec ce JSON :
{"reply":"…","actions":[]}

Actions possibles :
- {"op":"redecoupe","scene":"1","budget":40,"instructions":"…"} : remplace tous les plans de la scène par un nouveau découpage fait d'après le texte de la scène ; budget = durée visée en secondes (facultatif) ; instructions = consignes de style (facultatif).
- {"op":"update","plan":"1.3","dur":2.5,"type":"GP","move":"…","angle":"…","effect":"…","action":"…","sound":"…","notes":"…"} : ne mets que les champs à changer.
- {"op":"delete","plan":"1.4"}
- {"op":"add","scene":"1","after":"1.3","type":"PM","move":"Fixe","angle":"Normal","effect":"—","dur":3,"action":"…","sound":"…","notes":""} : "after" facultatif (sinon en fin de scène).
- {"op":"target","seconds":150} : change la durée cible de l'épisode.

Règles :
- Pour une simple question, réponds dans "reply" et laisse "actions" vide.
- Pour faire tenir l'épisode dans une durée : si les scènes ont déjà des plans, raccourcis les durées et supprime les plans redondants plutôt que de tout refaire, en gardant les répliques essentielles ; si une scène n'a pas de plans, utilise "redecoupe" avec un "budget". Ajoute aussi une action "target". La somme finale doit respecter la durée demandée.
- Les numéros de plan et de scène sont ceux de la liste ci-dessus, avant toute modification.
- Pour tout écran de téléphone, utilise le type PSE (plan serré sur la personne à gauche, animation de l'écran à droite).
- Un plan à 0 s est optionnel : il reste dans le découpage mais ne compte pas dans la durée. Tu peux mettre "dur":0 pour rendre un plan optionnel au lieu de le supprimer.
- "reply" : une à trois phrases en français, en tutoyant, qui disent ce que tu proposes.`;
}
async function copSend(text){
  if(COP.busy)return;
  COP.msgs.push({role:"user",text});COP.busy=true;COP.busyText="Dydz réfléchit…";drawCop();
  const ref={},scn={};for(const s of S.scenes){scn[String(s.num)]=s.id;for(const x of shotsOf(s.id))ref[shotNum(x)]=x.id;}
  const snapAll=S.shots.map(x=>JSON.parse(JSON.stringify(x)));
  COP.ctl=new AbortController();
  try{
    let res;
    try{res=await S.sample.json(copPrompt(text),{signal:COP.ctl.signal});}
    catch(e){if(e?.text){const j=String(e.text);const i=j.indexOf("{");try{res=JSON.parse(j.slice(i,j.lastIndexOf("}")+1));}catch{throw e;}}else throw e;}
    const acts=[];
    for(const a of Array.isArray(res?.actions)?res.actions:[]){if(!a||typeof a!=="object")continue;
      const op=String(a.op||"");
      if(op==="redecoupe"&&scn[String(a.scene)])acts.push({op,scene:String(a.scene),_sid:scn[String(a.scene)],budget:Number(a.budget)>0?Math.round(Number(a.budget)):0,instructions:String(a.instructions||"").slice(0,400)});
      else if((op==="update"||op==="delete")&&ref[String(a.plan)]){const x=snapAll.find(y=>y.id===ref[String(a.plan)]);acts.push({op,plan:String(a.plan),_id:x.id,_sid:x.sceneId,f:op==="update"?copFields(a):{}});}
      else if(op==="add"&&scn[String(a.scene)])acts.push({op,scene:String(a.scene),_sid:scn[String(a.scene)],after:ref[String(a.after)]?String(a.after):"",_after:ref[String(a.after)]||null,f:copFields(a)});
      else if(op==="target"&&Number(a.seconds)>0)acts.push({op,seconds:Math.round(Number(a.seconds))});}
    const clean=acts.filter(a=>a.op!=="update"||Object.keys(a.f).length);
    COP.msgs.push({role:"bot",text:String(res?.reply||(clean.length?"Voici ce que je propose.":"Je n'ai pas de modification à proposer.")).slice(0,1500),actions:clean,state:clean.length?"pending":"",snapAll});
  }catch(e){
    const code=e?.code||"upstream_error";
    if(code==="cancelled"){COP.msgs.push({role:"err",text:"Demande annulée."});}
    else if(code==="no_key"||code==="bad_key"){COP.msgs.push({role:"err",text:"Il faut une clé API valide pour l'équipe."});window.DDC_openKey&&window.DDC_openKey(code==="bad_key");}
    else if(code==="no_credit")COP.msgs.push({role:"err",text:"Crédit API Anthropic épuisé. Recharge ton compte sur console.anthropic.com."});
    else if(code==="offline")COP.msgs.push({role:"err",text:"Dydz a besoin d'internet."});
    else if(code==="rate_limited")COP.msgs.push({role:"err",text:"Limite d'utilisation de l'IA atteinte. Réessaie dans quelques minutes."});
    else COP.msgs.push({role:"err",text:"Je n'ai pas pu répondre ("+code+"). Reformule ou réessaie."});
  }finally{COP.busy=false;COP.ctl=null;drawCop();}
}
async function copApply(m){return hGroup("Dydz : "+String(COP.msgs[COP.msgs.indexOf(m)-1]?.text||"modification").slice(0,40),()=>copApplyRun(m));}
async function copApplyRun(m){
  if(COP.busy)return;COP.busy=true;m.state="applying";COP.busyText="Application des changements…";drawCop();
  const scenes=new Set(m.actions.map(a=>a._sid).filter(Boolean));
  const snap=S.shots.filter(x=>scenes.has(x.sceneId)).map(x=>JSON.parse(JSON.stringify(x)));
  const target={had:P()?.targetSec??null};
  try{
    for(const a of m.actions){
      if(a.op==="update"){if(S.shots.some(x=>x.id===a._id))await shotDoc(a._id).update({...a.f,updatedAt:Date.now(),updatedBy:S.me?.id||null});}
      else if(a.op==="delete"){if(S.shots.some(x=>x.id===a._id))await shotDoc(a._id).delete();}
      else if(a.op==="target"){await trk("projects/"+S.pid).update({targetSec:a.seconds});}
    }
    for(const a of m.actions){
      if(a.op==="add"){const after=a._after?S.shots.find(x=>x.id===a._after):null;await addShot(a._sid,after,a.f);}
    }
    for(const a of m.actions){
      if(a.op!=="redecoupe")continue;const s=scene(a._sid);if(!s)continue;
      COP.busyText="Redécoupage de la scène "+s.num+"…";drawCop();
      await chunked(shotsOf(a._sid),5,x=>shotDoc(x.id).delete());
      const extra=[a.instructions,a.budget?"Durée totale visée pour cette scène : environ "+a.budget+" secondes.":""].filter(Boolean).join(" ");
      await decoupeScene(a._sid,{extra});
    }
    m.state="applied";m.undo={scenes:[...scenes],shots:snap,target};
    if(S.tab!=="dec")goTab("dec");
  }catch(e){m.state="pending";writeErr(e);}
  finally{COP.busy=false;drawCop();}
}
async function copUndo(m){return hGroup("Annulation Dydz",()=>copUndoRun(m));}
async function copUndoRun(m){
  if(COP.busy||!m.undo)return;COP.busy=true;COP.busyText="Retour à la version précédente…";drawCop();
  try{
    const sc=new Set(m.undo.scenes);
    await chunked(S.shots.filter(x=>sc.has(x.sceneId)),5,x=>shotDoc(x.id).delete());
    await chunked(m.undo.shots,5,x=>{const{id,...d}=x;return shotDoc(id).set(d);});
    if(m.actions.some(a=>a.op==="target"))await trk("projects/"+S.pid).update({targetSec:m.undo.target.had||0});
    m.state="undone";
  }catch(e){writeErr(e);}
  finally{COP.busy=false;drawCop();}
}

const libP={};
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{s.remove();rej();};document.head.append(s);});}
function loadLib(k){
  const L=LIBS[k];if(L.ok())return Promise.resolve();
  return libP[k]||(libP[k]=(async()=>{
    for(const src of L.src){try{await loadScript(src);if(L.ok())return;}catch{}}
    delete libP[k];throw{code:"lib"};})());
}

function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
async function shotImage(x){
  const c=document.createElement("canvas");c.width=480;c.height=270;const g=c.getContext("2d");g.fillStyle="#e9e6e1";g.fillRect(0,0,480,270);
  try{
    if(x.img){const im=await loadImg(imgSrcOf(x.img));const k=Math.max(480/im.naturalWidth,270/im.naturalHeight);const w=im.naturalWidth*k,h=im.naturalHeight*k;g.drawImage(im,(480-w)/2,(270-h)/2,w,h);}
    else throw 0;
  }catch{const im=await loadImg("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(exportPictoSVG(x.type)));g.fillStyle="#e9e6e1";g.fillRect(0,0,480,270);g.drawImage(im,0,0,480,270);}
  return c.toDataURL("image/jpeg",0.85);
}
const imgSrcOf=v=>/^data:image\//.test(String(v||""))?v:"/_blob/"+v;
async function runDecExport(kind){

  if(!S.dl){toast("L'export n'est pas disponible ici.");return;}

  try{
    await loadLib(kind==="pdf"?"jspdf":"pptx");if(kind==="pdf")await loadLib("autotable");
    const imgs=new Map();for(const g of groups)for(const x of g.list)imgs.set(x.id,await shotImage(x));

function exportTitle(groups){

  return{name:(P()?.name||"Découpage")+" · "+verTag(P()),meta:n+" plan"+(n>1?"s":"")+" · "+fmtDur(d)+" · "+new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})};
}
async function buildDecPDF(groups,imgs){
  const{jsPDF}=window.jspdf;const doc=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
  const T=exportTitle(groups);const order=[];const body=[];
  for(const g of groups){const s=g.s;
    /* pas de cellule fusionnée : elle empêchait les pages de se remplir ; la scène est détaillée sur son premier plan */
    g.list.forEach((x,i)=>{const row=[];
      row.push(i===0?{content:s.num+"\n"+s.heading+"\n"+g.list.length+" plan"+(g.list.length>1?"s":"")+" · "+fmtDur(sumDur(g.list)),styles:{fontStyle:"bold"}}:{content:s.num,styles:{fontStyle:"normal",textColor:[150,150,150]}});
      row.push(shotNum(x)+"\n"+durTxt(x),x.action||"",x.sound||"",camLine(x),"",x.notes||"");body.push(row);order.push(x.id);});}
  doc.autoTable({
    head:[["#Séq","#Plan","Description","Audio","Caméra","Vignette","Notes"]],body,startY:21,
    margin:{left:10,right:10,top:21,bottom:13},theme:"grid",rowPageBreak:"avoid",
    styles:{font:"helvetica",fontSize:8,cellPadding:1.8,valign:"top",lineColor:[205,205,205],lineWidth:0.2,textColor:[25,25,25],overflow:"linebreak"},
    headStyles:{fillColor:[242,201,76],textColor:[42,33,0],fontStyle:"bold"},
    columnStyles:{0:{cellWidth:30,fillColor:[246,244,240]},1:{cellWidth:14,fontStyle:"bold"},2:{cellWidth:62},3:{cellWidth:54},4:{cellWidth:30},5:{cellWidth:38,minCellHeight:23},6:{cellWidth:"auto",textColor:[90,90,90]}},
    didDrawCell:d=>{if(d.section==="body"&&d.column.index===5){const im=imgs.get(order[d.row.index]);if(im){const w=d.cell.width-3;doc.addImage(im,"JPEG",d.cell.x+1.5,d.cell.y+1.5,w,w*9/16);}}},
    didDrawPage:()=>{doc.setFont("helvetica","bold");doc.setFontSize(13);doc.setTextColor(25,25,25);
      let title="Découpage technique · "+T.name;while(title.length>20&&doc.getTextWidth(title)>277)title=title.slice(0,-2).trimEnd()+"…";
      doc.text(title.replace(/……$/,"…"),10,11);
      doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(110,110,110);doc.text(T.meta,10,16.5);}
  });
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(130,130,130);doc.text("Dydz Studio · page "+i+" / "+n,287,203,{align:"right"});}
  await save(fileBase(P())+"-decoupage.pdf",doc.output("blob"));

async function buildDecPPTX(groups,imgs){
  const pptx=new window.PptxGenJS();pptx.layout="LAYOUT_WIDE";pptx.title="Découpage technique";
  const T=exportTitle(groups);
  const W=[1.25,0.65,3.3,2.9,1.45,1.55,1.63];const X0=0.3,TOP=0.85,MAXY=7.15,HEAD=0.32,FS=9,LH=0.155;
  const xOf=k=>X0+W.slice(0,k).reduce((a,b)=>a+b,0);
  const lines=(txt,w)=>{const cpl=Math.max(6,Math.floor((w-0.12)*72/(FS*0.52)));return String(txt||"").split("\n").reduce((a,l)=>a+Math.max(1,Math.ceil(l.length/cpl)),0);};
  const flat=[];for(const g of groups)for(const x of g.list){
    const h=Math.max(0.98,0.14+LH*Math.max(lines(x.action,W[2]),lines(x.sound,W[3]),lines(x.notes,W[6]),lines(camLine(x),W[4]),2));flat.push({g,x,h});}
  const pages=[];let cur=[],y=TOP+HEAD;
  for(const r of flat){if(cur.length&&y+r.h>MAXY){pages.push(cur);cur=[];y=TOP+HEAD;}cur.push(r);y+=r.h;}
  if(cur.length)pages.push(cur);
  const hd=t=>({text:t,options:{bold:true,fill:{color:"F2C94C"},color:"2A2100",fontSize:9}});
  pages.forEach((rows,pi)=>{
    const sl=pptx.addSlide();sl.background={color:"FFFFFF"};
    sl.addText("Découpage technique · "+T.name,{x:X0,y:0.2,w:8.4,h:0.45,fontFace:"Arial",fontSize:16,bold:true,color:"191919",margin:0,fit:"shrink"});
    sl.addText(T.meta+"  ·  page "+(pi+1)+" / "+pages.length,{x:8.8,y:0.2,w:4.23,h:0.45,fontFace:"Arial",fontSize:10,color:"6E6E6E",align:"right",margin:0});
    const tbl=[["#Séq","#Plan","Description","Audio","Caméra","Vignette","Notes"].map(hd)];
    rows.forEach((r,i)=>{const row=[];
      if(i===0||rows[i-1].g!==r.g){const span=rows.filter(z=>z.g===r.g).length;const s=r.g.s;
        row.push({text:s.num+"\n"+s.heading+"\n"+r.g.list.length+" plans · "+fmtDur(sumDur(r.g.list)),options:{rowspan:span,bold:true,fill:{color:"F6F4F0"},fontSize:8.5}});}
      row.push({text:shotNum(r.x)+"\n"+durTxt(r.x),options:{bold:true}},{text:r.x.action||""},{text:r.x.sound||""},{text:camLine(r.x)},{text:""},{text:r.x.notes||"",options:{color:"5A5A5A"}});
      tbl.push(row);});
    sl.addTable(tbl,{x:X0,y:TOP,w:W.reduce((a,b)=>a+b,0),colW:W,rowH:[HEAD,...rows.map(r=>r.h)],fontFace:"Arial",fontSize:FS,color:"191919",valign:"top",margin:0.05,border:{type:"solid",pt:0.5,color:"C8C8C8"},autoPage:false});
    let yy=TOP+HEAD;for(const r of rows){const im=imgs.get(r.x.id);if(im)sl.addImage({data:im,x:xOf(5)+0.06,y:yy+0.06,w:W[5]-0.12,h:(W[5]-0.12)*9/16});yy+=r.h;}
  });
  const blob=await pptx.write({outputType:"blob"});
  await save(fileBase(P())+"-decoupage.pptx",blob);
}

/* découpage → blocs de scénario, sans IA */
const QUOTED=/«\s*([^»]*?)\s*»|"([^"\n]*)"|“([^”]*)”/g;
const CUE_EXT=/^(OFF|V\.?\s?O\.?|O\.?\s?S\.?|O\.?\s?C\.?|HORS[ -]CHAMP|H\.?C\.?|SUITE|CONT'D)$/i;
function soundToBlocks(sound){
  const out=[];
  for(const raw of String(sound||"").split("\n")){
    const line=raw.trim();if(!line)continue;
    const m=line.match(/^([\p{Lu}0-9][\p{Lu}0-9'’ .\-]*?)\s*((?:\([^)]*\)\s*)*)\s*:\s*(.+)$/u);
    if(!m||!/\p{Lu}{2}/u.test(m[1])){out.push({t:"a",x:line});continue;}
    const name=m[1].trim();const parens=[...m[2].matchAll(/\(([^)]*)\)/g)].map(p=>p[1].trim());
    const ext=parens.filter(p=>CUE_EXT.test(p));const dir=parens.filter(p=>!CUE_EXT.test(p));
    out.push({t:"c",x:(name+(ext.length?" ("+ext.join(") (").toUpperCase()+")":"")).toUpperCase()});
    if(dir.length)out.push({t:"p",x:"("+dir.join(", ")+")"});
    const rest=m[3].trim();
    if(/[«"“]/.test(rest)){
      let last=0;QUOTED.lastIndex=0;let q;
      while((q=QUOTED.exec(rest))){const between=rest.slice(last,q.index).trim();
        if(between){const pm=between.match(/^\(([^)]*)\)$/);out.push(pm?{t:"p",x:"("+pm[1].trim()+")"}:{t:"p",x:"("+between.replace(/^\(|\)$/g,"")+")"});}
        const d=(q[1]??q[2]??q[3]??"").trim();if(d)out.push({t:"d",x:d});last=q.index+q[0].length;}
      const tail=rest.slice(last).trim();if(tail)out.push({t:"p",x:"("+tail.replace(/^\(|\)$/g,"")+")"});
    }else out.push({t:"d",x:rest});
  }
  return out;
}
function shotsToBlocks(list){
  const out=[];
  for(const x of list){
    const a=String(x.action||"").trim();if(a)out.push({t:"a",x:a});
    for(const b of soundToBlocks(x.sound)){
      const prev=out[out.length-1];
      if(b.t==="c"&&out.length>=2){/* même personnage qui continue : on ne répète pas son nom */
        let k=out.length-1;while(k>=0&&(out[k].t==="d"||out[k].t==="p"))k--;
        if(k>=0&&out[k].t==="c"&&out[k].x===b.x&&k<out.length-1)continue;}
      if(b.t==="a"&&prev&&prev.t==="a"&&prev.x===b.x)continue;
      out.push(b);}
  }
  return out;
}
function syncPrompt(s,list){
  const cut=v=>String(v||"").replace(/\s+/g," ").trim();
  return `Tu es scénariste. Mets à jour cette scène de scénario pour qu'elle corresponde au découpage technique validé par le réalisateur.

Règles :
- Le résultat reste un scénario : pas de vocabulaire de découpage (plan serré, insert, travelling, valeur de plan, incrustation) sauf s'il figurait déjà dans le texte d'origine.
- Les répliques de la colonne « son » du découpage font foi : reprends-les telles quelles, avec le nom du personnage ; une voix off s'écrit avec le personnage « NOM (OFF) ».
- Les actions suivent l'ordre des plans. Retire ce qui n'est plus dans le découpage, ajoute ce qui est nouveau. Quand rien n'a changé, garde exactement les phrases du texte d'origine.
- N'écris pas l'en-tête de scène (il ne change pas).

Réponds uniquement avec ce JSON :
{"blocks":[{"t":"a","x":"…"},{"t":"c","x":"SOA"},{"t":"p","x":"(face caméra)"},{"t":"d","x":"…"}]}
Types : a action, c personnage, p didascalie, d dialogue, t transition.

Texte actuel de la scène ${s.num} — ${s.heading} :
${(s.body||bodyFromBlocks(sceneBlocks(s))||"").slice(0,14000)}

Découpage (plans dans l'ordre : numéro | valeur | durée | action | son) :
${list.map(x=>`${shotNum(x)} | ${SHOT_T[x.type]||x.type} | ${x.dur} s | ${cut(x.action)} | ${cut(x.sound)}`).join("\n")}`;
}
async function syncScript(sids,mode){return hGroup(mode==="ai"?"Scénario réécrit par l'IA":"Scénario mis à jour d'après le découpage",()=>syncScriptRun(sids,mode));}
async function syncScriptRun(sids,mode){
  if(S.busy)return;
  await hFlush();
  const scs=sids.map(scene).filter(Boolean);
  try{await trk(base()+"/backups/script").set({at:Date.now(),by:S.me?.id||null,scenes:scs.map(s=>({id:s.id,num:s.num,heading:s.heading,blocks:sceneBlocks(s),body:s.body||"",eighths:s.eighths||1}))});}
  catch(e){writeErr(e);return;}
  const ctl=new AbortController();S.busy={done:0,total:scs.length,ctl,label:"Scénario"};render();
  let done=0,same=0,failed=[];
  for(const s of scs){if(ctl.signal.aborted)break;
    try{
      const list=shotsOf(s.id).filter(x=>!isOpt(x));
      let blocks;
      if(mode==="ai"){
        let res;try{res=await S.sample.json(syncPrompt(s,list),{signal:ctl.signal});}
        catch(e){if(e?.text){const j=String(e.text);try{res=JSON.parse(j.slice(j.indexOf("{"),j.lastIndexOf("}")+1));}catch{throw e;}}else throw e;}
        blocks=(Array.isArray(res?.blocks)?res.blocks:[]).filter(b=>b&&BT[b.t]&&b.t!=="h"&&typeof b.x==="string"&&b.x.trim())
          .map(b=>({t:b.t,x:b.t==="c"||b.t==="t"||b.t==="s"?b.x.trim().toUpperCase():b.x.trim()}));
      }else blocks=shotsToBlocks(list);
      if(!blocks.length)throw{code:"vide"};
      if(JSON.stringify(blocks)===JSON.stringify(sceneBlocks(s))){same++;S.busy.done++;render();continue;}
      await trk(base()+"/scenes/"+s.id).update({blocks,body:bodyFromBlocks(blocks),eighths:Math.max(1,Math.round(sceneLines({blocks})/LINES_PER_PAGE*8)),updatedAt:Date.now(),updatedBy:S.me?.id||null});
      ED.sigs.delete(s.id);done++;
    }catch(e){const code=e?.code||"upstream_error";
      if(code==="cancelled")break;
      if(code==="no_key"||code==="bad_key"){window.DDC_openKey&&window.DDC_openKey(code==="bad_key");break;}
      if(["rate_limited","no_credit","offline","not_granted","sampling_disabled","capability_disabled"].includes(code)){toast("Mise à jour interrompue ("+code+"). Les scènes déjà traitées sont gardées, annulables.",6000);break;}
      failed.push(s.num);}
    S.busy.done++;render();}
  S.busy=null;render();
  toast(done+" scène"+(done>1?"s":"")+" du scénario mise"+(done>1?"s":"")+" à jour"+(same?" · "+same+" déjà identique"+(same>1?"s":""):"")+(failed.length?" · échec pour la scène "+failed.join(", "):"")+". ↶ pour annuler.",6000);
}

/* ---------- annuler / rétablir (découpage et mise à jour du scénario) ---------- */
const H={undo:[],redo:[],grp:null,busy:false,applying:false,shadow:new Map()};
const hClone=v=>v==null?null:JSON.parse(JSON.stringify(v));
function hCur(path){
  let v=null;const b=base()+"/";
  if(path==="projects/"+S.pid)v=P()||null;
  else if(path.startsWith(b)){const[col,id]=path.slice(b.length).split("/");
    const arr=col==="shots"?S.shots:col==="scenes"?S.scenes:col==="backups"?S.backups:col==="elements"?S.elements:col==="days"?S.days:col==="locations"?S.locations:null;if(arr)v=arr.find(x=>x.id===id)||null;}
  if(!v&&H.shadow.has(path))return hClone(H.shadow.get(path));
  if(!v)return null;const{id,...rest}=v;return hClone(rest);
}
function hRec(path,before,after,label,key){
  if(H.applying)return;H.shadow.set(path,hClone(after));
  if(H.grp){H.grp.ops.push({path,before,after:hClone(after)});return;}
  const last=H.undo[H.undo.length-1];
  if(key&&last&&last.key===key&&Date.now()-last.at<6000&&last.ops.length===1&&last.ops[0].path===path){last.ops[0].after=hClone(after);last.at=Date.now();}
  else{H.undo.push({label:label||"Modification",key:key||null,at:Date.now(),ops:[{path,before,after:hClone(after)}]});if(H.undo.length>80)H.undo.shift();}
  H.redo=[];hButtons();
}
/* référence suivie : chaque écriture garde l'état d'avant pour pouvoir l'annuler */
function trk(path){const ref=S.db.doc(path);return{
  async set(d,o={}){const before=o.before!==undefined?o.before:hCur(path);await ref.set(d);hRec(path,before,d,o.label,o.key);},
  async update(d,o={}){const before=o.before!==undefined?o.before:hCur(path);await ref.update(d);hRec(path,before,before?{...before,...d}:d,o.label,o.key);},
  async delete(o={}){const before=o.before!==undefined?o.before:hCur(path);await ref.delete();hRec(path,before,null,o.label,o.key);}};}
async function hGroup(label,fn){
  if(H.grp)return fn();
  H.grp={label,ops:[],at:Date.now()};
  try{return await fn();}
  finally{const g=H.grp;H.grp=null;if(g.ops.length){H.undo.push(g);if(H.undo.length>80)H.undo.shift();H.redo=[];}hButtons();}
}
async function hApply(path,val){const r=S.db.doc(path);if(val==null){try{await r.delete();}catch{}}else await r.set(val);H.shadow.set(path,hClone(val));}
async function hFlush(){for(const[k,pd]of[...DEC.pend])decNow(pd.id,pd.f,pd.v);await flushEditor();}
async function hStep(dir){
  if(H.busy||H.grp||S.busy)return;
  await hFlush();
  const from=dir<0?H.undo:H.redo,to=dir<0?H.redo:H.undo;const st=from.pop();if(!st){hButtons();return;}
  H.busy=true;H.applying=true;hButtons();
  try{const ops=dir<0?[...st.ops].reverse():st.ops;for(const o of ops)await hApply(o.path,dir<0?o.before:o.after);
    st.at=0;to.push(st);toast((dir<0?"Annulé : ":"Rétabli : ")+st.label);}
  catch(e){from.push(st);writeErr(e);}
  finally{H.applying=false;H.busy=false;ED.sigs.clear();render();hButtons();}
}
const hUndo=()=>hStep(-1),hRedo=()=>hStep(1);
function hButtons(){
  const lu=H.undo[H.undo.length-1],lr=H.redo[H.redo.length-1];
  document.querySelectorAll("#dc-undo,.h-undo").forEach(u=>{u.disabled=!lu||H.busy||!!H.grp;u.title=lu?"Annuler : "+lu.label+" (⌘Z)":"Rien à annuler";});
  document.querySelectorAll("#dc-redo,.h-redo").forEach(r=>{r.disabled=!lr||H.busy||!!H.grp;r.title=lr?"Rétablir : "+lr.label+" (⇧⌘Z)":"Rien à rétablir";});
}
document.addEventListener("click",e=>{const b=e.target.closest?.(".h-undo,.h-redo");if(!b||b.disabled)return;if(b.classList.contains("h-undo"))hUndo();else hRedo();});
document.addEventListener("keydown",e=>{
  if(!["dec","scenes","plan"].includes(S.tab)||S.home||!S.pid||!S.canWrite||document.querySelector(".scrim"))return;
  const mod=e.metaKey||e.ctrlKey;if(!mod)return;const k=e.key.toLowerCase();
  if(k!=="z"&&k!=="y")return;
  const tg=e.target;if(tg.closest&&tg.closest("input,textarea,select,[contenteditable]"))return;
  e.preventDefault();if(k==="y"||e.shiftKey)hRedo();else hUndo();

/* ---------- version du projet ---------- */
const projVer=p=>Math.max(1,Math.floor(Number(p?.version)||1));
const verTag=p=>"v"+projVer(p);
const nextVer=p=>1+Math.max(projVer(p),...(Array.isArray(p?.versions)?p.versions:Object.values(p?.versions||{})).map(v=>Number(v?.n)||0),...(p?.id===S.pid?S.snaps.map(s=>Number(s.n)||0):[0]));
function savedAgo(t){const d=(Date.now()-t)/1000;return d<60?"à l'instant":d<3600?"il y a "+Math.floor(d/60)+" min":fmtWhen(t);}
const fileBase=p=>slug(p?.name)+"-"+verTag(p);
function seriesOf(p){return p&&p.seriesId?S.projects.filter(x=>x.seriesId===p.seriesId):[p].filter(Boolean);}
function bumpVersion(){
  const p=P();if(!p)return;const n=nextVer(p);const sib=seriesOf(p);
  const m=modal(`<h3>Passer à la version ${n} ?</h3>
    <p class="empty">L'état actuel du projet est enregistré comme version ${n} : tu pourras y revenir à tout moment depuis le badge de version. Le numéro apparaît aussi dans les fichiers exportés.</p>
    <label class="row"><span class="label">Ce qui change dans cette version (facultatif)</span><textarea id="bv-note" style="min-height:70px;font-family:var(--f-ui);font-size:13.5px" placeholder="Ex. Découpage resserré à 2 min 30, nouvelles répliques de Soa"></textarea></label>
    ${sib.length>1?`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="bv-all"> Passer aussi les ${sib.length-1} autres épisodes de la série à leur version suivante</label>`:""}
    <div class="mfoot"><button class="btn" id="bv-c">Annuler</button><button class="btn primary" id="bv-ok">Passer en v${n}</button></div>`);
  const note=m.querySelector("#bv-note");note.focus();
  m.querySelector("#bv-c").onclick=()=>m.remove();
  m.querySelector("#bv-ok").onclick=async()=>{const b=m.querySelector("#bv-ok");b.disabled=true;
    const all=m.querySelector("#bv-all")?.checked;const txt=note.value.trim().slice(0,1000);
    const list=all?sib:[p];
    try{await chunked(list,4,x=>{const v=nextVer(x);const hist=Array.isArray(x.versions)?x.versions.slice(-49):[];
        return S.db.doc("projects/"+x.id).update({version:v,versions:[...hist,{n:v,at:Date.now(),by:S.me?.id||null,note:txt}]});});
      m.remove();try{await takeSnapshot({force:true,named:true,n,note:txt,label:"v"+n});}catch{}
      toast(list.length>1?list.length+" épisodes passés à leur version suivante.":"Projet passé en v"+n+" · version enregistrée.");}
    catch(e){b.disabled=false;writeErr(e);}};
